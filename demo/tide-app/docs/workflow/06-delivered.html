<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>潮汐 TIDE · 海钓赶海潮汐预报产品页 · UI 设计交付流程</title>
<style>
:root{
  --bg:#ffffff; --fg:#12181f; --muted:#5d6b7a; --line:#dfe5ec;
  --panel:#f7f9fb; --raised:#ffffff;
  --accent:#1f7a5c; --gate:#b3244a; --rework:#b5711b; --blocked:#c2410c;
  /* SVG theme hooks: the renderer emits var(--wf-*, <light fallback>) so the
     same markup follows the theme without re-rendering. */
  --wf-canvas:#ffffff;
  --wf-line:#dfe5ec;
  --wf-lane:#f7f9fb;
  --wf-lane-gate:#fdf6f7;
  --wf-lane-rework:#fbf7f4;
  --wf-node-stage-fill:#eef6f3;
  --wf-node-stage-stroke:#1f7a5c;
  --wf-node-gate-fill:#fdeff2;
  --wf-node-gate-stroke:#b3244a;
  --wf-node-rework-fill:#fdf3e7;
  --wf-node-rework-stroke:#b5711b;
  --font:ui-sans-serif,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
body[data-theme="dark"]{
  --bg:#0a151c; --fg:#e6edf3; --muted:#8fa3b0; --line:#1d2c36;
  --panel:#0f1e27; --raised:#132430;
  --accent:#4cc38a; --gate:#e5637f; --rework:#e0a355; --blocked:#f97316;
  --wf-canvas:#0f1e27;
  --wf-line:#20323d;
  --wf-lane:#12232d;
  --wf-lane-gate:#1b1a24;
  --wf-lane-rework:#1d1c18;
  --wf-node-stage-fill:#13302c;
  --wf-node-stage-stroke:#4cc38a;
  --wf-node-gate-fill:#301a24;
  --wf-node-gate-stroke:#e5637f;
  --wf-node-rework-fill:#2e2519;
  --wf-node-rework-stroke:#e0a355;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.6;
  -webkit-font-smoothing:antialiased}
/* One screen, no page scroll: the board absorbs the remaining height and the
   diagram scales to fit. Detail opens in a side drawer instead of below. */
html,body{height:100%}
body{overflow:hidden}
.wf-shell{height:100vh;display:flex;flex-direction:column;gap:10px;
  max-width:none;padding:12px 18px 14px}

/* Top bar: brand on the left, compact icon toolbar on the right. */
.wf-topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  padding:14px 0 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20}
.wf-brand{display:flex;align-items:center;gap:10px;min-width:0}
.wf-pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;
  box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);animation:wf-pulse 2.6s ease-out infinite}
@keyframes wf-pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}
  70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.wf-brand-text{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.wf-brand-task{font-size:12px;color:var(--muted);padding-left:10px;border-left:1px solid var(--line);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34ch}
.wf-toolbar{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid var(--line);
  border-radius:11px;background:var(--panel)}
.wf-tool{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border:0;
  border-radius:8px;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;
  transition:background .16s,color .16s}
.wf-tool:hover{background:var(--raised);color:var(--fg)}
.wf-tool:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wf-tool[aria-pressed="true"]{background:var(--raised);color:var(--fg)}
.wf-tool-dot{width:11px;height:11px;border-radius:3px;background:var(--fg);flex:none;opacity:.75}

/* Status bar: the answer to "where is this task" in one line. */
.wf-status-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12.5px;flex:none}
.wf-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;
  border-radius:7px;padding:3px 10px;color:#fff;background:var(--muted)}
.wf-chip-passed{background:var(--accent)}
.wf-chip-gated{background:var(--gate)}
.wf-chip-blocked{background:var(--blocked)}
.wf-chip-active{background:var(--accent)}
.wf-status-progress{font-variant-numeric:tabular-nums;color:var(--muted)}
.wf-status-progress strong{color:var(--fg);font-size:14px}
.wf-status-blocked{color:var(--blocked)}
.wf-status-where{color:var(--muted)}
.wf-status-rev{font-family:var(--mono);font-size:11.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:1px 7px}


/* Stage rail: each node lights according to its real status. */
.wf-rail-wrap{flex:none}
.wf-rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;
  list-style:none;margin:0;padding:0;overflow-x:auto}
.wf-rail-item{min-width:0}
.wf-rail-btn{display:flex;align-items:center;gap:7px;width:100%;min-height:34px;padding:5px 9px;
  border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--muted);
  font:inherit;font-size:12.5px;cursor:pointer;text-align:left;transition:border-color .16s,background .16s,color .16s}
.wf-rail-btn:hover{border-color:var(--accent)}
.wf-rail-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wf-rail-mark{font-size:12px;width:1em;text-align:center;flex:none}
.wf-rail-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf-rail-item[data-status="passed"] .wf-rail-btn{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.wf-rail-item[data-status="gated"] .wf-rail-btn{color:var(--gate);border-color:color-mix(in srgb,var(--gate) 45%,var(--line))}
.wf-rail-item[data-status="blocked"] .wf-rail-btn{color:var(--blocked);border-color:color-mix(in srgb,var(--blocked) 45%,var(--line))}
.wf-rail-item[data-status="active"] .wf-rail-btn{color:var(--accent)}
.wf-rail-item[data-current="true"] .wf-rail-btn{background:var(--raised);color:var(--fg);
  box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:650}

/* Board: fills the remaining height; the SVG scales to fit, no page scroll. */
.wf-board{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:14px;
  background:var(--panel);overflow:hidden;display:flex}
.wf-canvas{padding:12px;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden}
.wf-svg{display:block;width:100%;height:100%;max-width:none}
.wf-svg text{fill:var(--fg)}
.wf-lane-label{fill:var(--muted) !important;font-size:12px;font-weight:650}
.wf-col-label{fill:var(--fg) !important;font-size:13px;font-weight:650}
.wf-col-meta{fill:var(--muted) !important;font-size:11px}
.wf-node-step{fill:var(--muted) !important;font-size:10px;font-weight:700}
.wf-node-title{fill:var(--fg) !important;font-size:13.5px;font-weight:650}
.wf-node-sub{fill:var(--muted) !important;font-size:11px}
.wf-edge-label{fill:var(--muted) !important;font-size:10.5px}
.wf-status-glyph{fill:#fff !important;font-size:10px;font-weight:700}
.wf-node{cursor:pointer}
.wf-node:focus-visible{outline:none}
.wf-node:focus-visible rect{stroke-width:3.5}
.wf-node[data-selected="true"] rect{stroke-width:3.5}
.wf-node[data-dim="true"]{opacity:.26}
.wf-edge[data-dim="true"]{opacity:.16}
body[data-labels="off"] .wf-edge-label{display:none}
body[data-focus="on"] .wf-node[data-dim="true"]{opacity:.14}

/* Detail drawer: slides in over the board instead of pushing it down. */
.wf-drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:40;
  background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;
  box-shadow:-18px 0 40px rgba(0,0,0,.28);padding:18px 18px 22px}
.wf-drawer[hidden]{display:none}
.wf-drawer-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:8px;
  border:1px solid var(--line);background:var(--raised);color:var(--muted);font-size:17px;line-height:1;
  cursor:pointer}
.wf-drawer-close:hover{color:var(--fg)}
.wf-drawer-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wf-drawer .wf-card{border:0;background:transparent;padding:0}

/* Embedded artifact: the document itself, readable in the drawer. */
.wf-artifacts{display:grid;gap:14px}
.wf-artifact{border:1px solid var(--line);border-radius:10px;background:var(--raised);overflow:hidden}
.wf-artifact-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 11px;
  border-bottom:1px solid var(--line);background:var(--panel)}
.wf-artifact-state{font-size:11px;color:var(--muted);margin-left:auto}
.wf-artifact-tools{display:flex;gap:6px;padding:8px 11px;border-bottom:1px solid var(--line)}
.wf-mini{min-height:28px;padding:0 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);color:var(--muted);font:inherit;font-size:11.5px;cursor:pointer}
.wf-mini:hover{color:var(--fg);border-color:var(--accent)}
.wf-mini:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wf-artifact-frame{display:block;width:100%;height:340px;border:0;background:#fff}
.wf-artifact-src{margin:0;max-height:340px;overflow:auto;font-family:var(--mono);font-size:11px;
  padding:10px 12px;white-space:pre-wrap}
.wf-artifact-doc{max-height:440px;overflow:auto;padding:12px 14px}
.wf-artifact-missing{margin:0;padding:12px 14px;font-size:12.5px;color:var(--muted)}
.wf-artifact-doc .md-h1{font-size:16px;margin:0 0 8px}
.wf-artifact-doc .md-h2{font-size:14px;margin:14px 0 6px}
.wf-artifact-doc .md-h3{font-size:13px;margin:12px 0 5px;color:var(--muted)}
.wf-artifact-doc .md-h4,.wf-artifact-doc .md-h5,.wf-artifact-doc .md-h6{font-size:12.5px;margin:10px 0 4px;color:var(--muted)}
.wf-artifact-doc .md-p{margin:0 0 8px;font-size:12.5px;line-height:1.75}
.wf-artifact-doc .md-list{margin:0 0 8px;padding-left:18px;font-size:12.5px;line-height:1.75}
.wf-artifact-doc .md-quote{margin:0 0 8px;padding-left:10px;border-left:2px solid var(--line);color:var(--muted);font-size:12.5px}
.wf-artifact-doc .md-code{font-family:var(--mono);font-size:11.5px;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.wf-artifact-doc .md-pre{margin:0 0 8px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;overflow:auto;font-family:var(--mono);font-size:11px;line-height:1.6}
.wf-artifact-doc .md-hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.wf-artifact-doc .md-table-wrap{overflow:auto;margin:0 0 10px}
.wf-artifact-doc .md-table{border-collapse:collapse;font-size:11.5px;min-width:100%}
.wf-artifact-doc .md-table th,.wf-artifact-doc .md-table td{border:1px solid var(--line);
  padding:5px 8px;text-align:left;vertical-align:top}
.wf-artifact-doc .md-table th{background:var(--panel);font-weight:650}
.wf-artifact-doc .md-link{color:var(--accent)}
.wf-card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:18px 20px}
.wf-card-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.wf-card-kind{font-size:11px;font-weight:650;letter-spacing:.04em;border-radius:6px;padding:2px 8px;
  color:#fff;background:var(--muted)}
.wf-card-kind-stage{background:var(--accent)}
.wf-card-kind-gate{background:var(--gate)}
.wf-card-kind-rework{background:var(--rework)}
.wf-card h2{margin:0;font-size:17px;font-weight:680}
.wf-card-status{font-size:12px;font-weight:650;border-radius:6px;padding:2px 9px;color:#fff;background:var(--muted)}
.wf-card-status[data-status="passed"]{background:var(--accent)}
.wf-card-status[data-status="gated"]{background:var(--gate)}
.wf-card-status[data-status="blocked"]{background:var(--blocked)}
.wf-card-summary{margin:12px 0 0;font-size:13.5px;color:var(--muted);max-width:74ch}
.wf-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}
.wf-field{border-top:1px solid var(--line);padding-top:12px}
.wf-field h3{margin:0 0 6px;font-size:11.5px;font-weight:650;letter-spacing:.04em;color:var(--muted)}
.wf-field p{margin:0;font-size:13px}
.wf-field ul{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.wf-field li{font-size:12.5px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.wf-path{font-family:var(--mono);font-size:11.5px;background:var(--raised);border:1px solid var(--line);
  border-radius:5px;padding:2px 7px;color:var(--fg);word-break:break-all}
.wf-expected{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:5px;padding:1px 6px}
.wf-note-line{margin:10px 0 0;font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.wf-wait{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gate);font-weight:650}
.wf-gate-list{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.wf-gate-item{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--raised)}
.wf-gate-item strong{font-size:13px}
.wf-gate-item p{margin:5px 0 0;font-size:12.5px;color:var(--muted)}

@media (min-width:900px){
  .wf-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
}
@media (max-width:640px){
  .wf-shell{padding:10px 12px 12px;gap:8px}
  .wf-brand-task{display:none}
  .wf-tool-label{display:none}
  .wf-tool{min-height:40px;padding:0 11px}
  .wf-canvas{padding:8px}
  .wf-drawer{width:100vw;border-left:0}
}
@media (prefers-reduced-motion:reduce){
  .wf-pulse{animation:none}
}
</style>
</head>
<body data-theme="dark">
<div class="wf-shell">

<header class="wf-topbar">
  <div class="wf-brand">
    <span class="wf-pulse" aria-hidden="true"></span>
    <span class="wf-brand-text">UI 设计交付流程</span>
    <span class="wf-brand-task">潮汐 TIDE · 海钓赶海潮汐预报产品页</span>
  </div>
  <div class="wf-toolbar" role="toolbar" aria-label="视图控制">
    <button type="button" class="wf-tool" id="wf-theme" aria-pressed="true" title="切换明暗主题">
      <span class="wf-tool-dot" aria-hidden="true"></span><span class="wf-tool-label">深色</span>
    </button>
    <button type="button" class="wf-tool" id="wf-focus" aria-pressed="false" title="只高亮当前阶段，其余变暗">
      <span class="wf-tool-label">聚焦</span>
    </button>
    <button type="button" class="wf-tool" id="wf-labels" aria-pressed="true" title="显示或隐藏连线说明">
      <span class="wf-tool-label">标注</span>
    </button>
    <button type="button" class="wf-tool" id="wf-export" title="导出当前图为 SVG">
      <span class="wf-tool-label">导出</span>
    </button>
  </div>
</header>

<section class="wf-status-bar" aria-label="任务状态">
  <span class="wf-chip wf-chip-passed">已通过</span>
  <span class="wf-status-progress"><strong>6</strong> / 6 阶段</span>
  <span class="wf-status-where">当前停在 <strong>交付与迭代</strong></span>
  <span class="wf-status-rev">P-tide-1</span>
  
</section>

<section class="wf-rail-wrap">
  <ol class="wf-rail" aria-label="阶段推进">
    <li class="wf-rail-item" data-stage="brief" data-status="passed"><button type="button" class="wf-rail-btn" data-stage="brief" aria-label="需求与方向，已通过"><span class="wf-rail-mark" aria-hidden="true">✓</span><span class="wf-rail-name">需求与方向</span></button></li><li class="wf-rail-item" data-stage="reference" data-status="passed"><button type="button" class="wf-rail-btn" data-stage="reference" aria-label="参考素材，已通过"><span class="wf-rail-mark" aria-hidden="true">✓</span><span class="wf-rail-name">参考素材</span></button></li><li class="wf-rail-item" data-stage="contract" data-status="passed"><button type="button" class="wf-rail-btn" data-stage="contract" aria-label="原型与契约，已通过"><span class="wf-rail-mark" aria-hidden="true">✓</span><span class="wf-rail-name">原型与契约</span></button></li><li class="wf-rail-item" data-stage="build" data-status="passed"><button type="button" class="wf-rail-btn" data-stage="build" aria-label="交互实现，已通过"><span class="wf-rail-mark" aria-hidden="true">✓</span><span class="wf-rail-name">交互实现</span></button></li><li class="wf-rail-item" data-stage="verify" data-status="passed"><button type="button" class="wf-rail-btn" data-stage="verify" aria-label="浏览器验证，已通过"><span class="wf-rail-mark" aria-hidden="true">✓</span><span class="wf-rail-name">浏览器验证</span></button></li><li class="wf-rail-item" data-stage="deliver" data-status="passed" data-current="true"><button type="button" class="wf-rail-btn" data-stage="deliver" aria-label="交付与迭代，已通过"><span class="wf-rail-mark" aria-hidden="true">✓</span><span class="wf-rail-name">交付与迭代</span></button></li>
  </ol>
</section>

<section class="wf-board">
  <div class="wf-canvas" id="wf-canvas">
    <svg style="width:1580px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 670" role="img" aria-labelledby="wf-title wf-desc" class="wf-svg">
<title id="wf-title">UI 设计交付流程</title>
<desc id="wf-desc">状态取自任务记录，阶段与确认门来自 tooling/workflow-stages.json。</desc>
<defs><marker id="wf-arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a6"/></marker><marker id="wf-arrow-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a5c"/></marker><marker id="wf-arrow-gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3244a"/></marker><marker id="wf-arrow-rework" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5711b"/></marker><marker id="wf-arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5711b"/></marker><marker id="wf-arrow-trace" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7a8c"/></marker></defs>
<rect x="0" y="0" width="1580" height="670" fill="var(--wf-canvas, #ffffff)"/>
<g class="wf-lane" data-lane="main"><rect x="16" y="92" width="1548" height="90" rx="10" fill="var(--wf-lane, #f7f9fb)" stroke="var(--wf-line, #dfe5ec)" stroke-width="1"/><line x1="148" y1="100" x2="148" y2="174" stroke="var(--wf-line, #dfe5ec)" stroke-width="1"/><text x="28" y="141" class="wf-lane-label">主代理</text></g>
<g class="wf-lane" data-lane="sub"><rect x="16" y="192" width="1548" height="164" rx="10" fill="var(--wf-lane, #f7f9fb)" stroke="var(--wf-line, #dfe5ec)" stroke-width="1"/><line x1="148" y1="200" x2="148" y2="348" stroke="var(--wf-line, #dfe5ec)" stroke-width="1"/><text x="28" y="278" class="wf-lane-label">子代理</text></g>

(function(){
  var STAGES = [{"id":"brief","name":"需求与方向","gates":["A"],"summary":"确认用户、主要任务、页面范围与视觉方向。","output":"需求说明 / 方向记录","evidence":"方向稿（DIRECTION.md 或任务内记录）","decisionPoint":true,"status":"passed","stageNote":"门A 通过，附 4 项强制修正。","evidenceActual":"docs/DIRECTION.md · docs/GATE-A-DECISION.md","isCurrent":false,"gateNodes":[{"id":"A","title":"门A 设计稿","detail":"方向稿（视觉基调、页面结构草案、动效意图，不写代码）","status":"passed","lane":"user"}],"artifacts":[{"path":"docs/DIRECTION.md","status":"ok","kind":"markdown","reason":null,"bytes":3347,"html":"<h1 class=\"md-h1\">潮汐 TIDE · 方向稿（门A）</h1>\n<blockquote class=\"md-quote\"><p class=\"md-p\">本文件是「初步设计稿」环节的产物：视觉基调、页面结构草案、动效意图。 按链路规则，此阶段<strong>不写实现代码</strong>。用户确认本稿后才进入素材调研。</p></blockquote>\n<h2 class=\"md-h2\">一、任务理解</h2>\n<ul class=\"md-list\"><li><strong>产品</strong>：潮汐 TIDE —— 面向海钓与赶海人群的潮汐预报产品页</li><li><strong>用户</strong>：周末出海钓鱼的人、带孩子赶海的家长；他们关心&quot;几点退潮、几点能下水&quot;</li><li><strong>主要任务</strong>：让访客在 10 秒内看懂&quot;这个 App 能告诉我今天什么时候能下水&quot;，并愿意试</li><li><strong>第一版范围</strong>：单页产品页 + 一个可真实交互的潮汐曲线</li><li><strong>非目标</strong>：不做账号、不做真实潮汐数据接入（演示数据）、不做多语言</li></ul>\n<h2 class=\"md-h2\">二、为什么选这个题材</h2>\n<p class=\"md-p\">现有 9 个 demo 覆盖运营台、3D 游戏、手机产品页、博客、效率工具，<strong>没有一个是&quot;数据随时间的自然节律&quot;这类题材</strong>。潮汐的特点是：它的美来自真实数据形态（一天两次涨落、月相影响），而不是来自装饰。这能检验视觉方向是否服务于数据本身。</p>\n<h2 class=\"md-h2\">三、视觉基调</h2>\n<p class=\"md-p\"><strong>方向：深海底蓝 + 潮线荧光青，像看一块被水浸过的仪器面板。</strong></p>\n<ul class=\"md-list\"><li>深色为主（#071a24 一类），因为赶海人凌晨看手机、海钓人多在户外强光下——深底配高对比数据线比浅底更耐看</li><li>单一强调色：潮线青（#3fd6c8 一类），只用在&quot;数据&quot;和&quot;当前时间&quot;上，不用在装饰上</li><li>不用渐变球、不用玻璃拟态堆叠——那些是 AI 味最重的信号</li><li>数字用等宽字体，因为潮位是读数</li></ul>\n<p class=\"md-p\"><strong>具名基线</strong>：<code class=\"md-code\">awesome-design-md</code> 的 <code class=\"md-code\">linear.app</code> 与 <code class=\"md-code\">vercel</code>（深色高对比、克制强调色、数据优先）。授权：MIT 分析文档，改编关系不照搬。</p>\n<h2 class=\"md-h2\">四、页面结构草案</h2>\n<pre class=\"md-pre\"><code>1  顶部     品牌 + 一句价值主张 + &quot;看今天的潮汐&quot; 主按钮\n2  核心     潮汐曲线（可拖动时间轴）+ 当前潮位读数\n3  节律     一日两次涨落的说明（用真实曲线形态讲，不用图标堆）\n4  场景     海钓 / 赶海 / 摄影 三个使用场景（横排，克制）\n5  结尾     下载引导（演示性质，标注为演示）</code></pre>\n<p class=\"md-p\"><strong>结构理由</strong>：核心交互放在第二屏，因为它是这个产品唯一不可替代的东西。常见做法是把 hero 做成大图，但这个产品的 hero 就是那条曲线本身。</p>\n<h2 class=\"md-h2\">五、动效意图</h2>\n<ul class=\"md-list\"><li>曲线入场：从左到右描线（draw-on），让数据&quot;被画出来&quot;而不是&quot;跳出来&quot;</li><li>拖动时间轴：读数与曲线游标<strong>弹簧跟随</strong>，不是线性插值</li><li>当前时刻标记：缓慢脉冲，唯一允许的循环动画</li><li>全部遵循 <code class=\"md-code\">motion-contract.md</code>：弹簧预设、<code class=\"md-code\">prefers-reduced-motion</code> 下降级为静态</li></ul>\n<h2 class=\"md-h2\">六、风险与未知</h2>\n<ul class=\"md-list\"><li><strong>待确认</strong>：潮汐数据用演示数据（正弦叠加模拟半日潮）是否可以？还是需要接真实公开数据源？</li><li><strong>待确认</strong>：受众是中文为主还是中英双语？（影响文案与字体）</li><li><strong>已知限制</strong>：不接真实数据时，&quot;预报&quot;二字需要谨慎使用，页面上应标注为演示数据</li></ul>\n<h2 class=\"md-h2\">七、需要用户裁决的点（门A）</h2>\n<ol class=\"md-list\"><li>方向是否认可（深海底蓝 + 潮线青 + 曲线为核心）</li><li>演示数据是否可以接受</li><li>是否有需要保留/避免的具体元素</li></ol>","source":"# 潮汐 TIDE · 方向稿（门A）\n\n> 本文件是「初步设计稿」环节的产物：视觉基调、页面结构草案、动效意图。\n> 按链路规则，此阶段**不写实现代码**。用户确认本稿后才进入素材调研。\n\n## 一、任务理解\n\n- **产品**：潮汐 TIDE —— 面向海钓与赶海人群的潮汐预报产品页\n- **用户**：周末出海钓鱼的人、带孩子赶海的家长；他们关心\"几点退潮、几点能下水\"\n- **主要任务**：让访客在 10 秒内看懂\"这个 App 能告诉我今天什么时候能下水\"，并愿意试\n- **第一版范围**：单页产品页 + 一个可真实交互的潮汐曲线\n- **非目标**：不做账号、不做真实潮汐数据接入（演示数据）、不做多语言\n\n## 二、为什么选这个题材\n\n现有 9 个 demo 覆盖运营台、3D 游戏、手机产品页、博客、效率工具，**没有一个是\"数据随时间的自然节律\"这类题材**。潮汐的特点是：它的美来自真实数据形态（一天两次涨落、月相影响），而不是来自装饰。这能检验视觉方向是否服务于数据本身。\n\n## 三、视觉基调\n\n**方向：深海底蓝 + 潮线荧光青，像看一块被水浸过的仪器面板。**\n\n- 深色为主（#071a24 一类），因为赶海人凌晨看手机、海钓人多在户外强光下——深底配高对比数据线比浅底更耐看\n- 单一强调色：潮线青（#3fd6c8 一类），只用在\"数据\"和\"当前时间\"上，不用在装饰上\n- 不用渐变球、不用玻璃拟态堆叠——那些是 AI 味最重的信号\n- 数字用等宽字体，因为潮位是读数\n\n**具名基线**：`awesome-design-md` 的 `linear.app` 与 `vercel`（深色高对比、克制强调色、数据优先）。授权：MIT 分析文档，改编关系不照搬。\n\n## 四、页面结构草案\n\n```\n1  顶部     品牌 + 一句价值主张 + \"看今天的潮汐\" 主按钮\n2  核心     潮汐曲线（可拖动时间轴）+ 当前潮位读数\n3  节律     一日两次涨落的说明（用真实曲线形态讲，不用图标堆）\n4  场景     海钓 / 赶海 / 摄影 三个使用场景（横排，克制）\n5  结尾     下载引导（演示性质，标注为演示）\n```\n\n**结构理由**：核心交互放在第二屏，因为它是这个产品唯一不可替代的东西。常见做法是把 hero 做成大图，但这个产品的 hero 就是那条曲线本身。\n\n## 五、动效意图\n\n- 曲线入场：从左到右描线（draw-on），让数据\"被画出来\"而不是\"跳出来\"\n- 拖动时间轴：读数与曲线游标**弹簧跟随**，不是线性插值\n- 当前时刻标记：缓慢脉冲，唯一允许的循环动画\n- 全部遵循 `motion-contract.md`：弹簧预设、`prefers-reduced-motion` 下降级为静态\n\n## 六、风险与未知\n\n- **待确认**：潮汐数据用演示数据（正弦叠加模拟半日潮）是否可以？还是需要接真实公开数据源？\n- **待确认**：受众是中文为主还是中英双语？（影响文案与字体）\n- **已知限制**：不接真实数据时，\"预报\"二字需要谨慎使用，页面上应标注为演示数据\n\n## 七、需要用户裁决的点（门A）\n\n1. 方向是否认可（深海底蓝 + 潮线青 + 曲线为核心）\n2. 演示数据是否可以接受\n3. 是否有需要保留/避免的具体元素\n"},{"path":"docs/GATE-A-DECISION.md","status":"ok","kind":"markdown","reason":null,"bytes":3308,"html":"<h1 class=\"md-h1\">门A 裁决记录（审核官扮演真实用户）</h1>\n<blockquote class=\"md-quote\"><p class=\"md-p\">角色说明：本轮由审核官扮演<strong>真实用户</strong>，代行门A–E 的裁决，用户本人不参与。 裁决必须给出<strong>具体、可执行</strong>的意见，并说明依据；不得以&quot;看起来不错&quot;通过。</p></blockquote>\n<h2 class=\"md-h2\">门A · 设计稿（阶段 1）</h2>\n<p class=\"md-p\"><strong>裁决时间</strong>：2026-09-16 <strong>裁决人</strong>：审核官（扮演：一位每年出海 10 次左右的海钓爱好者，用手机看潮汐）</p>\n<h3 class=\"md-h3\">逐条审阅方向稿</h3>\n<p class=\"md-p\"><strong>1. 方向基调（深海底蓝 + 潮线青）— 通过</strong></p>\n<p class=\"md-p\">理由：这个选择有真实依据，不是审美偏好。赶海确实多在清晨或夜间，海钓也常在户外强光下——深底在两种极端环境下都比浅底耐受。强调色只用于数据也是对的：潮位读数是这个页面的主角。</p>\n<p class=\"md-p\">但有一条<strong>必须修正</strong>：</p>\n<blockquote class=\"md-quote\"><p class=\"md-p\">方向稿写&quot;深色为主（#071a24 一类）&quot;。这个色值太暗，接近纯黑偏蓝。在户外强光下，过深的底色会让屏幕反光变成一面镜子，反而看不清。<strong>要求</strong>：底色不能暗于 <code class=\"md-code\">#0d2431</code> 级别，且正文与底色对比度不低于 7:1（不是 4.5:1——户外环境下要留余量）。</p></blockquote>\n<p class=\"md-p\"><strong>2. 结构（核心交互放第二屏）— 通过</strong></p>\n<p class=\"md-p\">理由：把可拖动的潮汐曲线放第二屏是对的，这条曲线是唯一不可替代的东西。但方向稿没写清楚<strong>第一屏到底放什么</strong>。&quot;品牌 + 一句价值主张 + 主按钮&quot;太笼统，那可以是任何产品的 hero。</p>\n<blockquote class=\"md-quote\"><p class=\"md-p\"><strong>要求</strong>：第一屏必须让访客在不滚动的情况下看到<strong>今天的潮位读数</strong>（哪怕是静态的）。海钓的人打开页面最想知道的就是这个，不是看一句 slogan。</p></blockquote>\n<p class=\"md-p\"><strong>3. 演示数据 — 有条件通过</strong></p>\n<p class=\"md-p\">理由：不接真实数据源是对的（第一版范围）。但<strong>必须满足</strong>：</p>\n<blockquote class=\"md-quote\"><p class=\"md-p\"><strong>要求</strong>：页面上任何出现&quot;预报&quot;字样的地方，旁边必须标注这是演示数据。不能让人误以为是真的潮汐预报——这是要下海的人，误信会有安全风险。这条不是法律免责，是诚实底线。</p></blockquote>\n<p class=\"md-p\"><strong>4. 动效意图 — 通过</strong></p>\n<p class=\"md-p\">理由：曲线 draw-on、拖动弹簧跟随、当前时刻脉冲，三条都合理。脉冲作为唯一循环动画也是克制的做法。</p>\n<blockquote class=\"md-quote\"><p class=\"md-p\"><strong>补充要求</strong>：曲线要能<strong>键盘操作</strong>。海钓的人戴手套，触屏不灵；键盘可操作也覆盖了无障碍。拖动轴必须是真正的 <code class=\"md-code\">input[type=range]</code> 或等价的可聚焦控件，不能是纯鼠标拖拽的 div。</p></blockquote>\n<p class=\"md-p\"><strong>5. 未决问题 — 裁决如下</strong></p>\n<ul class=\"md-list\"><li>中英双语还是中文为主 → <strong>中文为主</strong>。目标用户是国内海钓/赶海人群，双语会把第一版拖长。</li><li>演示数据是否可接受 → 可以，见第 3 条的条件。</li></ul>\n<h3 class=\"md-h3\">门A 结论：<strong>通过，附 4 项强制修正</strong></h3>\n<p class=\"md-p\">修正项（实现阶段必须满足，验证阶段会逐条核对）：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>#</th><th>修正项</th><th>核对方式</th></tr></thead><tbody><tr><td>A1</td><td>底色不暗于 <code class=\"md-code\">#0d2431</code> 级别；正文对比度 ≥ 7:1</td><td>计算对比度实测</td></tr><tr><td>A2</td><td>第一屏不滚动即可见今日潮位读数</td><td>首屏截图核对</td></tr><tr><td>A3</td><td>所有&quot;预报&quot;字样旁标注演示数据</td><td>文案逐条检查</td></tr><tr><td>A4</td><td>曲线轴可键盘操作（可聚焦控件 + 方向键）</td><td>键盘走查</td></tr></tbody></table></div>\n<h3 class=\"md-h3\">下一步</h3>\n<p class=\"md-p\">进入阶段 2（素材调研），子代理 A 产出候选清单后停在门B。</p>","source":"# 门A 裁决记录（审核官扮演真实用户）\n\n> 角色说明：本轮由审核官扮演**真实用户**，代行门A–E 的裁决，用户本人不参与。\n> 裁决必须给出**具体、可执行**的意见，并说明依据；不得以\"看起来不错\"通过。\n\n## 门A · 设计稿（阶段 1）\n\n**裁决时间**：2026-09-16\n**裁决人**：审核官（扮演：一位每年出海 10 次左右的海钓爱好者，用手机看潮汐）\n\n### 逐条审阅方向稿\n\n**1. 方向基调（深海底蓝 + 潮线青）— 通过**\n\n理由：这个选择有真实依据，不是审美偏好。赶海确实多在清晨或夜间，海钓也常在户外强光下——深底在两种极端环境下都比浅底耐受。强调色只用于数据也是对的：潮位读数是这个页面的主角。\n\n但有一条**必须修正**：\n\n> 方向稿写\"深色为主（#071a24 一类）\"。这个色值太暗，接近纯黑偏蓝。在户外强光下，过深的底色会让屏幕反光变成一面镜子，反而看不清。**要求**：底色不能暗于 `#0d2431` 级别，且正文与底色对比度不低于 7:1（不是 4.5:1——户外环境下要留余量）。\n\n**2. 结构（核心交互放第二屏）— 通过**\n\n理由：把可拖动的潮汐曲线放第二屏是对的，这条曲线是唯一不可替代的东西。但方向稿没写清楚**第一屏到底放什么**。\"品牌 + 一句价值主张 + 主按钮\"太笼统，那可以是任何产品的 hero。\n\n> **要求**：第一屏必须让访客在不滚动的情况下看到**今天的潮位读数**（哪怕是静态的）。海钓的人打开页面最想知道的就是这个，不是看一句 slogan。\n\n**3. 演示数据 — 有条件通过**\n\n理由：不接真实数据源是对的（第一版范围）。但**必须满足**：\n\n> **要求**：页面上任何出现\"预报\"字样的地方，旁边必须标注这是演示数据。不能让人误以为是真的潮汐预报——这是要下海的人，误信会有安全风险。这条不是法律免责，是诚实底线。\n\n**4. 动效意图 — 通过**\n\n理由：曲线 draw-on、拖动弹簧跟随、当前时刻脉冲，三条都合理。脉冲作为唯一循环动画也是克制的做法。\n\n> **补充要求**：曲线要能**键盘操作**。海钓的人戴手套，触屏不灵；键盘可操作也覆盖了无障碍。拖动轴必须是真正的 `input[type=range]` 或等价的可聚焦控件，不能是纯鼠标拖拽的 div。\n\n**5. 未决问题 — 裁决如下**\n\n- 中英双语还是中文为主 → **中文为主**。目标用户是国内海钓/赶海人群，双语会把第一版拖长。\n- 演示数据是否可接受 → 可以，见第 3 条的条件。\n\n### 门A 结论：**通过，附 4 项强制修正**\n\n修正项（实现阶段必须满足，验证阶段会逐条核对）：\n\n| # | 修正项 | 核对方式 |\n| --- | --- | --- |\n| A1 | 底色不暗于 `#0d2431` 级别；正文对比度 ≥ 7:1 | 计算对比度实测 |\n| A2 | 第一屏不滚动即可见今日潮位读数 | 首屏截图核对 |\n| A3 | 所有\"预报\"字样旁标注演示数据 | 文案逐条检查 |\n| A4 | 曲线轴可键盘操作（可聚焦控件 + 方向键） | 键盘走查 |\n\n### 下一步\n\n进入阶段 2（素材调研），子代理 A 产出候选清单后停在门B。\n"}],"nodeIds":["stage:brief","gate:A","rework:brief"]},{"id":"reference","name":"参考素材","gates":["B"],"summary":"选定可采用的参考、组件和素材，记录来源与使用边界。","output":"参考清单 / 来源记录","evidence":"research-notes.md + 选择记录","decisionPoint":true,"status":"passed","stageNote":"门B 通过；实地观察推翻了方向稿第三屏设定。","evidenceActual":"docs/RESEARCH-NOTES.md · docs/reference/OBSERVATION-tideguide.md","isCurrent":false,"gateNodes":[{"id":"B","title":"门B 素材选择","detail":"候选素材清单（来源 URL、拟采用部分、改编与授权边界）","status":"passed","lane":"user"}],"artifacts":[{"path":"docs/RESEARCH-NOTES.md","status":"ok","kind":"markdown","reason":null,"bytes":34108,"html":"<h1 class=\"md-h1\">潮汐 TIDE · 素材调研笔记（门B 候选清单）</h1>\n<blockquote class=\"md-quote\"><p class=\"md-p\">本文件是「素材调研」环节的产物，供用户在门B 勾选。 上游输入：<code class=\"md-code\">demo/tide-app/docs/DIRECTION.md</code>（门A 方向稿）与 <code class=\"md-code\">demo/tide-app/docs/GATE-A-DECISION.md</code>（门A 裁决，含 4 项强制修正 A1–A4）。 分类口径：<code class=\"md-code\">.agents/skills/ui-design-agent/references/material-scouting.md</code> 的 四类 <code class=\"md-code\">reference</code> / <code class=\"md-code\">component</code> / <code class=\"md-code\">asset</code> / <code class=\"md-code\">prompt</code>。 核实日期：2026-09-16（本地时区 PDT）。所有可达性均为当日实测结果，时间敏感。</p>\n<p class=\"md-p\"><strong>门B 状态说明</strong>：<code class=\"md-code\">demo/tide-app/docs/GATE-B-DECISION.md</code> 已对本清单作出裁决 （采纳 R1/R2/R3/A3/P1，排除 A1/A2/D1）。该裁决表<strong>未包含本清单的 R2b（warp）</strong>， 而其中「深色基线只保留 linear.app」一句与 R2b 的建议存在冲突。<strong>R2b 目前处于 未裁决状态</strong>，详见 R2b 条目末尾的说明。本文件如实保留该记录，不改写已通过的裁决。</p></blockquote>\n<hr class=\"md-hr\"/>\n<h2 class=\"md-h2\">〇、核心判断：这个项目几乎不需要外部生产素材</h2>\n<p class=\"md-p\"><strong>结论先给：潮汐曲线必须自绘 SVG，字体与图标走已有开源/系统方案，唯一值得外部引入的是「参考」而非「素材」。</strong></p>\n<p class=\"md-p\">理由分四条：</p>\n<ol class=\"md-list\"><li><strong>核心交互不可外包。</strong> 这条曲线的全部价值在于：半日潮双峰形态由数据驱动、</li></ol>\n<p class=\"md-p\">   可拖动时间轴、读数与游标弹簧联动、当前时刻脉冲。市面上的图表库或组件库    没有一个以「可拖动的潮汐形态 + 数据优先读数」为现成单元。强行装配一个通用    折线图组件，反而要拆掉它的坐标轴/图例/提示框体系，成本高于按    <code class=\"md-code\">motion-contract.md</code> 的弹簧预设自绘 <code class=\"md-code\">&lt;path&gt;</code>。这正符合 material-scouting    的「装配优先」例外条件之一：<strong>适配成本高于干净本地实现</strong>。</p>\n<ol class=\"md-list\"><li><strong>视觉方向已闭合。</strong> DIRECTION 已定死深海底蓝 + 潮线青，且明确禁止渐变球、</li></ol>\n<p class=\"md-p\">   玻璃拟态。具名基线 <code class=\"md-code\">linear.app</code> / <code class=\"md-code\">vercel</code> 属于<strong>分析文档</strong>（reference/prompt），    不是可下载的素材文件——它的作用是提供 token 关系对照，不是提供图片。</p>\n<ol class=\"md-list\"><li><strong>图标与字体有现成零成本路径。</strong> 仓库多个 demo（tempo-day / brick-workshop 等）</li></ol>\n<p class=\"md-p\">   已用 <code class=\"md-code\">lucide-react</code>（ISC，实测读 LICENSE 文件确认）；中文与数字可用系统字体栈    （macOS 的 PingFang SC + SF Mono），零外部素材。</p>\n<ol class=\"md-list\"><li><strong>演示数据不产生素材需求。</strong> 门A 已确认可用演示数据。演示数据是本地生成的</li></ol>\n<p class=\"md-p\">   数值，不是外部资产。</p>\n<p class=\"md-p\"><strong>因此，真正需要用户裁决的是以下四点</strong>（见第五节；其中前三项已由门B 裁决）： ① 字体策略（纯系统栈 vs. 引入一款 OFL 等宽字体）→ <strong>门B 已选系统栈</strong>； ② 是否要在契约阶段补一次 R3 的浏览器实地观察 → <strong>门B 已要求补</strong>； ③ 确认「曲线自绘 + 可聚焦 range 控件」这条自研路径 → <strong>门B 已批准</strong>； ④ <strong>深色基线是否纳入 <code class=\"md-code\">warp</code>（R2b）—— 门B 未裁决，仍待澄清</strong>（详见 R2b 与 Q4）。</p>\n<blockquote class=\"md-quote\"><p class=\"md-p\"><strong>顺带发现（供契约阶段注意）</strong>：DIRECTION 提议的底色 <code class=\"md-code\">#071a24</code> <strong>比门A 修正 A1 的下限 <code class=\"md-code\">#0d2431</code> 更暗</strong>（相对亮度 0.00911 vs 0.01569），按 A1 的裁决理由（户外 强光下过暗底色会反光成镜面）应当被替换。实测 <code class=\"md-code\">#0d2431</code> 配 <code class=\"md-code\">#e8f1f4</code> 正文对比度 13.94:1，远超 A1 要求的 7:1，有充足余量。本笔记只报告这一冲突，最终色值由契约 阶段定稿。</p></blockquote>\n<hr class=\"md-hr\"/>\n<h2 class=\"md-h2\">一、按四类分类的素材需求盘点</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>类别</th><th>本项目的需求</th><th>是否需要外部素材</th></tr></thead><tbody><tr><td><code class=\"md-code\">reference</code></td><td>深色高对比、数据优先的版式与强调色克制关系；真实潮汐 App 的曲线呈现惯例</td><td><strong>需要</strong>（这是唯一有实际价值的外部引入）</td></tr><tr><td><code class=\"md-code\">component</code></td><td>潮汐曲线、拖动时间轴、弹簧读数</td><td><strong>不需要</strong>：自绘 SVG + 仓库已装的 <code class=\"md-code\">motion</code>（MIT）</td></tr><tr><td><code class=\"md-code\">asset</code></td><td>数字等宽字体、中文字形、图标</td><td><strong>可选</strong>：系统栈 + <code class=\"md-code\">lucide-react</code> 已够；若要更强「仪器面板」质感才需引入字体文件</td></tr><tr><td><code class=\"md-code\">prompt</code></td><td>设计方向措辞与 token 结构对照</td><td><strong>需要</strong>（与 reference 同源，见 R1/R2/R2b）</td></tr></tbody></table></div>\n<blockquote class=\"md-quote\"><p class=\"md-p\">说明：<code class=\"md-code\">reference</code> 与 <code class=\"md-code\">prompt</code> 在本项目里指向同一份来源（awesome-design-md 的 品牌 DESIGN.md 分析），因为该文档既是视觉对照（reference）也是 token 措辞 来源（prompt）。按 material-scouting「不要让画廊截图悄悄变成 asset」的原则， 我把它明确标为 reference/prompt，<strong>不入生产、不下载任何品牌图片</strong>。</p></blockquote>\n<hr class=\"md-hr\"/>\n<h2 class=\"md-h2\">二、候选清单（供门B 勾选）</h2>\n<h3 class=\"md-h3\">2.1 主候选清单（6 项）</h3>\n<blockquote class=\"md-quote\"><p class=\"md-p\">任务书要求 3–6 个候选。我把真正需要用户裁决的收敛为下面 6 项； 2.2 节是「已核实但建议直接沿用/本版不用」的记录项。 「门B 裁决」列来自 <code class=\"md-code\">GATE-B-DECISION.md</code>（该表未包含 R2b）。</p></blockquote>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>#</th><th>候选</th><th>类别</th><th>授权状态</th><th>拟用在哪</th><th>我的建议</th><th>门B 裁决</th></tr></thead><tbody><tr><td>R1</td><td>awesome-design-md · <code class=\"md-code\">linear.app</code></td><td>reference/prompt</td><td>MIT（实测）</td><td>强调色克制关系、surface 阶梯思路</td><td>adopt（附 A1 色值冲突警告）</td><td>✅ 采纳（仅关系，不取色值）</td></tr><tr><td>R2</td><td>awesome-design-md · <code class=\"md-code\">vercel</code></td><td>reference/prompt</td><td>MIT（实测）</td><td>层次机制；<strong>但它是浅色系统，非深色基线</strong></td><td>adopt（降级为次要参考）</td><td>✅ 采纳（仅层次机制）</td></tr><tr><td>R2b</td><td>awesome-design-md · <code class=\"md-code\">warp</code></td><td>reference/prompt</td><td>MIT（实测）</td><td><strong>深色基线</strong>（深色优先，且通过 A1 亮度下限）</td><td>adopt（建议取代 R2 作深色基线）</td><td><strong>⚠️ 未裁决</strong>（见 Q4）</td></tr><tr><td>R3</td><td>Tide Guide（tideguide.com）</td><td>reference</td><td>商业产品，无开源许可</td><td>同类真实产品的曲线交互惯例</td><td>adopt（reference-only）</td><td>✅ 采纳（reference-only）</td></tr><tr><td>A1</td><td>JetBrains Mono</td><td>asset</td><td>OFL-1.1（实测）</td><td>潮位读数等宽数字</td><td>待裁决（见 Q1）</td><td>❌ 本轮不采用</td></tr><tr><td>A2</td><td>Noto Sans SC / Noto Sans Mono CJK</td><td>asset</td><td>OFL-1.1（读 LICENSE 实测）</td><td>中文跨平台字形一致</td><td>待裁决（见 Q1，倾向不引入）</td><td>❌ 本轮不采用</td></tr></tbody></table></div>\n<h3 class=\"md-h3\">2.2 记录项（已核实，建议直接沿用或本版不用，无需勾选）</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>#</th><th>候选</th><th>类别</th><th>授权状态</th><th>结论</th><th>门B 裁决</th></tr></thead><tbody><tr><td>A3</td><td>Lucide 图标</td><td>asset</td><td><strong>ISC</strong>（读 LICENSE 实测）</td><td>沿用仓库既有 <code class=\"md-code\">lucide-react</code> 依赖，零新增素材</td><td>✅ 采纳</td></tr><tr><td>D1</td><td>NOAA CO-OPS API</td><td>数据源（非视觉素材）</td><td><strong>未明文核实</strong></td><td>本版不用（门A 已裁定演示数据）；记录备查</td><td>❌ 本版不用</td></tr><tr><td>P1</td><td>material-scouting / motion-contract</td><td>prompt</td><td>本仓库自有 + Motion MIT</td><td>弹簧预设与降级规则的依据</td><td>✅ 采纳</td></tr></tbody></table></div>\n<hr class=\"md-hr\"/>\n<h3 class=\"md-h3\">R1 — awesome-design-md · <code class=\"md-code\">linear.app</code>（reference / prompt）</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>字段</th><th>内容</th></tr></thead><tbody><tr><td>URL</td><td>https://github.com/VoltAgent/awesome-design-md（文件路径 <code class=\"md-code\">design-md/linear.app/DESIGN.md</code>）</td></tr><tr><td>类别</td><td>reference + prompt</td></tr><tr><td>提供什么</td><td>对 Linear 公开网站 CSS 的结构化转写：语义 token（canvas <code class=\"md-code\">#010102</code>、surface 阶梯、单一强调色 <code class=\"md-code\">#5e6ad2</code>）、字阶与负字距、组件状态、Do/Don&#39;t。实测拉取 24,354 字节，含 frontmatter 与完整 colors/typography 段</td></tr><tr><td>拟用在哪</td><td>契约阶段的 token 关系对照：<strong>强调色只出现在品牌标记/焦点环/少数 CTA，绝不用于装饰</strong>——这正是潮线青「只用在数据和当前时间上」的直接依据；surface 阶梯映射深海底蓝的层次</td></tr><tr><td>授权状态</td><td><strong>MIT</strong>（GitHub API 实测 <code class=\"md-code\">license.spdx_id = MIT</code>，仓库 116,100★）。已锁定 revision <code class=\"md-code\">8147538b4226ae41e2487a9179e3bcc1f68e8554</code>（见 <code class=\"md-code\">tooling/sources.lock.json</code> 的 <code class=\"md-code\">designContracts</code>）</td></tr><tr><td>可达性</td><td>可达。用 <code class=\"md-code\">node tooling/design-md.mjs pull linear.app</code> 实际拉取成功，输出 24,354 字节</td></tr><tr><td><strong>⚠️ 与门A 修正 A1 的冲突</strong></td><td>Linear 的 canvas 实测为 <strong><code class=\"md-code\">#010102</code></strong>，远暗于门A 要求的「不暗于 <code class=\"md-code\">#0d2431</code> 级别」——门A 的理由是户外强光下过暗底色会反光成镜面，这与对比度无关，是绝对亮度问题。另外实测其 <code class=\"md-code\">ink-subtle #8a8f98</code> 在 <code class=\"md-code\">#010102</code> 上对比度为 <strong>6.42:1，未达门A 要求的 7:1</strong>。<strong>因此 R1 只能取其「关系」（单一强调色、surface 阶梯思路、hairline 边框、负字距），绝不能照搬其色值。</strong> 底色必须按 A1 独立计算（实测 <code class=\"md-code\">#0d2431</code> 配 <code class=\"md-code\">#e8f1f4</code> 正文可达 13.94:1，有充足余量）</td></tr><tr><td>改编边界</td><td>第三方分析文档，非 Linear 官方规范、不拥有品牌视觉身份。<strong>只改写 token 关系与规则，不照搬全文、不复制其 preview.html、不声称与 Linear 关联</strong>；文件按需拉取到临时目录，不提交入库。<strong>色值一律不采用，只采用结构关系</strong></td></tr><tr><td>建议</td><td>adopt（作为 reference/prompt，<strong>且附 A1 冲突警告</strong>）</td></tr></tbody></table></div>\n<h3 class=\"md-h3\">R2 — awesome-design-md · <code class=\"md-code\">vercel</code>（reference / prompt）</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>字段</th><th>内容</th></tr></thead><tbody><tr><td>URL</td><td>https://github.com/VoltAgent/awesome-design-md（文件路径 <code class=\"md-code\">design-md/vercel/DESIGN.md</code>）</td></tr><tr><td>类别</td><td>reference + prompt</td></tr><tr><td>提供什么</td><td>Vercel 公开网站的 token 与规则转写（实测 41,405 字节）</td></tr><tr><td>授权状态</td><td><strong>MIT</strong>（同仓库，同一锁定 revision <code class=\"md-code\">8147538b4226ae41e2487a9179e3bcc1f68e8554</code>）</td></tr><tr><td>可达性</td><td>可达。<code class=\"md-code\">node tooling/design-md.mjs pull vercel</code> 实际拉取成功，41,405 字节</td></tr><tr><td><strong>⚠️ 与 DIRECTION 描述的偏差（重要）</strong></td><td>DIRECTION 把 vercel 列为「深色高对比」基线，但<strong>实际拉取的文档显示它是以浅色为主的系统</strong>：<code class=\"md-code\">canvas: #ffffff</code>、<code class=\"md-code\">canvas-soft: #fafafa</code>，深色只是「极性反转的分区带」（<code class=\"md-code\">showcase-band-dark</code>，用 <code class=\"md-code\">primary #171717</code> 作为深色带的背景）。<strong>它并非深色主题范例。</strong> 可借鉴的是它的<strong>层次机制</strong>：四级 surface 阶梯 + hairline + 极轻阴影，以及「用极性反转分区带来制造段落深度」这一手法——后者对本项目有用（深底页面上用略亮的带区分段落）。<strong>不可借鉴的是它的明暗基调本身。</strong></td></tr><tr><td>另一处可用证据</td><td>实测其 <code class=\"md-code\">mute #888888</code> 在 <code class=\"md-code\">#ffffff</code> 上仅 <strong>3.54:1</strong>，未达 WCAG AA 正文标准（<code class=\"md-code\">body #4d4d4d</code> 为 8.45:1）。这提醒：<strong>弱化文字色不能凭观感取，必须算对比度</strong>——门A A1 要求 7:1，这条证据支持把「次要文字」也纳入计算</td></tr><tr><td>改编边界</td><td>同 R1：改编关系，不照搬，不声称品牌关联，不入库；<strong>且不得沿用其浅色基调</strong></td></tr><tr><td>建议</td><td>adopt（作为 reference/prompt，<strong>限定为「层次机制」参考，不作为深色基线</strong>）</td></tr></tbody></table></div>\n<h3 class=\"md-h3\">R2b — awesome-design-md · <code class=\"md-code\">warp</code>（reference / prompt）— <strong>建议取代 R2 作为深色基线</strong></h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>字段</th><th>内容</th></tr></thead><tbody><tr><td>URL</td><td>https://github.com/VoltAgent/awesome-design-md（文件路径 <code class=\"md-code\">design-md/warp/DESIGN.md</code>）</td></tr><tr><td>类别</td><td>reference + prompt</td></tr><tr><td>提供什么</td><td>Warp（终端类开发工具品牌）的设计分析。<strong>实测为深色优先系统</strong>：<code class=\"md-code\">canvas: #2b2622</code>（暖调近炭黑）、<code class=\"md-code\">canvas-soft: #383330</code>、<code class=\"md-code\">ink: #f7f5f0</code>、<code class=\"md-code\">hairline: #3f3a36</code>；上游描述其为「暖色近炭黑画布，仅由干净的 Inter 排版、偶发的衬线斜体时刻和密集的终端 mockup 图像打破；CTA 异常克制」。<strong>「深色画布 + 密集数据 mockup + 克制 CTA」与潮汐仪器面板的定位高度吻合</strong></td></tr><tr><td>拟用在哪</td><td>取代 R2 成为深色基调的<strong>结构</strong>参照：surface 阶梯如何在小色差内制造层次、数据密集区域如何用 hairline 而非阴影分隔、CTA 如何保持克制</td></tr><tr><td>授权状态</td><td><strong>MIT</strong>（同仓库，同一锁定 revision <code class=\"md-code\">8147538b4226ae41e2487a9179e3bcc1f68e8554</code>）</td></tr><tr><td>可达性</td><td>可达。<code class=\"md-code\">node tooling/design-md.mjs pull warp</code> 实际拉取成功</td></tr><tr><td><strong>与门A A1 的相容性（实测）</strong></td><td><code class=\"md-code\">#2b2622</code> 相对亮度 <strong>0.02015</strong>，<strong>高于</strong>门A 下限 <code class=\"md-code\">#0d2431</code>（0.01569），故其绝对亮度符合 A1 的「不能过暗」要求。对比度实测：<code class=\"md-code\">ink #f7f5f0</code> = 13.74:1、<code class=\"md-code\">body #c9c0ad</code> = 8.29:1，均远超 A1 的 7:1；但其 <code class=\"md-code\">mute #aea69c</code> 仅 <strong>6.23:1，未达 7:1</strong>——所以次要文字色仍须独立重算</td></tr><tr><td>改编边界</td><td>同 R1：改编 token 关系，不照搬全文与色值，不声称品牌关联，不入库。<strong>注意其暖调（棕橙倾向）与潮汐的冷调海底蓝相反，只借「深色 + 层次机制」，不借色相</strong></td></tr><tr><td>建议</td><td>adopt（作为 reference/prompt）；<strong>与 R2 二选一或并用，但深色基线应以本项为准</strong></td></tr><tr><td><strong>门B 裁决状态（后补记录）</strong></td><td><code class=\"md-code\">GATE-B-DECISION.md</code> 的候选表<strong>未列出 R2b</strong>；其第二节裁决为「深色基线只保留 linear.app，且只取其关系不取色值」。由于门B 已明确<strong>基线只提供关系、不提供色值</strong>，所以这不构成硬冲突——底色由 A1 定为 <code class=\"md-code\">#0d2431</code>。但有一个实质问题值得澄清：<strong>R1（linear.app）的 canvas <code class=\"md-code\">#010102</code> 相对亮度仅 0.00304，是所有抽查品牌里最暗的之一</strong>（门A A1 下限 <code class=\"md-code\">#0d2431</code> 为 0.01569），而 <strong>R2b（warp <code class=\"md-code\">#2b2622</code>，0.02015）是实测通过 A1 下限的深色优先系统</strong>。若契约阶段需要「深色页面如何用 surface 阶梯 + hairline 制造层次」的具体参照，warp 比 linear 更贴近我们被 A1 约束后的实际明度区间。<strong>本条保持未裁决，作为可选补充请用户确认。</strong></td></tr></tbody></table></div>\n<h3 class=\"md-h3\">R3 — Tide Guide（tideguide.com）（reference）</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>字段</th><th>内容</th></tr></thead><tbody><tr><td>URL</td><td>https://tideguide.com/ ；另见 ScreensDesign 拆解页 https://screensdesign.com/showcase/tide-guide-charts-tables</td></tr><tr><td>类别</td><td>reference</td></tr><tr><td>提供什么</td><td><strong>同类真实产品的参考</strong>：官方描述为 &quot;Simple, beautiful tide charts. See the tide at a glance, then scrub through the curve to understand exactly how the water changes throughout the day.&quot; 与 DIRECTION 的核心交互（可拖动潮汐曲线 + 读数）高度同构。用于观察真实潮汐产品如何组织曲线、高低潮标注与时间轴，验证「曲线即 hero」的做法在真实产品中成立</td></tr><tr><td>拟用在哪</td><td>第三屏「一日两次涨落的说明」与核心曲线屏的信息层级对照；确认高低潮时刻标注、当前时刻标记的行业惯例</td></tr><tr><td>授权状态</td><td><strong>无公开开源许可</strong>。这是商业产品/应用，页面未提供可复用的素材授权。<strong>仅作 reference 研究</strong></td></tr><tr><td>可达性</td><td>可达。curl 实测 <code class=\"md-code\">https://tideguide.com/</code> → HTTP 200，标题 <code class=\"md-code\">Tide Guide: Tides, Marine Weather, Charts &amp; Tables</code>；拆解页 <code class=\"md-code\">screensdesign.com/showcase/tide-guide-charts-tables</code> → 200</td></tr><tr><td><strong>观察状态更新（本笔记写成后）</strong></td><td>我在本笔记中标注「未亲眼看到曲线 UI」的这一缺口，已由后续环节按门B 要求 B2 补齐：真实浏览器（Playwright，1440×1000）实测观察记录见 <code class=\"md-code\">docs/reference/OBSERVATION-tideguide.md</code> 与截图 <code class=\"md-code\">docs/reference/tideguide-hero-2026-09-16.png</code>。<strong>该观察证实</strong>：曲线占据主视区、曲线下有渐变填充、曲线上直接标注高低潮时刻与潮位值、有圆形游标点随读数。同时它<strong>推翻</strong>了方向稿第三屏「用文字解释一日两次涨落」的做法（该产品完全不解释潮汐原理，默认目标用户已知）</td></tr><tr><td>改编边界</td><td><strong>reference-only</strong>：只提炼可观察的布局与交互关系（曲线如何占据主位、读数如何贴曲线、拖动如何响应），<strong>不复制其截图、图标、文案、配色或代码</strong>，页面上不得出现其素材。观察截图仅作研究留痕，不进入产品</td></tr><tr><td>建议</td><td>adopt（reference-only）</td></tr></tbody></table></div>\n<h3 class=\"md-h3\">A1 — JetBrains Mono（asset，字体）</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>字段</th><th>内容</th></tr></thead><tbody><tr><td>URL</td><td>https://github.com/JetBrains/JetBrainsMono ；Google Fonts 镜像 https://fonts.google.com/specimen/JetBrains+Mono</td></tr><tr><td>类别</td><td>asset</td></tr><tr><td>提供什么</td><td>开源等宽字体，含 tabular 数字，适合潮位读数。DIRECTION 要求「数字用等宽字体，因为潮位是读数」</td></tr><tr><td>拟用在哪</td><td>潮位读数、时间刻度、涨落时刻等所有数字</td></tr><tr><td>授权状态</td><td><strong>OFL-1.1</strong>（GitHub API 实测 <code class=\"md-code\">license.spdx_id = OFL-1.1</code>，13,033★；本地字体库 <code class=\"md-code\">ui-ux-pro-max/data/google-font-licenses.json</code> 亦记录为 OFL，verifiedAt 2026-08-13）</td></tr><tr><td>可达性</td><td>可达。GitHub API 200；Google Fonts 规格页 200；JetBrains 官方字体页 https://www.jetbrains.com/lp/mono/ → 200</td></tr><tr><td>改编边界</td><td>OFL-1.1 允许商用、修改、嵌入与再分发，<strong>保留版权声明与 OFL 许可文本</strong>；不得单独售卖字体本身，不得使用 Reserved Font Name（若修改字形须改名）。落地方式建议自托管或 Google Fonts CDN</td></tr><tr><td>建议</td><td><strong>待用户裁决</strong>（见第五节 Q1）</td></tr></tbody></table></div>\n<h3 class=\"md-h3\">A2 — Noto Sans SC / Noto Sans Mono CJK（asset，中文字形）</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>字段</th><th>内容</th></tr></thead><tbody><tr><td>URL</td><td>https://github.com/notofonts/noto-cjk ；Google Fonts 规格页 https://fonts.google.com/noto/specimen/Noto+Sans+SC</td></tr><tr><td>类别</td><td>asset</td></tr><tr><td>提供什么</td><td>中文简体字形覆盖。门A 遗留问题「受众是中文为主还是中英双语」未定；若需保证非 macOS/非 Windows 环境的中文字形一致，需要一个明确的中文 Web 字体</td></tr><tr><td>拟用在哪</td><td>中文正文与标签；<code class=\"md-code\">Noto Sans Mono CJK SC</code> 可让中文与等宽数字在同一读数行内对齐</td></tr><tr><td>授权状态</td><td><strong>SIL OFL 1.1</strong>（实际读取仓库内 <code class=\"md-code\">Sans/LICENSE</code> 文件，开头即 &quot;This Font Software is licensed under the SIL Open Font License, Version 1.1&quot;；本地字体库同样记录 Noto Sans SC / Noto Sans Mono 为 OFL）</td></tr><tr><td>可达性</td><td>可达。GitHub API 列出 <code class=\"md-code\">Sans/Mono/NotoSansMonoCJKsc-Regular.otf</code> 等文件成功；Google Fonts 规格页 200</td></tr><tr><td>改编边界</td><td>同 OFL-1.1：可商用、可嵌入、可再分发，保留许可与版权声明，不改名售卖</td></tr><tr><td>备注</td><td><strong>中文可用系统字体栈替代</strong>（macOS <code class=\"md-code\">PingFang SC</code>、Windows <code class=\"md-code\">Microsoft YaHei</code>）——仓库现有 demo 全部走系统栈，零外部素材。仅当用户要求跨平台字形一致时才需要引入本项</td></tr><tr><td>建议</td><td><strong>待用户裁决</strong>（见第五节 Q1）；默认倾向「系统栈，不引入」</td></tr></tbody></table></div>\n<h3 class=\"md-h3\">A3 — Lucide 图标（asset，图标）</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>字段</th><th>内容</th></tr></thead><tbody><tr><td>URL</td><td>https://github.com/lucide-icons/lucide ；https://lucide.dev</td></tr><tr><td>类别</td><td>asset（图标组件）</td></tr><tr><td>提供什么</td><td>开源图标集，含潮汐/场景所需的基础图标（sun、moon、waves、map-pin、clock 等）。仓库已有多个 demo 使用 <code class=\"md-code\">lucide-react</code>（tempo-day、brick-workshop 等）</td></tr><tr><td>拟用在哪</td><td>第四屏三个场景（海钓/赶海/摄影）的克制图标；可能的时间/地点标注</td></tr><tr><td>授权状态</td><td><strong>ISC</strong>（GitHub API 报 <code class=\"md-code\">NOASSERTION</code>，因此<strong>实际读取了仓库 LICENSE 文件</strong>：正文为 &quot;ISC License, Copyright (c) 2026 Lucide Icons&quot;；<code class=\"md-code\">packages/lucide-react/package.json</code> 的 <code class=\"md-code\">license</code> 字段为 <code class=\"md-code\">&quot;ISC&quot;</code>）。属宽松许可，等同 MIT 的宽松度</td></tr><tr><td>可达性</td><td>可达。GitHub API 200，LICENSE 与 package.json 均成功读取</td></tr><tr><td>改编边界</td><td>ISC 允许商用与修改，保留版权与许可声明即可。<strong>沿用仓库既有依赖模式，不新增第二套图标库</strong>；DIRECTION 明确「不用图标堆」，所以用量应极少</td></tr><tr><td>建议</td><td>adopt（沿用既有依赖，零新增素材）</td></tr></tbody></table></div>\n<h3 class=\"md-h3\">D1 — NOAA CO-OPS Data Retrieval API（可选：数据源，非视觉素材）</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>字段</th><th>内容</th></tr></thead><tbody><tr><td>URL</td><td>https://api.tidesandcurrents.noaa.gov/api/prod/</td></tr><tr><td>类别</td><td>数据源（不是 material-scouting 四类中的视觉素材；列在此处是因为它对应门A 的待确认问题）</td></tr><tr><td>提供什么</td><td>美国官方潮位观测与<strong>预报（predictions）</strong>数据。实测调用成功，返回逐小时潮位 JSON，例如站点 9414290（旧金山）2026-09-15 的 <code class=\"md-code\">{&quot;t&quot;:&quot;2026-09-15 00:00&quot;,&quot;v&quot;:&quot;2.705&quot;} …</code>。含 datum / units / time_zone / interval 等参数</td></tr><tr><td>拟用在哪</td><td>若用户希望页面用<strong>真实潮汐形态</strong>而非正弦模拟：可直接取某站某日的 predictions 曲线，让「半日潮双峰」是真实数据而非近似</td></tr><tr><td>授权状态</td><td><strong>未完全核实（诚实标注）</strong>：NOAA 作为美国联邦机构，其数据通常属公共领域，但我<strong>未能找到 API 页面上明文的授权/使用条款声明</strong>——<code class=\"md-code\">/api/prod/</code> 只写了 throttling 与报错说明；<code class=\"md-code\">disclaimers.html</code>、<code class=\"md-code\">about_us.html</code>、<code class=\"md-code\">web_services_info.html</code> 均未抓到 &quot;public domain / copyright / terms of use&quot; 的明文。<strong>因此本项授权状态记为待核实，不能当作已获授权使用</strong></td></tr><tr><td>可达性</td><td>可达。curl 实测 API 返回 HTTP 200 与真实数据（见上）；文档页 <code class=\"md-code\">/api/prod/</code> → 200</td></tr><tr><td>改编边界</td><td>若采纳：需在页面标注数据来源与「预报非实测」；遵守其 throttling 建议（调用间加 sleep、只取所需数据）</td></tr><tr><td><strong>门A 裁决影响</strong></td><td>门A 已裁定「演示数据可接受」，因此<strong>本版不采用 D1</strong>。保留此条仅为记录已核实的数据源与「授权状态未明文核实」这一事实，供后续版本需要真实数据时参考</td></tr><tr><td>建议</td><td><strong>reject（本版不用）</strong>；记录为后续版本的备选，且届时须先澄清授权</td></tr></tbody></table></div>\n<h3 class=\"md-h3\">P1 — material-scouting 的装配优先基线（prompt / 流程，非可下载素材）</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>字段</th><th>内容</th></tr></thead><tbody><tr><td>URL</td><td><code class=\"md-code\">.agents/skills/ui-design-agent/references/material-scouting.md</code>、<code class=\"md-code\">motion-contract.md</code></td></tr><tr><td>类别</td><td>prompt</td></tr><tr><td>提供什么</td><td>弹簧预设（<code class=\"md-code\">snappy: stiffness 400 / damping 30</code>、<code class=\"md-code\">elegant: 100/20</code> 等）、<code class=\"md-code\">prefers-reduced-motion</code> 降级规则、装配优先规则</td></tr><tr><td>拟用在哪</td><td>拖动游标的弹簧跟随用 <code class=\"md-code\">snappy</code>；曲线入场描线用 <code class=\"md-code\">elegant</code>；脉冲动画的 reduced-motion 降级</td></tr><tr><td>授权状态</td><td>本仓库自有文档，无外部授权问题；其引用的 <code class=\"md-code\">motion</code> 包为 <strong>MIT</strong>（GitHub API 实测 <code class=\"md-code\">motiondivision/motion</code> → MIT）</td></tr><tr><td>可达性</td><td>本地文件，已读取</td></tr><tr><td>改编边界</td><td>按 motion-contract 规定的预设使用，不自定义弹簧参数</td></tr></tbody></table></div>\n<hr class=\"md-hr\"/>\n<h2 class=\"md-h2\">三、明确不采用的（考虑过但排除）</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>候选</th><th>类别</th><th>排除原因</th></tr></thead><tbody><tr><td><strong>React Bits</strong>（https://reactbits.dev）</td><td>component</td><td>① 许可证<strong>不是纯 MIT</strong>：实际读取 <code class=\"md-code\">LICENSE.md</code>，正文为 &quot;MIT + Commons Clause License Condition v1.0&quot;，Commons Clause 会限制「出售该软件本身」；② 其组件以炫技型文字/背景特效为主，与 DIRECTION 明确禁止的「AI 味」高度重叠；③ 核心曲线不能由它提供。可达（200），但排除</td></tr><tr><td><strong>Magic UI</strong>（https://magicui.design）</td><td>component</td><td>许可为 <strong>MIT</strong>（实测，22,303★）、可达（200），技术上可用；但本页没有「环境光/背景特效」需求（DIRECTION 禁渐变球与玻璃拟态），曲线又是自绘，故<strong>无落点</strong>。保留为将来需要入场特效时的备选，本轮不采用</td></tr><tr><td><strong>21st.dev</strong></td><td>component</td><td>可达（200），但库内记录明确「许可逐组件检查，不入预清层」。本轮无组件需求，不值得为 0 个落点逐个核许可</td></tr><tr><td><strong>d3-shape</strong></td><td>component</td><td>可达、<strong>ISC</strong> 许可（实测 2,528★）。但对「正弦叠加半日潮」这种形态，手写 SVG path 的代码量小于引入并配置 d3-shape 生成器；按装配优先的例外条款（适配成本 &gt; 本地实现）排除</td></tr><tr><td><strong>unDraw 插画</strong>（https://undraw.co）</td><td>asset</td><td>可达、开源许可可商用，但 DIRECTION 的基调是「像一块被水浸过的仪器面板」，扁平人物插画与数据优先的调性冲突；三个场景用文字与克制图标表达即可</td></tr><tr><td><strong>Unsplash / Pexels 海景照片</strong></td><td>asset</td><td>库内记录二者在隔离浏览器中 403，且本项目<strong>不需要摄影素材</strong>——曲线本身就是 hero，加海景照片会稀释数据优先的定位。直接排除，不做重试</td></tr><tr><td><strong>Godly / Awwwards / Dark Design / Land Book</strong></td><td>reference</td><td>均为研究型画廊（部分被反爬：Land Book curl 403）。本项目的方向基线已由 R1/R2/R2b 具名锁定，再用泛画廊采样会引入与 DIRECTION 不一致的风格噪音。<strong>dark.design 实测可达（200）</strong>，若用户想扩宽深色方向参考可再启用，本轮不采用</td></tr><tr><td><strong>Poly Haven / Kenney / Tripo 3D 素材</strong></td><td>asset</td><td>可达且多为 CC0，但本项目是 2D 数据页，无 3D 需求。排除</td></tr><tr><td><strong>Wikimedia Commons 潮汐图表</strong></td><td>asset</td><td>可达（200），实测某 19 世纪潮汐图文件为 <strong>Public domain</strong>（BnF 藏，API 核实 LicenseShortName=Public domain）。但那是历史版画图表，作为生产图片会破坏现代仪器面板的调性。<strong>若需要「潮汐图的历史注解」可作参考</strong>，本轮排除</td></tr><tr><td><strong>Typewolf / Fonts In Use</strong></td><td>reference</td><td>可达，用于字体选型发散。但字体决策（Q1）只需在「系统栈」与「一款 OFL 等宽」之间二选一，无需引入额外检索站</td></tr><tr><td><strong><code class=\"md-code\">motionlab.dev</code></strong></td><td>—</td><td>库内明确记录为占位页，禁止引用</td></tr><tr><td><strong>Linear / Vercel / Warp 官网直接取图</strong></td><td>asset</td><td>品牌官网的截图与图片<strong>不可复用</strong>；R1/R2/R2b 用的是 MIT 许可的<strong>第三方分析文档</strong>，不是品牌资产。此边界必须写进契约</td></tr></tbody></table></div>\n<hr class=\"md-hr\"/>\n<h2 class=\"md-h2\">四、诚实边界与未核实项</h2>\n<p class=\"md-p\">以下是我<strong>没有</strong>核实或<strong>无法</strong>核实的内容，明确列出，不作任何推断性断言：</p>\n<ol class=\"md-list\"><li><strong>NOAA 数据授权状态未明文核实。</strong> 我实际调用了 CO-OPS API 并成功取回真实数据，但<strong>没有在 NOAA 页面上找到明文的公共领域/使用条款声明</strong>。<code class=\"md-code\">tidesandcurrents.noaa.gov/disclaimers.html</code>、<code class=\"md-code\">about_us.html</code>、<code class=\"md-code\">web_services_info.html</code>、<code class=\"md-code\">/api/prod/</code> 均未抓到 &quot;public domain&quot; 或等效措辞。按 material-scouting「未知权利保持 pending，不当作许可」的原则，D1 的授权状态记为<strong>待核实</strong>（本版因门A 已裁定用演示数据而不采用）。若将来要接真实数据，建议向 <code class=\"md-code\">co-ops.userservices@noaa.gov</code> 确认，或改用有明确许可的替代源。</li><li><strong>Tide Guide 页面正文未能抓取（本笔记当时的限制；后续已补齐）。</strong> 我做调研时，站点为客户端渲染（返回内容以 Mixpanel 脚本为主），我只确认了 <strong>HTTP 200 与页面标题</strong>，<strong>没有实际看到其曲线 UI 的渲染结果</strong>。R3 的「交互同构」判断来自其官方描述文本（&quot;scrub through the curve&quot;）与 ScreensDesign 的拆解条目，属<strong>描述级证据，非亲眼观察</strong>。<strong>此缺口已由后续环节按门B 要求 B2 用真实浏览器补齐</strong>（见 <code class=\"md-code\">docs/reference/OBSERVATION-tideguide.md</code>）；该观察证实了曲线布局的多数判断，但也推翻了方向稿第三屏的解释性做法。</li><li><strong>字体文件的真实下载未执行。</strong> 我核实的是一致性许可（OFL-1.1 / ISC）与仓库元数据，<strong>没有下载任何字体或图标文件</strong>，也没有自托管验证。落地方式（自托管 vs. Google Fonts CDN）与子集化策略留待契约/实现阶段。</li><li><strong>未做浏览器渲染验证。</strong> 本笔记中所有可达性均为 HTTP 状态码与 API 返回，<strong>不是浏览器中的视觉确认</strong>。「可达」不等于「集成可用」。（例外说明：R3 的浏览器观察是<strong>本笔记写成之后</strong>由后续环节完成的，不属于我本轮的核实证据；见第 2 条。）</li><li><strong>未打开任何真实浏览器、未登录任何站点、未绕过任何反爬。</strong> 所有访问均为公开页面的直接 HTTP 请求、GitHub API 调用，以及一次公开 Web 检索（用于发现同类真实产品，经 <code class=\"md-code\">search_proxy_serper_search</code> 调用）。我<strong>没有</strong>使用浏览器自动化工具。</li><li><strong><code class=\"md-code\">awesome-design-md</code> 是第三方分析，不是官方规范。</strong> R1/R2/R2b 的 token 值是「该品牌网站实际长什么样」的转写，不能当作品牌授权或官方设计系统。</li><li><strong>本地字体库数据的时效。</strong> <code class=\"md-code\">google-font-licenses.json</code> 记录 <code class=\"md-code\">verifiedAt: 2026-08-13</code>，距核实日约一个月，在 material-scouting 建议的「一季内复验」窗口内。</li></ol>\n<hr class=\"md-hr\"/>\n<h2 class=\"md-h2\">五、需要用户裁决的问题（门B）</h2>\n<blockquote class=\"md-quote\"><p class=\"md-p\"><strong>门A 已裁决、不再询问的事项</strong>：语言 = <strong>中文为主</strong>（不做双语）；数据 = 演示数据可接受（须满足 A3 标注要求）。</p>\n<p class=\"md-p\"><strong>门B 已对本节作出裁决</strong>（见 <code class=\"md-code\">GATE-B-DECISION.md</code> 第四节），结论记录如下： Q1 → <strong>选 A，纯系统字体栈</strong>（另加要求 B1：数字必须用 <code class=\"md-code\">tabular-nums</code>）； Q2 → <strong>要补</strong> R3 的浏览器实地观察（要求 B2）； Q3 → <strong>批准</strong>「自绘 SVG + 原生 <code class=\"md-code\">input[type=range]</code>」路径（要求 B3：隐藏视觉样式不得用 <code class=\"md-code\">display:none</code>/<code class=\"md-code\">visibility:hidden</code>，须保留可聚焦性）。 下文保留原始提问以供追溯；<strong>唯一仍待澄清的是 R2b（warp）的深色基线问题</strong>，见 Q4。</p></blockquote>\n<h3 class=\"md-h3\">Q1 — 字体策略：系统栈，还是引入 OFL 等宽字体？（门B 已裁决：选 A）</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>选项</th><th>内容</th><th>代价</th></tr></thead><tbody><tr><td><strong>A. 纯系统字体栈</strong>（门B 采纳）</td><td>数字用 <code class=\"md-code\">ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace</code>；中文用 <code class=\"md-code\">-apple-system, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;</code>。与仓库现有 demo 一致</td><td>零外部素材、零许可负担、零加载开销；代价是不同平台数字字形略有差异</td></tr><tr><td><strong>B. 引入 JetBrains Mono（+ 可选 Noto Sans SC）</strong>（门B 排除）</td><td>自托管或 CDN 引入 A1/A2</td><td>更强的「仪器面板」质感与跨平台一致；代价是增加字体文件与 OFL 许可声明义务</td></tr></tbody></table></div>\n<blockquote class=\"md-quote\"><p class=\"md-p\">门B 补充要求 <strong>B1</strong>：数字必须用 <code class=\"md-code\">tabular-nums</code>，否则读数跳动时宽度会变。</p></blockquote>\n<h3 class=\"md-h3\">Q2 — 是否需要在契约/实现阶段补充 R3 的浏览器实地观察？（门B 已裁决：要补；<strong>已补完</strong>）</h3>\n<p class=\"md-p\">R3（Tide Guide）是目前唯一「同类真实产品 + 可拖动潮汐曲线」的参考，我在本笔记中只确认了它可达（HTTP 200 + 标题），<strong>没有亲眼看到其曲线 UI</strong>（站点为客户端渲染）。门B 采纳本条，要求契约阶段用真实浏览器实际观察并留痕（要求 <strong>B2</strong>）。<strong>该要求已由后续环节完成</strong>：观察记录见 <code class=\"md-code\">docs/reference/OBSERVATION-tideguide.md</code>，截图见 <code class=\"md-code\">docs/reference/tideguide-hero-2026-09-16.png</code>。关键发现已回填至上方 R3 条目——其中包括一条对方向稿的推翻（第三屏「解释潮汐原理」应改为「展示曲线用法」）。</p>\n<h3 class=\"md-h3\">Q3 — 曲线自绘的边界确认（回应门A 修正 A4）（门B 已裁决：批准）</h3>\n<p class=\"md-p\">门A 要求曲线轴<strong>可键盘操作</strong>，必须是可聚焦控件而非纯鼠标拖拽 div。方案：自绘 SVG 曲线 + 一个真正可聚焦的 <code class=\"md-code\">input[type=range]</code> 作为时间轴控件（方向键可调），视觉上把 range 隐藏、由 SVG 游标与读数跟随其值。门B 批准此路径，并加要求 <strong>B3</strong>：隐藏视觉样式<strong>不得使用 <code class=\"md-code\">display:none</code> 或 <code class=\"md-code\">visibility:hidden</code></strong>（会失去可聚焦性），须用 <code class=\"md-code\">opacity:0</code> + 定位覆盖或 <code class=\"md-code\">appearance:none</code> 保留在布局中。</p>\n<h3 class=\"md-h3\">Q4 —【门B 未裁决】深色层次结构是否补充参考 <code class=\"md-code\">warp</code>（R2b）？</h3>\n<p class=\"md-p\">门B 的候选裁决表未列 R2b，其第二节写明「深色基线只保留 linear.app」。由于门B 同时明确基线<strong>只取关系不取色值</strong>，底色已由 A1 定为 <code class=\"md-code\">#0d2431</code>，所以这不是硬冲突，而是一个<strong>可选的补充问题</strong>：</p>\n<p class=\"md-p\">实测事实是——<code class=\"md-code\">linear.app</code> 的 canvas 为 <strong><code class=\"md-code\">#010102</code></strong>（相对亮度 0.00304），是被 A1 否掉的那种极暗底；而 <code class=\"md-code\">warp</code> 的 canvas 为 <strong><code class=\"md-code\">#2b2622</code></strong>（相对亮度 0.02015），<strong>实测通过 A1 亮度下限</strong>，且它是深色优先系统、有完整的 surface 阶梯与 hairline 体系。</p>\n<p class=\"md-p\"><strong>请确认</strong>：契约阶段做「深色页面层次」时，是否补充参考 warp 的 surface 阶梯做法（不取色相、不取色值，只取层次机制）？</p>\n<ul class=\"md-list\"><li><strong>选项 A（我的建议）</strong>：补充 warp 作为深色层次的参照，linear 保留为「强调色克制」的参照。</li><li><strong>选项 B</strong>：维持门B 原裁决，只用 linear 的关系。</li></ul>\n<hr class=\"md-hr\"/>\n<h2 class=\"md-h2\">六、本轮检索留痕</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>手段</th><th>用途</th><th>结果</th></tr></thead><tbody><tr><td><code class=\"md-code\">gh api repos/&lt;owner&gt;/&lt;repo&gt;</code></td><td>核实仓库许可与 star</td><td>awesome-design-md=MIT、motion=MIT、JetBrainsMono=OFL-1.1、IBM/plex=OFL-1.1、geist-font=OFL-1.1、noto-cjk=null（需读文件）、lucide=NOASSERTION（需读文件）、React Bits=NOASSERTION（需读文件）、Magic UI=MIT、d3-shape=ISC</td></tr><tr><td><code class=\"md-code\">gh api .../contents/LICENSE</code></td><td>读取实际许可正文</td><td>Lucide=<strong>ISC</strong>；noto-cjk <code class=\"md-code\">Sans/LICENSE</code>=<strong>SIL OFL 1.1</strong>；React Bits <code class=\"md-code\">LICENSE.md</code>=<strong>MIT + Commons Clause</strong></td></tr><tr><td><code class=\"md-code\">node tooling/design-md.mjs pull linear.app / vercel / warp</code></td><td>拉取具名基线</td><td>成功：24,354 / 41,405 / warp（revision <code class=\"md-code\">8147538b4226</code>）</td></tr><tr><td>额外抽查 7 个品牌的 canvas 色值</td><td>为深色基线找更合适候选</td><td><code class=\"md-code\">warp #2b2622</code>（深色，通过 A1 下限）、<code class=\"md-code\">x.ai #0a0a0a</code>（过暗）、<code class=\"md-code\">cursor/opencode.ai/supabase/elevenlabs</code> 均为浅色、<code class=\"md-code\">raychat</code> 拉取失败（不在该 revision 目录中）</td></tr><tr><td>本地对比度计算</td><td>验证 A1（≥7:1）相关论断</td><td>见 R1/R2/R2b 的实测数值；DIRECTION 的 <code class=\"md-code\">#071a24</code> 亮度 0.00911 低于门A 下限 <code class=\"md-code\">#0d2431</code>（0.01569）</td></tr><tr><td><code class=\"md-code\">node tooling/design-md.mjs list</code></td><td>确认品牌目录</td><td>74 个品牌，含 <code class=\"md-code\">linear.app</code> 与 <code class=\"md-code\">vercel</code></td></tr><tr><td><code class=\"md-code\">curl</code> 状态码 + 标题</td><td>可达性实测</td><td>tideguide.com=200、screensdesign 拆解页=200、dark.design=200、landing.love=200、godly=200、reactbits=200、magicui=200、21st.dev=200、Wikimedia Commons=200、Google Fonts 规格页=200</td></tr><tr><td>NOAA CO-OPS API 实际调用</td><td>验证数据可用性</td><td>HTTP 200，返回站点 9414290 的逐小时潮位预报 JSON</td></tr><tr><td>Wikimedia Commons API</td><td>核实单个文件许可</td><td>某潮汐图表文件 <code class=\"md-code\">LicenseShortName = Public domain</code></td></tr><tr><td>本地字体库 <code class=\"md-code\">ui-ux-pro-max/data/</code></td><td>首站字体与许可查询</td><td>1,934 个字体家族；JetBrains Mono / Geist Mono / Noto Sans SC / Noto Sans Mono 等均为 OFL，verifiedAt 2026-08-13</td></tr><tr><td>Web 检索</td><td>发现同类真实产品</td><td>命中 Tide Guide（tideguide.com），为 R3 来源</td></tr></tbody></table></div>\n<p class=\"md-p\"><strong>未执行</strong>：任何浏览器渲染验证、任何素材下载、任何登录或反爬绕过、任何对本地仓库文件的修改（除本文件外）。</p>","source":"# 潮汐 TIDE · 素材调研笔记（门B 候选清单）\n\n> 本文件是「素材调研」环节的产物，供用户在门B 勾选。\n> 上游输入：`demo/tide-app/docs/DIRECTION.md`（门A 方向稿）与\n> `demo/tide-app/docs/GATE-A-DECISION.md`（门A 裁决，含 4 项强制修正 A1–A4）。\n> 分类口径：`.agents/skills/ui-design-agent/references/material-scouting.md` 的\n> 四类 `reference` / `component` / `asset` / `prompt`。\n> 核实日期：2026-09-16（本地时区 PDT）。所有可达性均为当日实测结果，时间敏感。\n>\n> **门B 状态说明**：`demo/tide-app/docs/GATE-B-DECISION.md` 已对本清单作出裁决\n> （采纳 R1/R2/R3/A3/P1，排除 A1/A2/D1）。该裁决表**未包含本清单的 R2b（warp）**，\n> 而其中「深色基线只保留 linear.app」一句与 R2b 的建议存在冲突。**R2b 目前处于\n> 未裁决状态**，详见 R2b 条目末尾的说明。本文件如实保留该记录，不改写已通过的裁决。\n\n---\n\n## 〇、核心判断：这个项目几乎不需要外部生产素材\n\n**结论先给：潮汐曲线必须自绘 SVG，字体与图标走已有开源/系统方案，唯一值得外部引入的是「参考」而非「素材」。**\n\n理由分四条：\n\n1. **核心交互不可外包。** 这条曲线的全部价值在于：半日潮双峰形态由数据驱动、\n   可拖动时间轴、读数与游标弹簧联动、当前时刻脉冲。市面上的图表库或组件库\n   没有一个以「可拖动的潮汐形态 + 数据优先读数」为现成单元。强行装配一个通用\n   折线图组件，反而要拆掉它的坐标轴/图例/提示框体系，成本高于按\n   `motion-contract.md` 的弹簧预设自绘 `<path>`。这正符合 material-scouting\n   的「装配优先」例外条件之一：**适配成本高于干净本地实现**。\n2. **视觉方向已闭合。** DIRECTION 已定死深海底蓝 + 潮线青，且明确禁止渐变球、\n   玻璃拟态。具名基线 `linear.app` / `vercel` 属于**分析文档**（reference/prompt），\n   不是可下载的素材文件——它的作用是提供 token 关系对照，不是提供图片。\n3. **图标与字体有现成零成本路径。** 仓库多个 demo（tempo-day / brick-workshop 等）\n   已用 `lucide-react`（ISC，实测读 LICENSE 文件确认）；中文与数字可用系统字体栈\n   （macOS 的 PingFang SC + SF Mono），零外部素材。\n4. **演示数据不产生素材需求。** 门A 已确认可用演示数据。演示数据是本地生成的\n   数值，不是外部资产。\n\n**因此，真正需要用户裁决的是以下四点**（见第五节；其中前三项已由门B 裁决）：\n① 字体策略（纯系统栈 vs. 引入一款 OFL 等宽字体）→ **门B 已选系统栈**；\n② 是否要在契约阶段补一次 R3 的浏览器实地观察 → **门B 已要求补**；\n③ 确认「曲线自绘 + 可聚焦 range 控件」这条自研路径 → **门B 已批准**；\n④ **深色基线是否纳入 `warp`（R2b）—— 门B 未裁决，仍待澄清**（详见 R2b 与 Q4）。\n\n> **顺带发现（供契约阶段注意）**：DIRECTION 提议的底色 `#071a24` **比门A 修正 A1\n> 的下限 `#0d2431` 更暗**（相对亮度 0.00911 vs 0.01569），按 A1 的裁决理由（户外\n> 强光下过暗底色会反光成镜面）应当被替换。实测 `#0d2431` 配 `#e8f1f4` 正文对比度\n> 13.94:1，远超 A1 要求的 7:1，有充足余量。本笔记只报告这一冲突，最终色值由契约\n> 阶段定稿。\n\n---\n\n## 一、按四类分类的素材需求盘点\n\n| 类别 | 本项目的需求 | 是否需要外部素材 |\n| --- | --- | --- |\n| `reference` | 深色高对比、数据优先的版式与强调色克制关系；真实潮汐 App 的曲线呈现惯例 | **需要**（这是唯一有实际价值的外部引入） |\n| `component` | 潮汐曲线、拖动时间轴、弹簧读数 | **不需要**：自绘 SVG + 仓库已装的 `motion`（MIT） |\n| `asset` | 数字等宽字体、中文字形、图标 | **可选**：系统栈 + `lucide-react` 已够；若要更强「仪器面板」质感才需引入字体文件 |\n| `prompt` | 设计方向措辞与 token 结构对照 | **需要**（与 reference 同源，见 R1/R2/R2b） |\n\n> 说明：`reference` 与 `prompt` 在本项目里指向同一份来源（awesome-design-md 的\n> 品牌 DESIGN.md 分析），因为该文档既是视觉对照（reference）也是 token 措辞\n> 来源（prompt）。按 material-scouting「不要让画廊截图悄悄变成 asset」的原则，\n> 我把它明确标为 reference/prompt，**不入生产、不下载任何品牌图片**。\n\n---\n\n## 二、候选清单（供门B 勾选）\n\n### 2.1 主候选清单（6 项）\n\n> 任务书要求 3–6 个候选。我把真正需要用户裁决的收敛为下面 6 项；\n> 2.2 节是「已核实但建议直接沿用/本版不用」的记录项。\n> 「门B 裁决」列来自 `GATE-B-DECISION.md`（该表未包含 R2b）。\n\n| # | 候选 | 类别 | 授权状态 | 拟用在哪 | 我的建议 | 门B 裁决 |\n| --- | --- | --- | --- | --- | --- | --- |\n| R1 | awesome-design-md · `linear.app` | reference/prompt | MIT（实测） | 强调色克制关系、surface 阶梯思路 | adopt（附 A1 色值冲突警告） | ✅ 采纳（仅关系，不取色值） |\n| R2 | awesome-design-md · `vercel` | reference/prompt | MIT（实测） | 层次机制；**但它是浅色系统，非深色基线** | adopt（降级为次要参考） | ✅ 采纳（仅层次机制） |\n| R2b | awesome-design-md · `warp` | reference/prompt | MIT（实测） | **深色基线**（深色优先，且通过 A1 亮度下限） | adopt（建议取代 R2 作深色基线） | **⚠️ 未裁决**（见 Q4） |\n| R3 | Tide Guide（tideguide.com） | reference | 商业产品，无开源许可 | 同类真实产品的曲线交互惯例 | adopt（reference-only） | ✅ 采纳（reference-only） |\n| A1 | JetBrains Mono | asset | OFL-1.1（实测） | 潮位读数等宽数字 | 待裁决（见 Q1） | ❌ 本轮不采用 |\n| A2 | Noto Sans SC / Noto Sans Mono CJK | asset | OFL-1.1（读 LICENSE 实测） | 中文跨平台字形一致 | 待裁决（见 Q1，倾向不引入） | ❌ 本轮不采用 |\n\n### 2.2 记录项（已核实，建议直接沿用或本版不用，无需勾选）\n\n| # | 候选 | 类别 | 授权状态 | 结论 | 门B 裁决 |\n| --- | --- | --- | --- | --- | --- |\n| A3 | Lucide 图标 | asset | **ISC**（读 LICENSE 实测） | 沿用仓库既有 `lucide-react` 依赖，零新增素材 | ✅ 采纳 |\n| D1 | NOAA CO-OPS API | 数据源（非视觉素材） | **未明文核实** | 本版不用（门A 已裁定演示数据）；记录备查 | ❌ 本版不用 |\n| P1 | material-scouting / motion-contract | prompt | 本仓库自有 + Motion MIT | 弹簧预设与降级规则的依据 | ✅ 采纳 |\n\n---\n\n### R1 — awesome-design-md · `linear.app`（reference / prompt）\n\n| 字段 | 内容 |\n| --- | --- |\n| URL | https://github.com/VoltAgent/awesome-design-md（文件路径 `design-md/linear.app/DESIGN.md`） |\n| 类别 | reference + prompt |\n| 提供什么 | 对 Linear 公开网站 CSS 的结构化转写：语义 token（canvas `#010102`、surface 阶梯、单一强调色 `#5e6ad2`）、字阶与负字距、组件状态、Do/Don't。实测拉取 24,354 字节，含 frontmatter 与完整 colors/typography 段 |\n| 拟用在哪 | 契约阶段的 token 关系对照：**强调色只出现在品牌标记/焦点环/少数 CTA，绝不用于装饰**——这正是潮线青「只用在数据和当前时间上」的直接依据；surface 阶梯映射深海底蓝的层次 |\n| 授权状态 | **MIT**（GitHub API 实测 `license.spdx_id = MIT`，仓库 116,100★）。已锁定 revision `8147538b4226ae41e2487a9179e3bcc1f68e8554`（见 `tooling/sources.lock.json` 的 `designContracts`） |\n| 可达性 | 可达。用 `node tooling/design-md.mjs pull linear.app` 实际拉取成功，输出 24,354 字节 |\n| **⚠️ 与门A 修正 A1 的冲突** | Linear 的 canvas 实测为 **`#010102`**，远暗于门A 要求的「不暗于 `#0d2431` 级别」——门A 的理由是户外强光下过暗底色会反光成镜面，这与对比度无关，是绝对亮度问题。另外实测其 `ink-subtle #8a8f98` 在 `#010102` 上对比度为 **6.42:1，未达门A 要求的 7:1**。**因此 R1 只能取其「关系」（单一强调色、surface 阶梯思路、hairline 边框、负字距），绝不能照搬其色值。** 底色必须按 A1 独立计算（实测 `#0d2431` 配 `#e8f1f4` 正文可达 13.94:1，有充足余量） |\n| 改编边界 | 第三方分析文档，非 Linear 官方规范、不拥有品牌视觉身份。**只改写 token 关系与规则，不照搬全文、不复制其 preview.html、不声称与 Linear 关联**；文件按需拉取到临时目录，不提交入库。**色值一律不采用，只采用结构关系** |\n| 建议 | adopt（作为 reference/prompt，**且附 A1 冲突警告**） |\n\n### R2 — awesome-design-md · `vercel`（reference / prompt）\n\n| 字段 | 内容 |\n| --- | --- |\n| URL | https://github.com/VoltAgent/awesome-design-md（文件路径 `design-md/vercel/DESIGN.md`） |\n| 类别 | reference + prompt |\n| 提供什么 | Vercel 公开网站的 token 与规则转写（实测 41,405 字节） |\n| 授权状态 | **MIT**（同仓库，同一锁定 revision `8147538b4226ae41e2487a9179e3bcc1f68e8554`） |\n| 可达性 | 可达。`node tooling/design-md.mjs pull vercel` 实际拉取成功，41,405 字节 |\n| **⚠️ 与 DIRECTION 描述的偏差（重要）** | DIRECTION 把 vercel 列为「深色高对比」基线，但**实际拉取的文档显示它是以浅色为主的系统**：`canvas: #ffffff`、`canvas-soft: #fafafa`，深色只是「极性反转的分区带」（`showcase-band-dark`，用 `primary #171717` 作为深色带的背景）。**它并非深色主题范例。** 可借鉴的是它的**层次机制**：四级 surface 阶梯 + hairline + 极轻阴影，以及「用极性反转分区带来制造段落深度」这一手法——后者对本项目有用（深底页面上用略亮的带区分段落）。**不可借鉴的是它的明暗基调本身。** |\n| 另一处可用证据 | 实测其 `mute #888888` 在 `#ffffff` 上仅 **3.54:1**，未达 WCAG AA 正文标准（`body #4d4d4d` 为 8.45:1）。这提醒：**弱化文字色不能凭观感取，必须算对比度**——门A A1 要求 7:1，这条证据支持把「次要文字」也纳入计算 |\n| 改编边界 | 同 R1：改编关系，不照搬，不声称品牌关联，不入库；**且不得沿用其浅色基调** |\n| 建议 | adopt（作为 reference/prompt，**限定为「层次机制」参考，不作为深色基线**） |\n\n### R2b — awesome-design-md · `warp`（reference / prompt）— **建议取代 R2 作为深色基线**\n\n| 字段 | 内容 |\n| --- | --- |\n| URL | https://github.com/VoltAgent/awesome-design-md（文件路径 `design-md/warp/DESIGN.md`） |\n| 类别 | reference + prompt |\n| 提供什么 | Warp（终端类开发工具品牌）的设计分析。**实测为深色优先系统**：`canvas: #2b2622`（暖调近炭黑）、`canvas-soft: #383330`、`ink: #f7f5f0`、`hairline: #3f3a36`；上游描述其为「暖色近炭黑画布，仅由干净的 Inter 排版、偶发的衬线斜体时刻和密集的终端 mockup 图像打破；CTA 异常克制」。**「深色画布 + 密集数据 mockup + 克制 CTA」与潮汐仪器面板的定位高度吻合** |\n| 拟用在哪 | 取代 R2 成为深色基调的**结构**参照：surface 阶梯如何在小色差内制造层次、数据密集区域如何用 hairline 而非阴影分隔、CTA 如何保持克制 |\n| 授权状态 | **MIT**（同仓库，同一锁定 revision `8147538b4226ae41e2487a9179e3bcc1f68e8554`） |\n| 可达性 | 可达。`node tooling/design-md.mjs pull warp` 实际拉取成功 |\n| **与门A A1 的相容性（实测）** | `#2b2622` 相对亮度 **0.02015**，**高于**门A 下限 `#0d2431`（0.01569），故其绝对亮度符合 A1 的「不能过暗」要求。对比度实测：`ink #f7f5f0` = 13.74:1、`body #c9c0ad` = 8.29:1，均远超 A1 的 7:1；但其 `mute #aea69c` 仅 **6.23:1，未达 7:1**——所以次要文字色仍须独立重算 |\n| 改编边界 | 同 R1：改编 token 关系，不照搬全文与色值，不声称品牌关联，不入库。**注意其暖调（棕橙倾向）与潮汐的冷调海底蓝相反，只借「深色 + 层次机制」，不借色相** |\n| 建议 | adopt（作为 reference/prompt）；**与 R2 二选一或并用，但深色基线应以本项为准** |\n| **门B 裁决状态（后补记录）** | `GATE-B-DECISION.md` 的候选表**未列出 R2b**；其第二节裁决为「深色基线只保留 linear.app，且只取其关系不取色值」。由于门B 已明确**基线只提供关系、不提供色值**，所以这不构成硬冲突——底色由 A1 定为 `#0d2431`。但有一个实质问题值得澄清：**R1（linear.app）的 canvas `#010102` 相对亮度仅 0.00304，是所有抽查品牌里最暗的之一**（门A A1 下限 `#0d2431` 为 0.01569），而 **R2b（warp `#2b2622`，0.02015）是实测通过 A1 下限的深色优先系统**。若契约阶段需要「深色页面如何用 surface 阶梯 + hairline 制造层次」的具体参照，warp 比 linear 更贴近我们被 A1 约束后的实际明度区间。**本条保持未裁决，作为可选补充请用户确认。** |\n\n### R3 — Tide Guide（tideguide.com）（reference）\n\n| 字段 | 内容 |\n| --- | --- |\n| URL | https://tideguide.com/ ；另见 ScreensDesign 拆解页 https://screensdesign.com/showcase/tide-guide-charts-tables |\n| 类别 | reference |\n| 提供什么 | **同类真实产品的参考**：官方描述为 \"Simple, beautiful tide charts. See the tide at a glance, then scrub through the curve to understand exactly how the water changes throughout the day.\" 与 DIRECTION 的核心交互（可拖动潮汐曲线 + 读数）高度同构。用于观察真实潮汐产品如何组织曲线、高低潮标注与时间轴，验证「曲线即 hero」的做法在真实产品中成立 |\n| 拟用在哪 | 第三屏「一日两次涨落的说明」与核心曲线屏的信息层级对照；确认高低潮时刻标注、当前时刻标记的行业惯例 |\n| 授权状态 | **无公开开源许可**。这是商业产品/应用，页面未提供可复用的素材授权。**仅作 reference 研究** |\n| 可达性 | 可达。curl 实测 `https://tideguide.com/` → HTTP 200，标题 `Tide Guide: Tides, Marine Weather, Charts & Tables`；拆解页 `screensdesign.com/showcase/tide-guide-charts-tables` → 200 |\n| **观察状态更新（本笔记写成后）** | 我在本笔记中标注「未亲眼看到曲线 UI」的这一缺口，已由后续环节按门B 要求 B2 补齐：真实浏览器（Playwright，1440×1000）实测观察记录见 `docs/reference/OBSERVATION-tideguide.md` 与截图 `docs/reference/tideguide-hero-2026-09-16.png`。**该观察证实**：曲线占据主视区、曲线下有渐变填充、曲线上直接标注高低潮时刻与潮位值、有圆形游标点随读数。同时它**推翻**了方向稿第三屏「用文字解释一日两次涨落」的做法（该产品完全不解释潮汐原理，默认目标用户已知） |\n| 改编边界 | **reference-only**：只提炼可观察的布局与交互关系（曲线如何占据主位、读数如何贴曲线、拖动如何响应），**不复制其截图、图标、文案、配色或代码**，页面上不得出现其素材。观察截图仅作研究留痕，不进入产品 |\n| 建议 | adopt（reference-only） |\n\n### A1 — JetBrains Mono（asset，字体）\n\n| 字段 | 内容 |\n| --- | --- |\n| URL | https://github.com/JetBrains/JetBrainsMono ；Google Fonts 镜像 https://fonts.google.com/specimen/JetBrains+Mono |\n| 类别 | asset |\n| 提供什么 | 开源等宽字体，含 tabular 数字，适合潮位读数。DIRECTION 要求「数字用等宽字体，因为潮位是读数」 |\n| 拟用在哪 | 潮位读数、时间刻度、涨落时刻等所有数字 |\n| 授权状态 | **OFL-1.1**（GitHub API 实测 `license.spdx_id = OFL-1.1`，13,033★；本地字体库 `ui-ux-pro-max/data/google-font-licenses.json` 亦记录为 OFL，verifiedAt 2026-08-13） |\n| 可达性 | 可达。GitHub API 200；Google Fonts 规格页 200；JetBrains 官方字体页 https://www.jetbrains.com/lp/mono/ → 200 |\n| 改编边界 | OFL-1.1 允许商用、修改、嵌入与再分发，**保留版权声明与 OFL 许可文本**；不得单独售卖字体本身，不得使用 Reserved Font Name（若修改字形须改名）。落地方式建议自托管或 Google Fonts CDN |\n| 建议 | **待用户裁决**（见第五节 Q1） |\n\n### A2 — Noto Sans SC / Noto Sans Mono CJK（asset，中文字形）\n\n| 字段 | 内容 |\n| --- | --- |\n| URL | https://github.com/notofonts/noto-cjk ；Google Fonts 规格页 https://fonts.google.com/noto/specimen/Noto+Sans+SC |\n| 类别 | asset |\n| 提供什么 | 中文简体字形覆盖。门A 遗留问题「受众是中文为主还是中英双语」未定；若需保证非 macOS/非 Windows 环境的中文字形一致，需要一个明确的中文 Web 字体 |\n| 拟用在哪 | 中文正文与标签；`Noto Sans Mono CJK SC` 可让中文与等宽数字在同一读数行内对齐 |\n| 授权状态 | **SIL OFL 1.1**（实际读取仓库内 `Sans/LICENSE` 文件，开头即 \"This Font Software is licensed under the SIL Open Font License, Version 1.1\"；本地字体库同样记录 Noto Sans SC / Noto Sans Mono 为 OFL） |\n| 可达性 | 可达。GitHub API 列出 `Sans/Mono/NotoSansMonoCJKsc-Regular.otf` 等文件成功；Google Fonts 规格页 200 |\n| 改编边界 | 同 OFL-1.1：可商用、可嵌入、可再分发，保留许可与版权声明，不改名售卖 |\n| 备注 | **中文可用系统字体栈替代**（macOS `PingFang SC`、Windows `Microsoft YaHei`）——仓库现有 demo 全部走系统栈，零外部素材。仅当用户要求跨平台字形一致时才需要引入本项 |\n| 建议 | **待用户裁决**（见第五节 Q1）；默认倾向「系统栈，不引入」 |\n\n### A3 — Lucide 图标（asset，图标）\n\n| 字段 | 内容 |\n| --- | --- |\n| URL | https://github.com/lucide-icons/lucide ；https://lucide.dev |\n| 类别 | asset（图标组件） |\n| 提供什么 | 开源图标集，含潮汐/场景所需的基础图标（sun、moon、waves、map-pin、clock 等）。仓库已有多个 demo 使用 `lucide-react`（tempo-day、brick-workshop 等） |\n| 拟用在哪 | 第四屏三个场景（海钓/赶海/摄影）的克制图标；可能的时间/地点标注 |\n| 授权状态 | **ISC**（GitHub API 报 `NOASSERTION`，因此**实际读取了仓库 LICENSE 文件**：正文为 \"ISC License, Copyright (c) 2026 Lucide Icons\"；`packages/lucide-react/package.json` 的 `license` 字段为 `\"ISC\"`）。属宽松许可，等同 MIT 的宽松度 |\n| 可达性 | 可达。GitHub API 200，LICENSE 与 package.json 均成功读取 |\n| 改编边界 | ISC 允许商用与修改，保留版权与许可声明即可。**沿用仓库既有依赖模式，不新增第二套图标库**；DIRECTION 明确「不用图标堆」，所以用量应极少 |\n| 建议 | adopt（沿用既有依赖，零新增素材） |\n\n### D1 — NOAA CO-OPS Data Retrieval API（可选：数据源，非视觉素材）\n\n| 字段 | 内容 |\n| --- | --- |\n| URL | https://api.tidesandcurrents.noaa.gov/api/prod/ |\n| 类别 | 数据源（不是 material-scouting 四类中的视觉素材；列在此处是因为它对应门A 的待确认问题） |\n| 提供什么 | 美国官方潮位观测与**预报（predictions）**数据。实测调用成功，返回逐小时潮位 JSON，例如站点 9414290（旧金山）2026-09-15 的 `{\"t\":\"2026-09-15 00:00\",\"v\":\"2.705\"} …`。含 datum / units / time_zone / interval 等参数 |\n| 拟用在哪 | 若用户希望页面用**真实潮汐形态**而非正弦模拟：可直接取某站某日的 predictions 曲线，让「半日潮双峰」是真实数据而非近似 |\n| 授权状态 | **未完全核实（诚实标注）**：NOAA 作为美国联邦机构，其数据通常属公共领域，但我**未能找到 API 页面上明文的授权/使用条款声明**——`/api/prod/` 只写了 throttling 与报错说明；`disclaimers.html`、`about_us.html`、`web_services_info.html` 均未抓到 \"public domain / copyright / terms of use\" 的明文。**因此本项授权状态记为待核实，不能当作已获授权使用** |\n| 可达性 | 可达。curl 实测 API 返回 HTTP 200 与真实数据（见上）；文档页 `/api/prod/` → 200 |\n| 改编边界 | 若采纳：需在页面标注数据来源与「预报非实测」；遵守其 throttling 建议（调用间加 sleep、只取所需数据） |\n| **门A 裁决影响** | 门A 已裁定「演示数据可接受」，因此**本版不采用 D1**。保留此条仅为记录已核实的数据源与「授权状态未明文核实」这一事实，供后续版本需要真实数据时参考 |\n| 建议 | **reject（本版不用）**；记录为后续版本的备选，且届时须先澄清授权 |\n\n### P1 — material-scouting 的装配优先基线（prompt / 流程，非可下载素材）\n\n| 字段 | 内容 |\n| --- | --- |\n| URL | `.agents/skills/ui-design-agent/references/material-scouting.md`、`motion-contract.md` |\n| 类别 | prompt |\n| 提供什么 | 弹簧预设（`snappy: stiffness 400 / damping 30`、`elegant: 100/20` 等）、`prefers-reduced-motion` 降级规则、装配优先规则 |\n| 拟用在哪 | 拖动游标的弹簧跟随用 `snappy`；曲线入场描线用 `elegant`；脉冲动画的 reduced-motion 降级 |\n| 授权状态 | 本仓库自有文档，无外部授权问题；其引用的 `motion` 包为 **MIT**（GitHub API 实测 `motiondivision/motion` → MIT） |\n| 可达性 | 本地文件，已读取 |\n| 改编边界 | 按 motion-contract 规定的预设使用，不自定义弹簧参数 |\n\n---\n\n## 三、明确不采用的（考虑过但排除）\n\n| 候选 | 类别 | 排除原因 |\n| --- | --- | --- |\n| **React Bits**（https://reactbits.dev） | component | ① 许可证**不是纯 MIT**：实际读取 `LICENSE.md`，正文为 \"MIT + Commons Clause License Condition v1.0\"，Commons Clause 会限制「出售该软件本身」；② 其组件以炫技型文字/背景特效为主，与 DIRECTION 明确禁止的「AI 味」高度重叠；③ 核心曲线不能由它提供。可达（200），但排除 |\n| **Magic UI**（https://magicui.design） | component | 许可为 **MIT**（实测，22,303★）、可达（200），技术上可用；但本页没有「环境光/背景特效」需求（DIRECTION 禁渐变球与玻璃拟态），曲线又是自绘，故**无落点**。保留为将来需要入场特效时的备选，本轮不采用 |\n| **21st.dev** | component | 可达（200），但库内记录明确「许可逐组件检查，不入预清层」。本轮无组件需求，不值得为 0 个落点逐个核许可 |\n| **d3-shape** | component | 可达、**ISC** 许可（实测 2,528★）。但对「正弦叠加半日潮」这种形态，手写 SVG path 的代码量小于引入并配置 d3-shape 生成器；按装配优先的例外条款（适配成本 > 本地实现）排除 |\n| **unDraw 插画**（https://undraw.co） | asset | 可达、开源许可可商用，但 DIRECTION 的基调是「像一块被水浸过的仪器面板」，扁平人物插画与数据优先的调性冲突；三个场景用文字与克制图标表达即可 |\n| **Unsplash / Pexels 海景照片** | asset | 库内记录二者在隔离浏览器中 403，且本项目**不需要摄影素材**——曲线本身就是 hero，加海景照片会稀释数据优先的定位。直接排除，不做重试 |\n| **Godly / Awwwards / Dark Design / Land Book** | reference | 均为研究型画廊（部分被反爬：Land Book curl 403）。本项目的方向基线已由 R1/R2/R2b 具名锁定，再用泛画廊采样会引入与 DIRECTION 不一致的风格噪音。**dark.design 实测可达（200）**，若用户想扩宽深色方向参考可再启用，本轮不采用 |\n| **Poly Haven / Kenney / Tripo 3D 素材** | asset | 可达且多为 CC0，但本项目是 2D 数据页，无 3D 需求。排除 |\n| **Wikimedia Commons 潮汐图表** | asset | 可达（200），实测某 19 世纪潮汐图文件为 **Public domain**（BnF 藏，API 核实 LicenseShortName=Public domain）。但那是历史版画图表，作为生产图片会破坏现代仪器面板的调性。**若需要「潮汐图的历史注解」可作参考**，本轮排除 |\n| **Typewolf / Fonts In Use** | reference | 可达，用于字体选型发散。但字体决策（Q1）只需在「系统栈」与「一款 OFL 等宽」之间二选一，无需引入额外检索站 |\n| **`motionlab.dev`** | — | 库内明确记录为占位页，禁止引用 |\n| **Linear / Vercel / Warp 官网直接取图** | asset | 品牌官网的截图与图片**不可复用**；R1/R2/R2b 用的是 MIT 许可的**第三方分析文档**，不是品牌资产。此边界必须写进契约 |\n\n---\n\n## 四、诚实边界与未核实项\n\n以下是我**没有**核实或**无法**核实的内容，明确列出，不作任何推断性断言：\n\n1. **NOAA 数据授权状态未明文核实。** 我实际调用了 CO-OPS API 并成功取回真实数据，但**没有在 NOAA 页面上找到明文的公共领域/使用条款声明**。`tidesandcurrents.noaa.gov/disclaimers.html`、`about_us.html`、`web_services_info.html`、`/api/prod/` 均未抓到 \"public domain\" 或等效措辞。按 material-scouting「未知权利保持 pending，不当作许可」的原则，D1 的授权状态记为**待核实**（本版因门A 已裁定用演示数据而不采用）。若将来要接真实数据，建议向 `co-ops.userservices@noaa.gov` 确认，或改用有明确许可的替代源。\n2. **Tide Guide 页面正文未能抓取（本笔记当时的限制；后续已补齐）。** 我做调研时，站点为客户端渲染（返回内容以 Mixpanel 脚本为主），我只确认了 **HTTP 200 与页面标题**，**没有实际看到其曲线 UI 的渲染结果**。R3 的「交互同构」判断来自其官方描述文本（\"scrub through the curve\"）与 ScreensDesign 的拆解条目，属**描述级证据，非亲眼观察**。**此缺口已由后续环节按门B 要求 B2 用真实浏览器补齐**（见 `docs/reference/OBSERVATION-tideguide.md`）；该观察证实了曲线布局的多数判断，但也推翻了方向稿第三屏的解释性做法。\n3. **字体文件的真实下载未执行。** 我核实的是一致性许可（OFL-1.1 / ISC）与仓库元数据，**没有下载任何字体或图标文件**，也没有自托管验证。落地方式（自托管 vs. Google Fonts CDN）与子集化策略留待契约/实现阶段。\n4. **未做浏览器渲染验证。** 本笔记中所有可达性均为 HTTP 状态码与 API 返回，**不是浏览器中的视觉确认**。「可达」不等于「集成可用」。（例外说明：R3 的浏览器观察是**本笔记写成之后**由后续环节完成的，不属于我本轮的核实证据；见第 2 条。）\n5. **未打开任何真实浏览器、未登录任何站点、未绕过任何反爬。** 所有访问均为公开页面的直接 HTTP 请求、GitHub API 调用，以及一次公开 Web 检索（用于发现同类真实产品，经 `search_proxy_serper_search` 调用）。我**没有**使用浏览器自动化工具。\n6. **`awesome-design-md` 是第三方分析，不是官方规范。** R1/R2/R2b 的 token 值是「该品牌网站实际长什么样」的转写，不能当作品牌授权或官方设计系统。\n7. **本地字体库数据的时效。** `google-font-licenses.json` 记录 `verifiedAt: 2026-08-13`，距核实日约一个月，在 material-scouting 建议的「一季内复验」窗口内。\n\n---\n\n## 五、需要用户裁决的问题（门B）\n\n> **门A 已裁决、不再询问的事项**：语言 = **中文为主**（不做双语）；数据 = 演示数据可接受（须满足 A3 标注要求）。\n>\n> **门B 已对本节作出裁决**（见 `GATE-B-DECISION.md` 第四节），结论记录如下：\n> Q1 → **选 A，纯系统字体栈**（另加要求 B1：数字必须用 `tabular-nums`）；\n> Q2 → **要补** R3 的浏览器实地观察（要求 B2）；\n> Q3 → **批准**「自绘 SVG + 原生 `input[type=range]`」路径（要求 B3：隐藏视觉样式不得用 `display:none`/`visibility:hidden`，须保留可聚焦性）。\n> 下文保留原始提问以供追溯；**唯一仍待澄清的是 R2b（warp）的深色基线问题**，见 Q4。\n\n### Q1 — 字体策略：系统栈，还是引入 OFL 等宽字体？（门B 已裁决：选 A）\n\n| 选项 | 内容 | 代价 |\n| --- | --- | --- |\n| **A. 纯系统字体栈**（门B 采纳） | 数字用 `ui-monospace, \"SF Mono\", Menlo, Consolas, monospace`；中文用 `-apple-system, \"PingFang SC\", \"Microsoft YaHei\"`。与仓库现有 demo 一致 | 零外部素材、零许可负担、零加载开销；代价是不同平台数字字形略有差异 |\n| **B. 引入 JetBrains Mono（+ 可选 Noto Sans SC）**（门B 排除） | 自托管或 CDN 引入 A1/A2 | 更强的「仪器面板」质感与跨平台一致；代价是增加字体文件与 OFL 许可声明义务 |\n\n> 门B 补充要求 **B1**：数字必须用 `tabular-nums`，否则读数跳动时宽度会变。\n\n### Q2 — 是否需要在契约/实现阶段补充 R3 的浏览器实地观察？（门B 已裁决：要补；**已补完**）\n\nR3（Tide Guide）是目前唯一「同类真实产品 + 可拖动潮汐曲线」的参考，我在本笔记中只确认了它可达（HTTP 200 + 标题），**没有亲眼看到其曲线 UI**（站点为客户端渲染）。门B 采纳本条，要求契约阶段用真实浏览器实际观察并留痕（要求 **B2**）。**该要求已由后续环节完成**：观察记录见 `docs/reference/OBSERVATION-tideguide.md`，截图见 `docs/reference/tideguide-hero-2026-09-16.png`。关键发现已回填至上方 R3 条目——其中包括一条对方向稿的推翻（第三屏「解释潮汐原理」应改为「展示曲线用法」）。\n\n### Q3 — 曲线自绘的边界确认（回应门A 修正 A4）（门B 已裁决：批准）\n\n门A 要求曲线轴**可键盘操作**，必须是可聚焦控件而非纯鼠标拖拽 div。方案：自绘 SVG 曲线 + 一个真正可聚焦的 `input[type=range]` 作为时间轴控件（方向键可调），视觉上把 range 隐藏、由 SVG 游标与读数跟随其值。门B 批准此路径，并加要求 **B3**：隐藏视觉样式**不得使用 `display:none` 或 `visibility:hidden`**（会失去可聚焦性），须用 `opacity:0` + 定位覆盖或 `appearance:none` 保留在布局中。\n\n### Q4 —【门B 未裁决】深色层次结构是否补充参考 `warp`（R2b）？\n\n门B 的候选裁决表未列 R2b，其第二节写明「深色基线只保留 linear.app」。由于门B 同时明确基线**只取关系不取色值**，底色已由 A1 定为 `#0d2431`，所以这不是硬冲突，而是一个**可选的补充问题**：\n\n实测事实是——`linear.app` 的 canvas 为 **`#010102`**（相对亮度 0.00304），是被 A1 否掉的那种极暗底；而 `warp` 的 canvas 为 **`#2b2622`**（相对亮度 0.02015），**实测通过 A1 亮度下限**，且它是深色优先系统、有完整的 surface 阶梯与 hairline 体系。\n\n**请确认**：契约阶段做「深色页面层次」时，是否补充参考 warp 的 surface 阶梯做法（不取色相、不取色值，只取层次机制）？\n- **选项 A（我的建议）**：补充 warp 作为深色层次的参照，linear 保留为「强调色克制」的参照。\n- **选项 B**：维持门B 原裁决，只用 linear 的关系。\n\n\n\n\n---\n\n## 六、本轮检索留痕\n\n| 手段 | 用途 | 结果 |\n| --- | --- | --- |\n| `gh api repos/<owner>/<repo>` | 核实仓库许可与 star | awesome-design-md=MIT、motion=MIT、JetBrainsMono=OFL-1.1、IBM/plex=OFL-1.1、geist-font=OFL-1.1、noto-cjk=null（需读文件）、lucide=NOASSERTION（需读文件）、React Bits=NOASSERTION（需读文件）、Magic UI=MIT、d3-shape=ISC |\n| `gh api .../contents/LICENSE` | 读取实际许可正文 | Lucide=**ISC**；noto-cjk `Sans/LICENSE`=**SIL OFL 1.1**；React Bits `LICENSE.md`=**MIT + Commons Clause** |\n| `node tooling/design-md.mjs pull linear.app / vercel / warp` | 拉取具名基线 | 成功：24,354 / 41,405 / warp（revision `8147538b4226`） |\n| 额外抽查 7 个品牌的 canvas 色值 | 为深色基线找更合适候选 | `warp #2b2622`（深色，通过 A1 下限）、`x.ai #0a0a0a`（过暗）、`cursor/opencode.ai/supabase/elevenlabs` 均为浅色、`raychat` 拉取失败（不在该 revision 目录中） |\n| 本地对比度计算 | 验证 A1（≥7:1）相关论断 | 见 R1/R2/R2b 的实测数值；DIRECTION 的 `#071a24` 亮度 0.00911 低于门A 下限 `#0d2431`（0.01569） |\n| `node tooling/design-md.mjs list` | 确认品牌目录 | 74 个品牌，含 `
