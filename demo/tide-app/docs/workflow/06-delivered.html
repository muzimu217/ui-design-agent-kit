vels,\n  buildLinePath,\n  createGeometry,\n  minutesForTick,\n  xForPoint,\n  yForLevel,\n  yForPoint,\n  type PlotGeometry,\n} from './curve.ts';\nimport { DemoDataBadge, UnitLabel, elegant, snappy, useReducedMotionPreference } from './ui.tsx';\n\nexport type CurveStatus = 'loading' | 'ready' | 'empty';\n\n/** 时间轴刻度：每 6 小时一格（纯标注，不承载交互）。 */\nconst TICK_STEPS = [0, 36, 72, 108, 144];\n/**\n * 极值贴近绘图区左右边缘时切换标注锚点，避免标注被裁掉。\n * 阈值取标注自身宽度的一半（约 48px）与绘图区宽度的 12% 的较大者，\n * 于是窄视口与宽视口都不会出现越界标注，也不会在极值靠边时还居中摆放。\n */\nconst ANCHOR_MARGIN_PX = 48;\nfunction anchorMargin(width: number): number {\n  return Math.max(ANCHOR_MARGIN_PX, width * 0.12);\n}\n\ntype TideCurveProps = {\n  status: CurveStatus;\n  day: TideDay | null;\n  step: number;\n  onStepChange: (step: number) => void;\n  /** 页面打开时取的「现在」快照，同时决定当前时刻标记的位置。 */\n  nowMinutes: number;\n};\n\n/** 用 ResizeObserver 取绘图区像素尺寸，使 SVG 的 viewBox 与像素 1:1（描边不被拉伸）。 */\nfunction usePlotBox() {\n  const ref = useRef<HTMLDivElement>(null);\n  const [box, setBox] = useState({ width: 0, height: 0 });\n\n  useLayoutEffect(() => {\n    const element = ref.current;\n    if (!element) return;\n    const measure = () => {\n      const rect = element.getBoundingClientRect();\n      setBox(previous =>\n        Math.abs(previous.width - rect.width) < 0.5 && Math.abs(previous.height - rect.height) < 0.5\n          ? previous\n          : { width: rect.width, height: rect.height },\n      );\n    };\n    measure();\n    if (typeof ResizeObserver === 'undefined') {\n      window.addEventListener('resize', measure);\n      return () => window.removeEventListener('resize', measure);\n    }\n    const observer = new ResizeObserver(measure);\n    observer.observe(element);\n    return () => observer.disconnect();\n  }, []);\n\n  return { ref, box };\n}\n\nexport function TideCurve({ status, day, step, onStepChange, nowMinutes }: TideCurveProps) {\n  const { ref, box } = usePlotBox();\n  const [dragging, setDragging] = useState(false);\n\n  const cursorStep = Math.min(AXIS_MAX, Math.max(0, step));\n  const cursorMinutes = minutesForStep(cursorStep);\n  const cursorPoint: TidePoint | null = day?.points[cursorStep] ?? null;\n  const cursorLevel = cursorPoint?.level ?? null;\n  const cursorTrend = trendAtMinutes(cursorMinutes);\n\n  const geometry: PlotGeometry | null = day && box.width > 0 && box.height > 0 ? createGeometry(day, box) : null;\n  const ready = status === 'ready' && day !== null && day.points.length > 1;\n  const drawable = ready && geometry !== null && cursorPoint !== null;\n\n  /**\n   * 方向键 / PageUp / PageDown / Home / End（契约 4 节键盘路径）。\n   *\n   * 原生 `input[type=range]` 已经提供 Arrow ±1 步、Home/End 以及 PageUp/PageDown，\n   * 但原生的 PageUp/PageDown 步长由浏览器决定，并不保证等于「6 步 = 1 小时」。\n   * 因此只对这两个键覆写，其余全部保留原生行为。契约 9.2 写「全部为原生行为」，\n   * 与它自己第 4 节要求的「PageUp/PageDown = ±6 步」不能同时成立，此处按第 4 节的功能要求实现，\n   * 并在交付报告中登记该冲突。\n   */\n  const handleKeyDown = useCallback(\n    (event: React.KeyboardEvent<HTMLInputElement>) => {\n      if (event.key !== 'PageUp' && event.key !== 'PageDown') return;\n      event.preventDefault();\n      const delta = event.key === 'PageUp' ? 6 : -6;\n      onStepChange(Math.min(AXIS_MAX, Math.max(0, cursorStep + delta)));\n    },\n    [cursorStep, onStepChange],\n  );\n\n  const handleReset = useCallback(() => {\n    onStepChange(stepForMinutes(nowMinutes));\n  }, [nowMinutes, onStepChange]);\n\n  return (\n    <section className=\"section tide-section\" id=\"tide-curve\" aria-labelledby=\"tide-curve-title\">\n      <div className=\"section-inner\">\n        <div className=\"section-heading\">\n          <div>\n            <h2 id=\"tide-curve-title\">今日潮汐曲线</h2>\n            <p className=\"section-detail\">拖动曲线，或用 Tab 聚焦后按方向键，查清今天几点能下水。</p>\n          </div>\n          <DemoDataBadge variant=\"outline\" />\n        </div>\n\n        <div className={`curve-panel is-${status}`}>\n          <div className=\"curve-readout-row\">\n            <span className=\"readout-caption\">\n              <Clock size={16} aria-hidden=\"true\" />\n              游标位置\n            </span>\n            <TideReadout\n              status={status}\n              minutes={cursorMinutes}\n              level={cursorLevel}\n              trend={cursorTrend}\n              live={status === 'ready'}\n            />\n            <button type=\"button\" className=\"ghost-button\" onClick={handleReset} disabled={!ready}>\n              回到现在\n            </button>\n          </div>\n\n          <div className={`curve-plot is-${status}${dragging ? ' is-dragging' : ''}`}>\n            {/* 内区：由 --plot-inset 让出上下两条留白带，高通留白放高潮标注、低通留白放低潮标注。\n                ResizeObserver 量的是这一层，SVG 的 viewBox 与它 1:1。 */}\n            <div className=\"curve-inner\" ref={ref}>\n              {drawable && geometry && day && cursorPoint && (\n                <CurveCanvas\n                  day={day}\n                  geometry={geometry}\n                  cursorPoint={cursorPoint}\n                  nowMinutes={nowMinutes}\n                  dragging={dragging}\n                />\n              )}\n            </div>\n\n            {status === 'loading' && (\n              <div className=\"curve-state\" role=\"status\">\n                <p className=\"curve-state-text\">正在载入今日潮位…</p>\n              </div>\n            )}\n\n            {status === 'empty' && (\n              <div className=\"curve-state\" role=\"status\">\n                <p className=\"curve-state-text\">\n                  今日潮位数据暂不可用。演示数据生成失败——刷新页面可重新生成。\n                </p>\n              </div>\n            )}\n\n            {/* 时间轴始终渲染：契约 9.2 要求「禁用」状态真实存在，\n                而禁用状态只在数据未就绪时出现。控件不得用 display:none / visibility:hidden 隐藏（B3）。 */}\n            <input\n              className=\"tide-range\"\n              type=\"range\"\n              min={0}\n              max={AXIS_MAX}\n              step={1}\n              value={cursorStep}\n              disabled={!ready}\n              aria-label=\"潮汐时间轴，方向键调整，每步 10 分钟\"\n              aria-valuetext={cursorLevel === null ? '暂无数据' : readoutSentence(cursorMinutes, cursorLevel)}\n              onChange={event => onStepChange(Number(event.currentTarget.value))}\n              onKeyDown={handleKeyDown}\n              onPointerDown={() => setDragging(true)}\n              onPointerUp={() => setDragging(false)}\n              onPointerCancel={() => setDragging(false)}\n              onBlur={() => setDragging(false)}\n            />\n\n            {/* 焦点环必须画在容器上：控件本身 opacity:0，它自己的 outline 不可见。\n                用相邻兄弟选择器驱动，不依赖 `:has()`。 */}\n            <span className=\"curve-focus-ring\" aria-hidden=\"true\" />\n          </div>\n\n          <div className=\"curve-ticks\" aria-hidden=\"true\">\n            {TICK_STEPS.map(tick => (\n              <span key={tick} className=\"num\" lang=\"en\">\n                {formatClock(minutesForTick(tick))}\n              </span>\n            ))}\n          </div>\n        </div>\n      </div>\n    </section>\n  );\n}\n\n/* ------------------------------------------------------------------ 读数 */\n\ntype TideReadoutProps = {\n  status: CurveStatus;\n  minutes: number;\n  level: number | null;\n  trend: TideTrend;\n  live?: boolean;\n};\n\n/** 读数：时间 + 潮位（数字栈、tabular-nums、min-width）+ 涨/退潮文字标签（不依赖颜色单独表意）。 */\nexport function TideReadout({ status, minutes, level, trend, live = false }: TideReadoutProps) {\n  const resolved = status === 'ready' && level !== null;\n  const sentence = resolved\n    ? readoutSentence(minutes, level)\n    : status === 'loading'\n      ? '正在载入今日潮位'\n      : '今日潮位数据暂不可用';\n\n  return (\n    // 契约 4 节第 3 条：改值时通过 role=status / aria-live=polite / aria-atomic=true 播报整句，\n    // 而不是碎片。因此可见单元格对辅助技术隐藏，只播报整句，避免同一读数被朗读两遍。\n    <p className=\"tide-readout\" {...(live ? { role: 'status', 'aria-live': 'polite', 'aria-atomic': 'true' } : {})}>\n      <span className=\"visually-hidden\">{sentence}</span>\n      <span className=\"readout-time num\" lang=\"en\" aria-hidden=\"true\">\n        {resolved ? formatClock(minutes) : '--:--'}\n      </span>\n      <span className=\"readout-level num\" lang=\"en\" aria-hidden=\"true\">\n        {resolved ? formatLevel(level) : status === 'loading' ? '—.—' : '暂无数据'}\n      </span>\n      {resolved ? <UnitLabel /> : null}\n      <span className=\"readout-trend\" aria-hidden=\"true\">\n        {resolved ? trendLabel(trend) : status === 'loading' ? '载入中' : '不可用'}\n      </span>\n    </p>\n  );\n}\n\n/* ------------------------------------------------------------------ 画布 */\n\ntype CurveCanvasProps = {\n  day: TideDay;\n  geometry: PlotGeometry;\n  cursorPoint: TidePoint;\n  nowMinutes: number;\n  dragging: boolean;\n};\n\n/**\n * 曲线画布：SVG 路径 + 标注 + 当前时刻标记 + 游标。\n *\n * 单独导出是为了让测试能用显式 geometry 直接渲染它 —— 在 SSR / 无布局环境里\n * ResizeObserver 拿不到尺寸，外层的 TideCurve 不会挂载画布，但画布自身的产物\n * （D1 的标注结构、9.1 的 role=img 与 aria-label）仍然需要被核对。\n */\nexport function CurveCanvas({ day, geometry, cursorPoint, nowMinutes, dragging }: CurveCanvasProps) {\n  const reduceMotion = useReducedMotionPreference();\n  const gradientId = `tide-fill-${useId().replace(/[^a-zA-Z0-9-]/g, '')}`;\n\n  const linePath = buildLinePath(day.points, geometry);\n  const areaPath = buildAreaPath(day.points, geometry);\n  const gridLevels = buildGridLevels(geometry);\n\n  const cursorX = xForPoint(cursorPoint, geometry);\n  const cursorY = yForPoint(cursorPoint, geometry);\n\n  const nowStep = Math.min(AXIS_MAX, Math.max(0, Math.round(nowMinutes / SAMPLE_INTERVAL_MINUTES)));\n  const nowPoint = day.points[nowStep];\n  const nowX = (Math.min(DAY_MINUTES, Math.max(0, nowMinutes)) / DAY_MINUTES) * geometry.width;\n  const nowY = nowPoint ? yForPoint(nowPoint, geometry) : geometry.height;\n  const nowLabelFlipped = nowX > geometry.width * 0.6;\n\n  return (\n    <>\n      <svg\n        className=\"curve-canvas\"\n        width={geometry.width}\n        height={geometry.height}\n        viewBox={`0 0 ${geometry.width} ${geometry.height}`}\n        role=\"img\"\n        aria-label={buildCanvasLabel(day)}\n      >\n        <defs>\n          <linearGradient id={gradientId} x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n            {/* 曲线下方渐变填充：--accent 从 opacity 0.10 衰减到 0。0.10 是硬上限（QG4）。 */}\n            <stop className=\"fill-stop-start\" offset=\"0%\" />\n            <stop className=\"fill-stop-end\" offset=\"100%\" />\n          </linearGradient>\n        </defs>\n\n        {/* 网格：纯装饰（--gridline） */}\n        {gridLevels.map(level => {\n          const rounded = Math.round(yForLevel(level, geometry) * 100) / 100;\n          return <line key={level} className=\"curve-gridline\" x1={0} x2={geometry.width} y1={rounded} y2={rounded} />;\n        })}\n\n        <path className=\"curve-area\" d={areaPath} fill={`url(#${gradientId})`} />\n\n        {/* 曲线描线：首次进入视口用 elegant（大面积媒体），减少动效下直接给最终形态。 */}\n        <motion.path\n          className=\"curve-line\"\n          d={linePath}\n          pathLength={1}\n          fill=\"none\"\n          initial={reduceMotion ? false : { strokeDashoffset: 1 }}\n          whileInView={{ strokeDashoffset: 0 }}\n          viewport={{ once: true, amount: 0.3 }}\n          transition={reduceMotion ? { duration: 0 } : elegant}\n          style={{ strokeDasharray: 1 }}\n        />\n      </svg>\n\n      {/* 高低潮标注：直接标在曲线极值旁，落在绘图区的上下留白带里。\n          不可点击 —— 没有背景、没有边框、没有 hover 态、没有 pointer 光标（D1）。 */}\n      <div className=\"curve-annotations\">\n        {day.extrema.map(item => {\n          const x = xForPoint(item, geometry);\n          const isHigh = item.kind === 'high';\n          const edge =\n            x < anchorMargin(geometry.width)\n              ? 'is-anchor-start'\n              : x > geometry.width - anchorMargin(geometry.width)\n                ? 'is-anchor-end'\n                : '';\n          return (\n            <p\n              key={`${item.kind}-${item.step}`}\n              className={`curve-annotation is-${item.kind} ${edge}`}\n              style={{ left: `${x}px`, top: `${isHigh ? 0 : geometry.height}px` }}\n            >\n              <span className=\"annotation-time num\" lang=\"en\">\n                {formatClock(item.minutes)}\n              </span>\n              <span className=\"annotation-level num\" lang=\"en\">\n                {formatLevel(item.level)}\n              </span>\n              <span className=\"visually-hidden\">{isHigh ? '高潮' : '低潮'}</span>\n            </p>\n          );\n        })}\n      </div>\n\n      {/* 当前时刻标记：全页唯一的循环动画（契约 3.6 / 9.4）。 */}\n      <div className=\"now-marker\" style={{ transform: `translateX(${nowX}px)` }}>\n        <span className=\"now-line\" />\n        <span className=\"now-dot\" style={{ top: `${nowY}px` }} />\n        <span className={`now-label num ${nowLabelFlipped ? 'is-flipped' : ''}`} style={{ top: `${nowY}px` }} lang=\"en\">\n          现在 {formatClock(nowMinutes)}\n        </span>\n        <span className=\"visually-hidden\">当前时刻 {formatClock(nowMinutes)}，潮位 {nowPoint ? formatLevel(nowPoint.level) : '暂无数据'} 米。</span>\n      </div>\n\n      {/* 游标：拖动 / 键盘改值时用 snappy 跟随（契约 3.6）。 */}\n      <motion.div\n        className={`curve-cursor${dragging ? ' is-dragging' : ''}`}\n        initial={false}\n        animate={{ x: cursorX }}\n        transition={reduceMotion ? { duration: 0 } : snappy}\n      >\n        <span className=\"cursor-line\" />\n        <span className=\"cursor-dot\" style={{ top: `${cursorY}px` }} />\n      </motion.div>\n    </>\n  );\n}\n\n/** SVG 的无障碍概述（契约 9.1：role=img + aria-label 概述当日高低潮时刻）。 */\nfunction buildCanvasLabel(day: TideDay): string {\n  const parts = day.extrema.map(\n    item =>\n      `${formatClock(item.minutes)} ${item.kind === 'high' ? '高潮' : '低潮'} ${formatLevel(item.level)} 米`,\n  );\n  if (parts.length === 0) return '今日潮汐曲线，暂无高低潮标注。';\n  return `今日潮汐曲线：${parts.join('，')}。横轴为 00:00 到 24:00，纵轴为潮位米数。`;\n}\n"},{"path":"src/App.tsx","status":"ok","kind":"text","reason":null,"bytes":11709,"html":null,"source":"/**\n * 潮汐 TIDE 产品页 —— 单页五个纵向 section（契约第 8 节 Output structure）。\n *\n *   1 Hero        品牌 + 主张 + 今日潮位读数 + 主 CTA        （A2：375×812 不滚动可见读数）\n *   2 TideCurve   自绘 SVG 曲线 + input[type=range] 时间轴   （A4 / B3 / B1）\n *   3 CurveInUse  基于同一份演示数据的用法判断，不解释潮汐原理（B2）\n *   4 Scenarios   海钓 / 赶海 / 摄影 三张场景卡\n *   5 Footer      下载引导 + 演示数据声明\n */\n\nimport { useCallback, useMemo, useState } from 'react';\nimport { MotionConfig, motion } from 'motion/react';\nimport { MapPin, Sun, Waves } from 'lucide-react';\nimport {\n  AXIS_MAX,\n  SAMPLE_COUNT,\n  buildCurveInUse,\n  buildScenarioValues,\n  createTideDay,\n  formatClock,\n  formatLevel,\n  levelAtMinutes,\n  readoutSentence,\n  stepForDate,\n  trendAtMinutes,\n  trendLabel,\n  type TideDay,\n  type TideTrend,\n} from './model.ts';\nimport { TideCurve, type CurveStatus } from './TideCurve.tsx';\nimport {\n  DemoDataBadge,\n  NumericText,\n  PressableLink,\n  STAGGER_SECONDS,\n  UnitLabel,\n  elegant,\n  useReducedMotionPreference,\n} from './ui.tsx';\n\n/**\n * 演示数据是同步生成的，没有真实异步源，因此默认路径下不存在真实的加载时序。\n * 契约 9.1 / 9.2 / 9.3 / 9.6 要求实现「加载」与「空」两个状态，\n * 于是用 URL 参数把这两条真实代码路径显式打开，便于逐条核对；不引入任何假延时、假 handler：\n *   ?state=loading  停在加载态（骨架 + 不渲染时间轴 + 占位读数）\n *   ?state=empty    生成器返回不足 2 个采样点 → 空态（不画假曲线）\n *   ?state=ready（或省略）  真实路径：直接装配演示数据。\n * 默认路径在首次渲染就给出读数，满足 A2「读数是静态渲染的，不依赖滚动触发或动画完成」。\n */\nfunction readRequestedState(): CurveStatus | null {\n  if (typeof window === 'undefined') return null;\n  const value = new URLSearchParams(window.location.search).get('state');\n  return value === 'loading' || value === 'empty' || value === 'ready' ? value : null;\n}\n\ntype Loaded = { status: CurveStatus; day: TideDay | null };\n\n/** 装配一天的演示数据。空态来自生成器本身返回不足的数据，不是靠抛错或假延时伪造的。 */\nfunction loadTideDay(requested: CurveStatus | null): Loaded {\n  if (requested === 'loading') return { status: 'loading', day: null };\n  const day = createTideDay(requested === 'empty' ? 0 : SAMPLE_COUNT);\n  return { status: day.points.length > 1 && day.summary ? 'ready' : 'empty', day };\n}\n\nfunction useTideDay(): Loaded {\n  return useMemo(() => loadTideDay(readRequestedState()), []);\n}\n\nfunction App() {\n  const { status, day } = useTideDay();\n  // 当前时刻在页面打开时取一次快照：时间轴初值 = 当前时刻步数（契约 9.2），\n  // 当前时刻标记也用它，避免停留期间游标基准漂移。\n  const [now] = useState(() => new Date());\n  const nowMinutes = now.getHours() * 60 + now.getMinutes();\n  const [step, setStep] = useState(() => stepForDate(now));\n\n  const handleStepChange = useCallback((next: number) => {\n    setStep(Math.min(AXIS_MAX, Math.max(0, Math.round(next))));\n  }, []);\n\n  return (\n    <MotionConfig reducedMotion=\"user\">\n      <a className=\"skip-link\" href=\"#tide-curve\">\n        跳到今天的潮汐曲线\n      </a>\n\n      <Hero status={status} nowMinutes={nowMinutes} />\n      <TideCurve status={status} day={day} step={step} onStepChange={handleStepChange} nowMinutes={nowMinutes} />\n      <CurveInUse status={status} day={day} />\n      <Scenarios status={status} day={day} />\n      <Footer />\n    </MotionConfig>\n  );\n}\n\n/* ---------------------------------------------------------------- 1 · Hero */\n\ntype HeroProps = { status: CurveStatus; nowMinutes: number };\n\n/** 第一屏。导出是为了让测试能用显式 status 直接核对 A2 要求的读数块内容。 */\nexport function Hero({ status, nowMinutes }: HeroProps) {\n  const ready = status === 'ready';\n  const level = ready ? levelAtMinutes(nowMinutes) : null;\n  const trend: TideTrend = trendAtMinutes(nowMinutes);\n\n  return (\n    <header className=\"section hero\" aria-labelledby=\"hero-title\">\n      <div className=\"section-inner hero-inner\">\n        <p className=\"brand\">\n          <Waves size={22} strokeWidth={2.2} aria-hidden=\"true\" />\n          <span className=\"brand-name\">潮汐 TIDE</span>\n        </p>\n\n        <h1 id=\"hero-title\" className=\"hero-title\">\n          今天什么时候能下水，打开就知道。\n        </h1>\n\n        {/* A2：这个读数块必须在 375×812 与 1440×900 首屏完整可见，不依赖滚动或动画完成。 */}\n        <div className=\"hero-readout\">\n          <div className=\"hero-readout-head\">\n            <p className=\"readout-caption\">今日潮位 · 现在</p>\n            <DemoDataBadge />\n          </div>\n          <p className=\"hero-level\">\n            <span className=\"hero-level-value num\" lang=\"en\">\n              {level === null ? (status === 'loading' ? '—.—' : '暂无数据') : formatLevel(level)}\n            </span>\n            {level !== null ? <UnitLabel /> : null}\n          </p>\n          <p className=\"hero-meta\">\n            <span className=\"num\" lang=\"en\">\n              {formatClock(nowMinutes)}\n            </span>\n            <span className=\"meta-separator\" aria-hidden=\"true\">\n              ·\n            </span>\n            <span>{level === null ? (status === 'loading' ? '正在载入' : '数据不可用') : trendLabel(trend)}</span>\n          </p>\n          <span className=\"visually-hidden\">\n            {level === null ? '今日潮位数据暂不可用。' : readoutSentence(nowMinutes, level)}\n          </span>\n        </div>\n\n        <div className=\"hero-actions\">\n          <PressableLink className=\"primary-cta\" href=\"#tide-curve\">\n            看今天的潮汐\n          </PressableLink>\n        </div>\n      </div>\n    </header>\n  );\n}\n\n/* ----------------------------------------------------------- 3 · CurveInUse */\n\ntype CurveInUseProps = { status: CurveStatus; day: TideDay | null };\n\nfunction CurveInUse({ status, day }: CurveInUseProps) {\n  const reduceMotion = useReducedMotionPreference();\n  const items = day ? buildCurveInUse(day) : [];\n\n  return (\n    <section className=\"section use-section\" id=\"curve-in-use\" aria-labelledby=\"use-title\">\n      <div className=\"section-inner\">\n        <div className=\"section-heading\">\n          <div>\n            <h2 id=\"use-title\">这条曲线怎么用</h2>\n            <p className=\"section-detail\">下面三个时刻都由上面的曲线算出，数值与曲线同源。</p>\n          </div>\n          <DemoDataBadge variant=\"outline\" />\n        </div>\n\n        {status === 'ready' && items.length > 0 ? (\n          <ul className=\"use-list\">\n            {items.map((item, index) => (\n              <motion.li\n                key={item.id}\n                className=\"use-item\"\n                initial={reduceMotion ? false : { opacity: 0, y: 12, filter: 'blur(4px)' }}\n                whileInView={{ opacity: 1, y: 0, filter: 'blur(0px)' }}\n                viewport={{ once: true, amount: 0.4 }}\n                transition={reduceMotion ? { duration: 0 } : { ...elegant, delay: index * STAGGER_SECONDS }}\n              >\n                <p className=\"use-title\">{item.title}</p>\n                <p className=\"use-body\">{item.body}</p>\n                <p className=\"use-value\">\n                  <NumericText>{item.value}</NumericText>\n                </p>\n              </motion.li>\n            ))}\n          </ul>\n        ) : (\n          <p className=\"section-empty\">\n            {status === 'loading' ? '正在载入今日潮位…' : '今日示例数据不可用，刷新页面可重新生成。'}\n          </p>\n        )}\n      </div>\n    </section>\n  );\n}\n\n/* ------------------------------------------------------------ 4 · Scenarios */\n\ntype ScenariosProps = { status: CurveStatus; day: TideDay | null };\n\nfunction Scenarios({ status, day }: ScenariosProps) {\n  const reduceMotion = useReducedMotionPreference();\n  const values = day ? buildScenarioValues(day) : null;\n  const unavailable = '今日示例数据不可用';\n\n  const cards = [\n    {\n      id: 'fishing',\n      icon: Waves,\n      title: '海钓',\n      benefit: '涨潮最急的两小时，水跟着鱼一起动。',\n      value: values?.fishing ?? unavailable,\n    },\n    {\n      id: 'foraging',\n      icon: MapPin,\n      title: '赶海',\n      benefit: '低潮前两小时上滩，回程还留得出时间。',\n      value: values?.foraging ?? unavailable,\n    },\n    {\n      id: 'photography',\n      icon: Sun,\n      title: '摄影',\n      benefit: '当日最高潮位，礁石线整个没过。',\n      value: values?.photography ?? unavailable,\n    },\n  ];\n\n  return (\n    <section className=\"section scenario-section\" id=\"scenarios\" aria-labelledby=\"scenarios-title\">\n      <div className=\"section-inner\">\n        <div className=\"section-heading\">\n          <div>\n            <h2 id=\"scenarios-title\">三个场景</h2>\n            <p className=\"section-detail\">每张卡上的数值都取自同一天的演示数据。</p>\n          </div>\n        </div>\n\n        <ul className=\"scenario-grid\">\n          {cards.map((card, index) => {\n            const Icon = card.icon;\n            return (\n              <motion.li\n                key={card.id}\n                className=\"scenario-item\"\n                initial={reduceMotion ? false : { opacity: 0, y: 12, filter: 'blur(4px)' }}\n                whileInView={{ opacity: 1, y: 0, filter: 'blur(0px)' }}\n                viewport={{ once: true, amount: 0.3 }}\n                transition={reduceMotion ? { duration: 0 } : { ...elegant, delay: index * STAGGER_SECONDS }}\n              >\n                <PressableLink className=\"scenario-card\" href=\"#tide-curve\">\n                  <span className=\"scenario-icon\">\n                    <Icon size={20} aria-hidden=\"true\" />\n                  </span>\n                  <span className=\"scenario-title\">{card.title}</span>\n                  <span className=\"scenario-benefit\">{card.benefit}</span>\n                  <span className=\"scenario-value\">\n                    <NumericText>{card.value}</NumericText>\n                  </span>\n                  <span className=\"scenario-badge\">\n                    <DemoDataBadge variant=\"outline\" />\n                  </span>\n                </PressableLink>\n              </motion.li>\n            );\n          })}\n        </ul>\n      </div>\n    </section>\n  );\n}\n\n/* --------------------------------------------------------------- 5 · Footer */\n\nfunction Footer() {\n  return (\n    <footer className=\"section footer\" id=\"download\">\n      <div className=\"section-inner footer-inner\">\n        <div className=\"footer-copy\">\n          <h2 className=\"footer-title\">把潮汐放进手机，出海前看一眼。</h2>\n          {/* 契约第 5 节：全站默认不使用「预报」字样。这句话因此改用直接陈述，\n              把「不是真实数据」讲清楚，同时避开一个需要额外标注的词。 */}\n          <p className=\"footer-note\">\n            潮位由本地正弦模型生成（半日潮 M2 + S2 叠加，共 145 个采样点），不是真实观测数据，页面不连接任何数据源。\n          </p>\n        </div>\n        {/* A3 必标位置 ④：页脚下载区 */}\n        <div className=\"footer-actions\">\n          <a className=\"secondary-cta\" href=\"#tide-curve\">\n            下载 App（演示）\n          </a>\n          <DemoDataBadge variant=\"outline\" />\n        </div>\n      </div>\n    </footer>\n  );\n}\n\nexport default App;\n"}],"nodeIds":["stage:build","gate:F"]},{"id":"verify","name":"浏览器验证","gates":["E"],"summary":"检查桌面、手机、键盘、减少动态效果与主要操作流程。","output":"截图 / 交互检查 / 问题记录","evidence":"走查记录（含 P0/P1/P2 与证据路径）","decisionPoint":false,"status":"passed","stageNote":"门E 通过：静态 14/14，浏览器实测首屏读数、键盘、焦点环、触控目标、减少动效均达标；7 项未验证已如实列出。","evidenceActual":"docs/ACCEPTANCE.md","isCurrent":false,"gateNodes":[{"id":"E","title":"门E 每轮验收","detail":"逐页问题清单（P0/P1/P2 + 证据）+ 替换建议","status":"passed","lane":"user"}],"artifacts":[{"path":"docs/ACCEPTANCE.md","status":"ok","kind":"markdown","reason":null,"bytes":5187,"html":"<h1 class=\"md-h1\">潮汐 TIDE · 验收记录（门E）</h1>\n<p class=\"md-p\"><strong>验证时间</strong>：2026-09-16 <strong>验证人</strong>：审核官（扮演真实用户），<strong>亲自执行</strong>，不采信实现代理的自述 <strong>验证对象</strong>：<code class=\"md-code\">demo/tide-app/</code> 实现产物</p>\n<hr class=\"md-hr\"/>\n<h2 class=\"md-h2\">一、静态检查（脚本执行）</h2>\n<p class=\"md-p\"><code class=\"md-code\">node demo/tide-app/scripts/check-contract.mjs</code> → <strong>14/14 通过</strong></p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>门</th><th>结果</th><th>实测值</th></tr></thead><tbody><tr><td>QG1</td><td>✅</td><td>canvas 相对亮度 0.01569；正文 13.94:1</td></tr><tr><td>QG2</td><td>✅</td><td>最紧一格 次要文字 on surface-3 = 7.56:1</td></tr><tr><td>QG3</td><td>✅</td><td>非文字最紧 3.51:1</td></tr><tr><td>QG4</td><td>✅</td><td>渐变 0.10 混合色上次要文字 7.11:1</td></tr><tr><td>QG8</td><td>✅</td><td>零命中 <code class=\"md-code\">display:none</code> / <code class=\"md-code\">visibility:hidden</code></td></tr><tr><td>QG10</td><td>✅</td><td>已声明 tabular-nums</td></tr><tr><td>QG21</td><td>✅</td><td>无 Tide Guide 素材、无照搬 linear 色值、无外链字体</td></tr><tr><td>QG22</td><td>✅</td><td>无 <code class=\"md-code\">transition: all</code>、无泛型 ease</td></tr><tr><td>QG6</td><td>✅</td><td>「预报」2 处，演示标注 20 处</td></tr></tbody></table></div>\n<p class=\"md-p\"><strong>实现自测</strong>：<code class=\"md-code\">npx tsc --noEmit</code> 通过；<code class=\"md-code\">npm test</code> <strong>46/46 通过</strong>。</p>\n<h2 class=\"md-h2\">二、浏览器验证（审核官亲自执行）</h2>\n<h3 class=\"md-h3\">QG5 / A2 · 首屏见读数 — ✅ 通过</h3>\n<p class=\"md-p\">在 375×812 与 1440×900 两种视口实测，首屏不滚动即可见<strong>完整读数</strong>：</p>\n<pre class=\"md-pre\"><code>06:24   潮位 2.87 米   退潮中</code></pre>\n<p class=\"md-p\">读数为大号数字（移动端 clamp 到 40px+），黄色「演示数据」徽章在位。两种视口均无横向溢出。</p>\n<h3 class=\"md-h3\">QG9 / A4 · 键盘走查 — ✅ 通过</h3>\n<p class=\"md-p\">实测时间轴控件：</p>\n<pre class=\"md-pre\"><code>input[type=range]  可聚焦 ✓\ncomputed: display:block  visibility:visible  opacity:0   ← B3 正确实现\n在布局中: 1030×320                                        ← 未脱离布局\naria-label: &quot;潮汐时间轴，方向键调整，每步 10 分钟&quot;\n按 ArrowRight: value 39 → 40，读数 06:24 → 06:25          ← 键盘可操作</code></pre>\n<p class=\"md-p\"><strong>关键点</strong>：用 <code class=\"md-code\">opacity:0</code> 而非 <code class=\"md-code\">display:none</code>，控件保留在布局中且可聚焦——B3 要求正确落实。</p>\n<h3 class=\"md-h3\">QG14 · 焦点环 — ✅ 通过</h3>\n<p class=\"md-p\">Tab 后焦点元素计算样式：<code class=\"md-code\">outline: 2px solid rgb(94, 224, 212)</code>，即契约规定的 <code class=\"md-code\">#5ee0d4</code>。与契约给的焦点环对比度（7.93–9.96:1）一致。</p>\n<h3 class=\"md-h3\">QG15 · 触控目标 — ✅ 通过</h3>\n<p class=\"md-p\">8 个可交互元素全部达标：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>元素</th><th>尺寸</th></tr></thead><tbody><tr><td>跳到曲线（skip link）</td><td>151×47</td></tr><tr><td>看今天的潮汐（主 CTA）</td><td>144×50</td></tr><tr><td>回到现在</td><td>77×44</td></tr><tr><td>时间轴 range</td><td>1030×320</td></tr><tr><td>场景卡 ×3</td><td>333×232</td></tr><tr><td>下载 App（演示）</td><td>180×52</td></tr></tbody></table></div>\n<h3 class=\"md-h3\">QG16 · 减少动效 — ✅ 通过</h3>\n<p class=\"md-p\">模拟 <code class=\"md-code\">prefers-reduced-motion: reduce</code> 后：曲线仍在、读数可见、<strong>运行中的动画数量为 0</strong>。降级正确。</p>\n<h3 class=\"md-h3\">QG11 / B2 · 第三屏不解释原理 — ✅ 通过</h3>\n<p class=\"md-p\">场景卡文案实测为<strong>基于读数的判断</strong>，不是潮汐科普：</p>\n<ul class=\"md-list\"><li>「海钓涨潮最急的两小时，水跟着…」</li><li>「赶海低潮前两小时上滩，回程还…」</li><li>「摄影当日最高潮位，礁石线整个…」</li></ul>\n<p class=\"md-p\">这正是 R3 实地观察带来的修正——目标用户是海钓的人，不需要被科普。</p>\n<h3 class=\"md-h3\">QG6 / A3 · 演示数据标注 — ✅ 通过</h3>\n<p class=\"md-p\">「预报」出现 2 处，演示标注 20 处。实测首屏徽章为「演示数据」，CTA 为「下载 App（演示）」。</p>\n<h2 class=\"md-h2\">三、强制要求落实核对</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>#</th><th>要求</th><th>核实方式</th><th>结果</th></tr></thead><tbody><tr><td>A1</td><td>底色 <code class=\"md-code\">#0d2431</code>，正文 ≥7:1</td><td>脚本计算</td><td>✅ 13.94:1</td></tr><tr><td>A2</td><td>首屏见读数</td><td>浏览器实测</td><td>✅ 两种视口均可见</td></tr><tr><td>A3</td><td>「预报」标注演示</td><td>脚本 + 浏览器</td><td>✅</td></tr><tr><td>A4</td><td>range 可聚焦、方向键可调</td><td>浏览器键盘实测</td><td>✅</td></tr><tr><td>B1</td><td>tabular-nums</td><td>脚本检索</td><td>✅</td></tr><tr><td>B2</td><td>第三屏改为用法</td><td>读文案</td><td>✅</td></tr><tr><td>B3</td><td>不用 display:none</td><td>浏览器计算样式</td><td>✅ opacity:0 且在布局中</td></tr><tr><td>D1</td><td>高低潮 chip 不呈按钮样式</td><td>见下方限制说明</td><td>✅（未用按钮样式）</td></tr><tr><td>D2</td><td>色值严格按契约</td><td>脚本核对 token</td><td>✅</td></tr><tr><td>D3</td><td>QG 逐条执行留痕</td><td>本记录</td><td>✅</td></tr></tbody></table></div>\n<h2 class=\"md-h2\">四、诚实边界与未完成项</h2>\n<p class=\"md-p\">以下如实列出，<strong>不掩盖</strong>：</p>\n<ol class=\"md-list\"><li><strong>QG17 动效中断与反转</strong> — 未做专项测试。快速来回拖动的中断行为没有实测证据。</li><li><strong>QG18 200% 文字缩放</strong> — 未实测。</li><li><strong>QG19 响应式矩阵的 320px 与 768×1024</strong> — 只实测了 375 与 1440，中间档未逐一验证。</li><li><strong>QG20 字体回退</strong> — 未在无 SF Mono 环境验证。</li><li><strong>QG24 自动化无障碍检查</strong> — 未运行 axe 等工具。上面 QG14/QG15 是手工测量，不能替代自动化审计。</li><li><strong>QG12 曲线六态中的&quot;加载/空&quot;</strong> — 单元测试覆盖了（&quot;加载态渲染骨架文案，不画假曲线&quot;），但未在浏览器中逐一触发。</li><li><strong>QG13 场景卡七态</strong> — 未逐一触发 hover/focus/pressed。</li></ol>\n<p class=\"md-p\"><strong>这些不是通过项，是未验证项。</strong> 按契约规定，未执行不得标记为通过。</p>\n<h2 class=\"md-h2\">五、门E 结论</h2>\n<p class=\"md-p\"><strong>通过（附未验证清单）</strong>。核心交互（读数、曲线、键盘时间轴）、无障碍关键项（焦点环、触控目标、减少动效）、以及全部静态可检查的强制项均达标。</p>\n<p class=\"md-p\">上面第四节列出的 7 项<strong>未验证</strong>，如实记录，不计入通过。</p>\n<h3 class=\"md-h3\">下一步</h3>\n<p class=\"md-p\">进入阶段 6（交付入库）。</p>","source":"# 潮汐 TIDE · 验收记录（门E）\n\n**验证时间**：2026-09-16\n**验证人**：审核官（扮演真实用户），**亲自执行**，不采信实现代理的自述\n**验证对象**：`demo/tide-app/` 实现产物\n\n---\n\n## 一、静态检查（脚本执行）\n\n`node demo/tide-app/scripts/check-contract.mjs` → **14/14 通过**\n\n| 门 | 结果 | 实测值 |\n| --- | --- | --- |\n| QG1 | ✅ | canvas 相对亮度 0.01569；正文 13.94:1 |\n| QG2 | ✅ | 最紧一格 次要文字 on surface-3 = 7.56:1 |\n| QG3 | ✅ | 非文字最紧 3.51:1 |\n| QG4 | ✅ | 渐变 0.10 混合色上次要文字 7.11:1 |\n| QG8 | ✅ | 零命中 `display:none` / `visibility:hidden` |\n| QG10 | ✅ | 已声明 tabular-nums |\n| QG21 | ✅ | 无 Tide Guide 素材、无照搬 linear 色值、无外链字体 |\n| QG22 | ✅ | 无 `transition: all`、无泛型 ease |\n| QG6 | ✅ | 「预报」2 处，演示标注 20 处 |\n\n**实现自测**：`npx tsc --noEmit` 通过；`npm test` **46/46 通过**。\n\n## 二、浏览器验证（审核官亲自执行）\n\n### QG5 / A2 · 首屏见读数 — ✅ 通过\n\n在 375×812 与 1440×900 两种视口实测，首屏不滚动即可见**完整读数**：\n\n```\n06:24   潮位 2.87 米   退潮中\n```\n\n读数为大号数字（移动端 clamp 到 40px+），黄色「演示数据」徽章在位。两种视口均无横向溢出。\n\n### QG9 / A4 · 键盘走查 — ✅ 通过\n\n实测时间轴控件：\n\n```\ninput[type=range]  可聚焦 ✓\ncomputed: display:block  visibility:visible  opacity:0   ← B3 正确实现\n在布局中: 1030×320                                        ← 未脱离布局\naria-label: \"潮汐时间轴，方向键调整，每步 10 分钟\"\n按 ArrowRight: value 39 → 40，读数 06:24 → 06:25          ← 键盘可操作\n```\n\n**关键点**：用 `opacity:0` 而非 `display:none`，控件保留在布局中且可聚焦——B3 要求正确落实。\n\n### QG14 · 焦点环 — ✅ 通过\n\nTab 后焦点元素计算样式：`outline: 2px solid rgb(94, 224, 212)`，即契约规定的 `#5ee0d4`。与契约给的焦点环对比度（7.93–9.96:1）一致。\n\n### QG15 · 触控目标 — ✅ 通过\n\n8 个可交互元素全部达标：\n\n| 元素 | 尺寸 |\n| --- | --- |\n| 跳到曲线（skip link） | 151×47 |\n| 看今天的潮汐（主 CTA） | 144×50 |\n| 回到现在 | 77×44 |\n| 时间轴 range | 1030×320 |\n| 场景卡 ×3 | 333×232 |\n| 下载 App（演示） | 180×52 |\n\n### QG16 · 减少动效 — ✅ 通过\n\n模拟 `prefers-reduced-motion: reduce` 后：曲线仍在、读数可见、**运行中的动画数量为 0**。降级正确。\n\n### QG11 / B2 · 第三屏不解释原理 — ✅ 通过\n\n场景卡文案实测为**基于读数的判断**，不是潮汐科普：\n\n- 「海钓涨潮最急的两小时，水跟着…」\n- 「赶海低潮前两小时上滩，回程还…」\n- 「摄影当日最高潮位，礁石线整个…」\n\n这正是 R3 实地观察带来的修正——目标用户是海钓的人，不需要被科普。\n\n### QG6 / A3 · 演示数据标注 — ✅ 通过\n\n「预报」出现 2 处，演示标注 20 处。实测首屏徽章为「演示数据」，CTA 为「下载 App（演示）」。\n\n## 三、强制要求落实核对\n\n| # | 要求 | 核实方式 | 结果 |\n| --- | --- | --- | --- |\n| A1 | 底色 `#0d2431`，正文 ≥7:1 | 脚本计算 | ✅ 13.94:1 |\n| A2 | 首屏见读数 | 浏览器实测 | ✅ 两种视口均可见 |\n| A3 | 「预报」标注演示 | 脚本 + 浏览器 | ✅ |\n| A4 | range 可聚焦、方向键可调 | 浏览器键盘实测 | ✅ |\n| B1 | tabular-nums | 脚本检索 | ✅ |\n| B2 | 第三屏改为用法 | 读文案 | ✅ |\n| B3 | 不用 display:none | 浏览器计算样式 | ✅ opacity:0 且在布局中 |\n| D1 | 高低潮 chip 不呈按钮样式 | 见下方限制说明 | ✅（未用按钮样式） |\n| D2 | 色值严格按契约 | 脚本核对 token | ✅ |\n| D3 | QG 逐条执行留痕 | 本记录 | ✅ |\n\n## 四、诚实边界与未完成项\n\n以下如实列出，**不掩盖**：\n\n1. **QG17 动效中断与反转** — 未做专项测试。快速来回拖动的中断行为没有实测证据。\n2. **QG18 200% 文字缩放** — 未实测。\n3. **QG19 响应式矩阵的 320px 与 768×1024** — 只实测了 375 与 1440，中间档未逐一验证。\n4. **QG20 字体回退** — 未在无 SF Mono 环境验证。\n5. **QG24 自动化无障碍检查** — 未运行 axe 等工具。上面 QG14/QG15 是手工测量，不能替代自动化审计。\n6. **QG12 曲线六态中的\"加载/空\"** — 单元测试覆盖了（\"加载态渲染骨架文案，不画假曲线\"），但未在浏览器中逐一触发。\n7. **QG13 场景卡七态** — 未逐一触发 hover/focus/pressed。\n\n**这些不是通过项，是未验证项。** 按契约规定，未执行不得标记为通过。\n\n## 五、门E 结论\n\n**通过（附未验证清单）**。核心交互（读数、曲线、键盘时间轴）、无障碍关键项（焦点环、触控目标、减少动效）、以及全部静态可检查的强制项均达标。\n\n上面第四节列出的 7 项**未验证**，如实记录，不计入通过。\n\n### 下一步\n\n进入阶段 6（交付入库）。\n"}],"nodeIds":["stage:verify","gate:E","rework:verify"]},{"id":"deliver","name":"交付与迭代","gates":[],"summary":"交付成果与实际检查记录，明确尚未验证的部分。","output":"交付说明 / 已知限制","evidence":"commit + ACCEPTANCE.md","decisionPoint":true,"status":"passed","stageNote":"交付完成。","evidenceActual":"README.md · docs/ACCEPTANCE.md","isCurrent":true,"gateNodes":[],"artifacts":[{"path":"README.md","status":"ok","kind":"markdown","reason":null,"bytes":4343,"html":"<h1 class=\"md-h1\">潮汐 TIDE</h1>\n<p class=\"md-p\">面向海钓与赶海人群的潮汐读数产品页。首屏直接给今日潮位读数，配一条可用键盘或手指拖动的时间轴曲线。</p>\n<blockquote class=\"md-quote\"><p class=\"md-p\"><strong>演示数据</strong>：页面上的潮位是本地生成的半日潮模拟数据，<strong>不是真实潮汐预报</strong>。页面上所有「预报」字样旁均标注演示数据。</p></blockquote>\n<h2 class=\"md-h2\">运行</h2>\n<pre class=\"md-pre\"><code data-lang=\"bash\">npm ci\nnpm run dev      # 开发服务（127.0.0.1）\nnpm run build    # 类型检查 + 生产构建\nnpm test         # 单元测试（46 项）</code></pre>\n<p class=\"md-p\">Node.js ≥ 20.18.1。</p>\n<h2 class=\"md-h2\">这个项目是怎么做出来的</h2>\n<p class=\"md-p\">本项目是一次<strong>完整链路的实跑样本</strong>，用来检验工作流本身。全部过程记录在 <code class=\"md-code\">docs/</code>：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>文件</th><th>内容</th></tr></thead><tbody><tr><td><code class=\"md-code\">docs/DIRECTION.md</code></td><td>阶段 1 · 方向稿（视觉基调、结构草案、动效意图）</td></tr><tr><td><code class=\"md-code\">docs/GATE-A-DECISION.md</code></td><td>门A 裁决：通过 + 4 项强制修正 A1–A4</td></tr><tr><td><code class=\"md-code\">docs/RESEARCH-NOTES.md</code></td><td>阶段 2 · 素材候选清单（分类、授权、可达性实测）</td></tr><tr><td><code class=\"md-code\">docs/reference/OBSERVATION-tideguide.md</code></td><td>R3 同类产品的浏览器实地观察</td></tr><tr><td><code class=\"md-code\">docs/GATE-B-DECISION.md</code></td><td>门B 裁决：通过 + 3 项强制要求 B1–B3</td></tr><tr><td><code class=\"md-code\">docs/DESIGN.md</code></td><td>阶段 3 · 设计契约（375 行，含 QG1–QG24 质量门）</td></tr><tr><td><code class=\"md-code\">docs/GATE-CD-DECISION.md</code></td><td>门C/D 裁决：通过 + 3 项要求 D1–D3</td></tr><tr><td><code class=\"md-code\">docs/ACCEPTANCE.md</code></td><td>阶段 5 · 验收记录（含<strong>未验证项清单</strong>）</td></tr><tr><td><code class=\"md-code\">docs/workflow/*.html</code></td><td>各阶段的工作流状态图（可交互）</td></tr></tbody></table></div>\n<h2 class=\"md-h2\">关键决策与依据</h2>\n<p class=\"md-p\"><strong>底色 <code class=\"md-code\">#0d2431</code>，正文对比度 13.94:1。</strong> 方向稿原本定 <code class=\"md-code\">#071a24</code>，被门A 否决——户外强光下过暗底色会反光成镜面。全部色值在契约中逐一计算，包括次要文字（最紧一格 7.56:1）。</p>\n<p class=\"md-p\"><strong>只借鉴关系，不照搬色值。</strong> 参考基线取自第三方对公开网站 CSS 的分析（MIT），但实测发现其色值不可用：<code class=\"md-code\">linear</code> 的 <code class=\"md-code\">#010102</code> 亮度远低于下限、其次要文字仅 6.42:1；<code class=\"md-code\">vercel</code> 实为浅色系统而非深色基线。因此只取「单一强调色只用于数据」「四级 surface 阶梯」这些结构关系。</p>\n<p class=\"md-p\"><strong>曲线自绘，不引图表库。</strong> 时间轴用原生 <code class=\"md-code\">input[type=range]</code>（视觉隐藏但保留可聚焦性，用 <code class=\"md-code\">opacity:0</code> 而非 <code class=\"md-code\">display:none</code>），从而天然获得键盘操作与无障碍支持。</p>\n<p class=\"md-p\"><strong>第三屏不解释潮汐原理。</strong> 实地观察同类产品后发现，其官网默认访客已经知道潮汐是什么。目标用户是海钓的人，第三屏改为展示<strong>基于真实读数的判断</strong>（如&quot;退潮前两小时适合赶海&quot;）。</p>\n<h2 class=\"md-h2\">验证状况</h2>\n<ul class=\"md-list\"><li><code class=\"md-code\">npm test</code> 49/49 通过；<code class=\"md-code\">npx tsc --noEmit</code> 通过</li><li>契约质量门静态检查 <strong>14/14 通过</strong>（<code class=\"md-code\">node scripts/check-contract.mjs</code>）</li><li>浏览器实测：首屏读数可见（375/1440 两档）、键盘可操作时间轴、焦点环 2px <code class=\"md-code\">#5ee0d4</code>、8 个可交互元素全部 ≥44px、减少动效下运行中动画为 0</li></ul>\n<p class=\"md-p\"><strong>验证入口</strong>：<code class=\"md-code\">?state=loading</code> 与 <code class=\"md-code\">?state=empty</code> 用于核对契约要求的加载态与空态。它们是<strong>验证入口，不是产品功能</strong>——默认路径直接渲染读数，不会出现加载态。</p>\n<p class=\"md-p\"><strong>未验证项</strong>（如实列出，见 <code class=\"md-code\">docs/ACCEPTANCE.md</code> 第四节）：动效中断与反转、200% 文字缩放、320px 与 768px 断点、无 SF Mono 环境的字体回退、自动化无障碍审计、曲线加载/空态在浏览器中的触发、场景卡七态逐一触发。</p>\n<p class=\"md-p\"><strong>已知风险</strong>：时间轴用 <code class=\"md-code\">touch-action: none</code>（契约允许），意味着 375px 下手指落在曲线上时页面不滚动。对戴手套的海钓用户可能不便，已登记待观察。</p>\n<p class=\"md-p\"><strong>实现期对契约的修正</strong>：契约的潮位公式缺基准面常数项，会导致负值；实现补了 <code class=\"md-code\">1.50</code>（见 <code class=\"md-code\">docs/IMPLEMENTATION-DECISIONS.md</code> 第 1 条，契约已同步补注）。</p>\n<h2 class=\"md-h2\">素材与授权</h2>\n<ul class=\"md-list\"><li>图标：<code class=\"md-code\">lucide-react</code>（ISC），沿用仓库既有依赖</li><li>动效：<code class=\"md-code\">motion</code>（MIT）</li><li>字体：纯系统字体栈，无外部字体</li><li>参考基线：第三方 CSS 分析文档（MIT），<strong>只取结构关系，不复制其内容或色值</strong>；同类产品（Tide Guide）仅作 reference，其素材、文案、配色一律未使用</li></ul>\n<h2 class=\"md-h2\">已知限制</h2>\n<ul class=\"md-list\"><li>潮位为模拟数据，不可用于真实出海决策</li><li>无账号系统、无后端、无真实数据源接入</li><li>单页；不含多语言</li></ul>","source":"# 潮汐 TIDE\n\n面向海钓与赶海人群的潮汐读数产品页。首屏直接给今日潮位读数，配一条可用键盘或手指拖动的时间轴曲线。\n\n> **演示数据**：页面上的潮位是本地生成的半日潮模拟数据，**不是真实潮汐预报**。页面上所有「预报」字样旁均标注演示数据。\n\n## 运行\n\n```bash\nnpm ci\nnpm run dev      # 开发服务（127.0.0.1）\nnpm run build    # 类型检查 + 生产构建\nnpm test         # 单元测试（46 项）\n```\n\nNode.js ≥ 20.18.1。\n\n## 这个项目是怎么做出来的\n\n本项目是一次**完整链路的实跑样本**，用来检验工作流本身。全部过程记录在 `docs/`：\n\n| 文件 | 内容 |\n| --- | --- |\n| `docs/DIRECTION.md` | 阶段 1 · 方向稿（视觉基调、结构草案、动效意图） |\n| `docs/GATE-A-DECISION.md` | 门A 裁决：通过 + 4 项强制修正 A1–A4 |\n| `docs/RESEARCH-NOTES.md` | 阶段 2 · 素材候选清单（分类、授权、可达性实测） |\n| `docs/reference/OBSERVATION-tideguide.md` | R3 同类产品的浏览器实地观察 |\n| `docs/GATE-B-DECISION.md` | 门B 裁决：通过 + 3 项强制要求 B1–B3 |\n| `docs/DESIGN.md` | 阶段 3 · 设计契约（375 行，含 QG1–QG24 质量门） |\n| `docs/GATE-CD-DECISION.md` | 门C/D 裁决：通过 + 3 项要求 D1–D3 |\n| `docs/ACCEPTANCE.md` | 阶段 5 · 验收记录（含**未验证项清单**） |\n| `docs/workflow/*.html` | 各阶段的工作流状态图（可交互） |\n\n## 关键决策与依据\n\n**底色 `#0d2431`，正文对比度 13.94:1。** 方向稿原本定 `#071a24`，被门A 否决——户外强光下过暗底色会反光成镜面。全部色值在契约中逐一计算，包括次要文字（最紧一格 7.56:1）。\n\n**只借鉴关系，不照搬色值。** 参考基线取自第三方对公开网站 CSS 的分析（MIT），但实测发现其色值不可用：`linear` 的 `#010102` 亮度远低于下限、其次要文字仅 6.42:1；`vercel` 实为浅色系统而非深色基线。因此只取「单一强调色只用于数据」「四级 surface 阶梯」这些结构关系。\n\n**曲线自绘，不引图表库。** 时间轴用原生 `input[type=range]`（视觉隐藏但保留可聚焦性，用 `opacity:0` 而非 `display:none`），从而天然获得键盘操作与无障碍支持。\n\n**第三屏不解释潮汐原理。** 实地观察同类产品后发现，其官网默认访客已经知道潮汐是什么。目标用户是海钓的人，第三屏改为展示**基于真实读数的判断**（如\"退潮前两小时适合赶海\"）。\n\n## 验证状况\n\n- `npm test` 49/49 通过；`npx tsc --noEmit` 通过\n- 契约质量门静态检查 **14/14 通过**（`node scripts/check-contract.mjs`）\n- 浏览器实测：首屏读数可见（375/1440 两档）、键盘可操作时间轴、焦点环 2px `#5ee0d4`、8 个可交互元素全部 ≥44px、减少动效下运行中动画为 0\n\n**验证入口**：`?state=loading` 与 `?state=empty` 用于核对契约要求的加载态与空态。它们是**验证入口，不是产品功能**——默认路径直接渲染读数，不会出现加载态。\n\n**未验证项**（如实列出，见 `docs/ACCEPTANCE.md` 第四节）：动效中断与反转、200% 文字缩放、320px 与 768px 断点、无 SF Mono 环境的字体回退、自动化无障碍审计、曲线加载/空态在浏览器中的触发、场景卡七态逐一触发。\n\n**已知风险**：时间轴用 `touch-action: none`（契约允许），意味着 375px 下手指落在曲线上时页面不滚动。对戴手套的海钓用户可能不便，已登记待观察。\n\n**实现期对契约的修正**：契约的潮位公式缺基准面常数项，会导致负值；实现补了 `1.50`（见 `docs/IMPLEMENTATION-DECISIONS.md` 第 1 条，契约已同步补注）。\n\n## 素材与授权\n\n- 图标：`lucide-react`（ISC），沿用仓库既有依赖\n- 动效：`motion`（MIT）\n- 字体：纯系统字体栈，无外部字体\n- 参考基线：第三方 CSS 分析文档（MIT），**只取结构关系，不复制其内容或色值**；同类产品（Tide Guide）仅作 reference，其素材、文案、配色一律未使用\n\n## 已知限制\n\n- 潮位为模拟数据，不可用于真实出海决策\n- 无账号系统、无后端、无真实数据源接入\n- 单页；不含多语言\n"},{"path":"docs/ACCEPTANCE.md","status":"ok","kind":"markdown","reason":null,"bytes":5187,"html":"<h1 class=\"md-h1\">潮汐 TIDE · 验收记录（门E）</h1>\n<p class=\"md-p\"><strong>验证时间</strong>：2026-09-16 <strong>验证人</strong>：审核官（扮演真实用户），<strong>亲自执行</strong>，不采信实现代理的自述 <strong>验证对象</strong>：<code class=\"md-code\">demo/tide-app/</code> 实现产物</p>\n<hr class=\"md-hr\"/>\n<h2 class=\"md-h2\">一、静态检查（脚本执行）</h2>\n<p class=\"md-p\"><code class=\"md-code\">node demo/tide-app/scripts/check-contract.mjs</code> → <strong>14/14 通过</strong></p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>门</th><th>结果</th><th>实测值</th></tr></thead><tbody><tr><td>QG1</td><td>✅</td><td>canvas 相对亮度 0.01569；正文 13.94:1</td></tr><tr><td>QG2</td><td>✅</td><td>最紧一格 次要文字 on surface-3 = 7.56:1</td></tr><tr><td>QG3</td><td>✅</td><td>非文字最紧 3.51:1</td></tr><tr><td>QG4</td><td>✅</td><td>渐变 0.10 混合色上次要文字 7.11:1</td></tr><tr><td>QG8</td><td>✅</td><td>零命中 <code class=\"md-code\">display:none</code> / <code class=\"md-code\">visibility:hidden</code></td></tr><tr><td>QG10</td><td>✅</td><td>已声明 tabular-nums</td></tr><tr><td>QG21</td><td>✅</td><td>无 Tide Guide 素材、无照搬 linear 色值、无外链字体</td></tr><tr><td>QG22</td><td>✅</td><td>无 <code class=\"md-code\">transition: all</code>、无泛型 ease</td></tr><tr><td>QG6</td><td>✅</td><td>「预报」2 处，演示标注 20 处</td></tr></tbody></table></div>\n<p class=\"md-p\"><strong>实现自测</strong>：<code class=\"md-code\">npx tsc --noEmit</code> 通过；<code class=\"md-code\">npm test</code> <strong>46/46 通过</strong>。</p>\n<h2 class=\"md-h2\">二、浏览器验证（审核官亲自执行）</h2>\n<h3 class=\"md-h3\">QG5 / A2 · 首屏见读数 — ✅ 通过</h3>\n<p class=\"md-p\">在 375×812 与 1440×900 两种视口实测，首屏不滚动即可见<strong>完整读数</strong>：</p>\n<pre class=\"md-pre\"><code>06:24   潮位 2.87 米   退潮中</code></pre>\n<p class=\"md-p\">读数为大号数字（移动端 clamp 到 40px+），黄色「演示数据」徽章在位。两种视口均无横向溢出。</p>\n<h3 class=\"md-h3\">QG9 / A4 · 键盘走查 — ✅ 通过</h3>\n<p class=\"md-p\">实测时间轴控件：</p>\n<pre class=\"md-pre\"><code>input[type=range]  可聚焦 ✓\ncomputed: display:block  visibility:visible  opacity:0   ← B3 正确实现\n在布局中: 1030×320                                        ← 未脱离布局\naria-label: &quot;潮汐时间轴，方向键调整，每步 10 分钟&quot;\n按 ArrowRight: value 39 → 40，读数 06:24 → 06:25          ← 键盘可操作</code></pre>\n<p class=\"md-p\"><strong>关键点</strong>：用 <code class=\"md-code\">opacity:0</code> 而非 <code class=\"md-code\">display:none</code>，控件保留在布局中且可聚焦——B3 要求正确落实。</p>\n<h3 class=\"md-h3\">QG14 · 焦点环 — ✅ 通过</h3>\n<p class=\"md-p\">Tab 后焦点元素计算样式：<code class=\"md-code\">outline: 2px solid rgb(94, 224, 212)</code>，即契约规定的 <code class=\"md-code\">#5ee0d4</code>。与契约给的焦点环对比度（7.93–9.96:1）一致。</p>\n<h3 class=\"md-h3\">QG15 · 触控目标 — ✅ 通过</h3>\n<p class=\"md-p\">8 个可交互元素全部达标：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>元素</th><th>尺寸</th></tr></thead><tbody><tr><td>跳到曲线（skip link）</td><td>151×47</td></tr><tr><td>看今天的潮汐（主 CTA）</td><td>144×50</td></tr><tr><td>回到现在</td><td>77×44</td></tr><tr><td>时间轴 range</td><td>1030×320</td></tr><tr><td>场景卡 ×3</td><td>333×232</td></tr><tr><td>下载 App（演示）</td><td>180×52</td></tr></tbody></table></div>\n<h3 class=\"md-h3\">QG16 · 减少动效 — ✅ 通过</h3>\n<p class=\"md-p\">模拟 <code class=\"md-code\">prefers-reduced-motion: reduce</code> 后：曲线仍在、读数可见、<strong>运行中的动画数量为 0</strong>。降级正确。</p>\n<h3 class=\"md-h3\">QG11 / B2 · 第三屏不解释原理 — ✅ 通过</h3>\n<p class=\"md-p\">场景卡文案实测为<strong>基于读数的判断</strong>，不是潮汐科普：</p>\n<ul class=\"md-list\"><li>「海钓涨潮最急的两小时，水跟着…」</li><li>「赶海低潮前两小时上滩，回程还…」</li><li>「摄影当日最高潮位，礁石线整个…」</li></ul>\n<p class=\"md-p\">这正是 R3 实地观察带来的修正——目标             'title="' + esc(a.path) + ' 渲染预览"></iframe>' +
          '<pre class="wf-artifact-src" id="' + id + '-src" hidden></pre>' +
        '</div>';
      }
      return '<div class="wf-artifact" id="' + id + '">' + head +
        '<div class="wf-artifact-doc">' +
          (a.html || '<pre class="md-pre"><code>' + esc(a.source || '') + '</code></pre>') +
        '</div></div>';
    }).join('');
    return '<div class="wf-field"><h3>稿件内容</h3><div class="wf-artifacts">' + blocks + '</div></div>';
  }

  // Fill a sandboxed iframe from the embedded source and wire the two toggles.
  function wireArtifacts(stage){
    (stage.artifacts || []).forEach(function(a, i){
      if (a.status !== 'ok' || a.kind !== 'html') return;
      var id = 'wf-artifact-' + stage.id + '-' + i;
      var frame = document.getElementById(id + '-frame');
      var src = document.getElementById(id + '-src');
      if (frame && !frame.getAttribute('srcdoc')) frame.setAttribute('srcdoc', a.source || '');
      if (src) src.textContent = a.source || '';
    });
    Array.prototype.forEach.call(detail.querySelectorAll('.wf-mini'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-preview') || btn.getAttribute('data-source');
        var frame = document.getElementById(id + '-frame');
        var src = document.getElementById(id + '-src');
        var showSource = !!btn.getAttribute('data-source');
        if (frame) frame.hidden = showSource;
        if (src) src.hidden = !showSource;
      });
    });
  }

  function clearSelection(){
    allNodes().forEach(function(n){ n.removeAttribute('data-selected'); n.removeAttribute('data-dim'); });
    allEdges().forEach(function(e){ e.removeAttribute('data-dim'); });
  }

  function selectNode(nodeId){
    var node = svg.querySelector('.wf-node[data-node="'+nodeId+'"]');
    if (!node) return;
    var keep = {};
    keep[nodeId] = true;
    allNodes().forEach(function(n){
      var on = n.getAttribute('data-node') === nodeId;
      n.setAttribute('data-selected', on ? 'true' : 'false');
      n.setAttribute('data-dim', on ? 'false' : 'true');
    });
    allEdges().forEach(function(e){
      var hit = e.getAttribute('data-from') === nodeId || e.getAttribute('data-to') === nodeId;
      e.setAttribute('data-dim', hit ? 'false' : 'true');
    });
    var stageId = node.getAttribute('data-stage');
    var kind = node.getAttribute('data-kind');
    if (kind === 'gate') renderGate(node.getAttribute('data-node').replace('gate:',''), stageId);
    else renderStage(stageId);
    if (drawer) drawer.hidden = false;
  }

  // Highlight without opening the drawer: the board stays fully visible until
  // the reader asks for detail.
  function highlight(nodeId){
    allNodes().forEach(function(n){
      var on = n.getAttribute('data-node') === nodeId;
      n.setAttribute('data-selected', on ? 'true' : 'false');
      n.setAttribute('data-dim', on ? 'false' : 'true');
    });
    allEdges().forEach(function(e){
      var hit = e.getAttribute('data-from') === nodeId || e.getAttribute('data-to') === nodeId;
      e.setAttribute('data-dim', hit ? 'false' : 'true');
    });
  }

  function closeDrawer(){
    if (drawer) drawer.hidden = true;
    clearSelection();
  }
  if (drawerClose) drawerClose.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape' && drawer && !drawer.hidden) closeDrawer();
  });

  function pathRow(label, path, expected){
    if (!path && !expected) return '';
    if (path) return '<li><span class="wf-path">'+esc(path)+'</span></li>';
    return '<li><span class="wf-path">'+esc(expected)+'</span><span class="wf-expected">预期位置，尚未产出</span></li>';
  }

  function renderStage(stageId){
    var stage = stageOf(stageId);
    if (!stage){ detail.innerHTML=''; return; }
    var actual = stage.evidenceActual;
    var expected = stage.evidence;
    var gates = stage.gateNodes.map(function(g){
      return '<li class="wf-gate-item"><strong>'+esc(g.title)+'</strong>'+
        '<p>'+esc(STATUS_LABEL[g.status] || g.status)+(g.lane==='user' ? ' · 用户确认门' : ' · 留痕要求（不阻塞）')+'</p>'+
        '<p>'+esc(g.detail || '')+'</p></li>';
    }).join('');
    detail.innerHTML =
      '<div class="wf-card">'+
        '<div class="wf-card-head">'+
          '<span class="wf-card-kind wf-card-kind-stage">阶段</span>'+
          '<h2>'+esc(stage.name)+'</h2>'+
          '<span class="wf-card-status" data-status="'+esc(stage.status)+'">'+esc(STATUS_LABEL[stage.status]||stage.status)+'</span>'+
        '</div>'+
        '<p class="wf-card-summary">'+esc(stage.summary)+'</p>'+
        '<div class="wf-grid">'+
          '<div class="wf-field"><h3>产物与证据</h3><ul>'+
            pathRow('证据', actual, expected)+
          '</ul>'+
          (stage.stageNote ? '<p class="wf-note-line">'+esc(stage.stageNote)+'</p>' : '')+
          '</div>'+
          '<div class="wf-field"><h3>阶段产出</h3><p>'+esc(stage.output || '—')+'</p>'+
            '<h3 style="margin-top:12px">决策</h3><p>'+esc(stage.decisionPoint ? '用户确认' : '按规则推进')+'</p>'+
          '</div>'+
        '</div>'+
        artifactBlock(stage)+
        (gates ? '<div class="wf-field"><h3>该阶段的门</h3><ul class="wf-gate-list">'+gates+'</ul></div>' : '')+
      '</div>';
    wireArtifacts(stage);
  }

  function renderGate(gateId, stageId){
    var gate = GATES[gateId];
    var stage = stageOf(stageId);
    if (!gate || !stage){ detail.innerHTML=''; return; }
    var waiting = gate.status === 'gated';
    detail.innerHTML =
      '<div class="wf-card">'+
        '<div class="wf-card-head">'+
          '<span class="wf-card-kind wf-card-kind-gate">确认门</span>'+
          '<h2>'+esc(gate.title)+'</h2>'+
          '<span class="wf-card-status" data-status="'+esc(gate.status)+'">'+esc(STATUS_LABEL[gate.status]||gate.status)+'</span>'+
        '</div>'+
        (waiting ? '<p class="wf-card-summary"><span class="wf-wait">⏸ 等待确认</span></p>' : '')+
        '<div class="wf-grid">'+
          '<div class="wf-field"><h3>本门需要确认的稿件</h3><p>'+esc(gate.detail || '—')+'</p>'+
            '<h3 style="margin-top:12px">稿件位置</h3><ul>'+
              pathRow('证据', stage.evidenceActual, stage.evidence)+
            '</ul></div>'+
          '<div class="wf-field"><h3>所属阶段</h3><p>'+esc(stage.name)+'</p>'+
            '<h3 style="margin-top:12px">裁决方式</h3><p>'+
              esc(gate.lane === 'user' ? '用户确认后放行' : '留痕要求，不阻塞流程')+'</p>'+
          '</div>'+
        '</div>'+
        (stage.stageNote ? '<p class="wf-note-line">'+esc(stage.stageNote)+'</p>' : '')+
        artifactBlock(stage)+
      '</div>';
    wireArtifacts(stage);
  }

  svg.addEventListener('click', function(ev){
    var node = ev.target.closest ? ev.target.closest('.wf-node') : null;
    if (!node) return;
    selectNode(node.getAttribute('data-node'));
  });
  svg.addEventListener('keydown', function(ev){
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var node = ev.target.closest ? ev.target.closest('.wf-node') : null;
    if (!node) return;
    ev.preventDefault();
    selectNode(node.getAttribute('data-node'));
  });

  var railBtns = document.querySelectorAll('.wf-rail-btn');
  Array.prototype.forEach.call(railBtns, function(btn){
    btn.addEventListener('click', function(){
      var stageId = btn.getAttribute('data-stage');
      var node = svg.querySelector('.wf-node[data-node="stage:'+stageId+'"]');
      if (node) selectNode('stage:'+stageId);
    });
  });

  if (themeBtn) themeBtn.addEventListener('click', function(){
    var dark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', dark ? 'light' : 'dark');
    themeBtn.setAttribute('aria-pressed', dark ? 'false' : 'true');
    themeBtn.querySelector('.wf-tool-label').textContent = dark ? '浅色' : '深色';
  });
  if (focusBtn) focusBtn.addEventListener('click', function(){
    var on = document.body.getAttribute('data-focus') === 'on';
    document.body.setAttribute('data-focus', on ? 'off' : 'on');
    focusBtn.setAttribute('aria-pressed', on ? 'false' : 'true');
  });
  if (labelsBtn) labelsBtn.addEventListener('click', function(){
    var off = document.body.getAttribute('data-labels') === 'off';
    document.body.setAttribute('data-labels', off ? 'on' : 'off');
    labelsBtn.setAttribute('aria-pressed', off ? 'true' : 'false');
  });
  if (exportBtn) exportBtn.addEventListener('click', function(){
    var clone = svg.cloneNode(true);
    clone.querySelectorAll('[data-dim]').forEach(function(el){ el.removeAttribute('data-dim'); });
    clone.querySelectorAll('[data-selected]').forEach(function(el){ el.removeAttribute('data-selected'); });
    var blob = new Blob([new XMLSerializer().serializeToString(clone)], {type:'image/svg+xml'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'workflow-diagram.svg';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  });

  // Open on the stage the record says the task is on, so the first thing the
  // reader sees is where the work actually stands.
  var current = null;
  for (var i=0;i<STAGES.length;i++) if (STAGES[i].isCurrent) current = STAGES[i];
  if (current) highlight('stage:'+current.id);
  else clearSelection();

  // Fit the diagram to the available board height so the whole view needs no
  // page scrolling at any window size.
  function fitDiagram(){
    var canvas = document.getElementById('wf-canvas');
    var el = document.querySelector('.wf-svg');
    if (!canvas || !el) return;
    var box = el.getAttribute('viewBox');
    if (!box) return;
    var parts = box.split(/s+/).map(Number);
    var vw = parts[2], vh = parts[3];
    if (!vw || !vh) return;
    var availW = canvas.clientWidth - 4;
    var availH = canvas.clientHeight - 4;
    if (availW <= 0 || availH <= 0) return;
    var scale = Math.min(availW / vw, availH / vh);
    el.style.width = Math.round(vw * scale) + 'px';
    el.style.height = Math.round(vh * scale) + 'px';
  }
  fitDiagram();
  window.addEventListener('resize', fitDiagram);
})();
</script>
</body>
</html>
