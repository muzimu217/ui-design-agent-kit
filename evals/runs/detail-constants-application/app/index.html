<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运营台 · 分析卡行（detail-constants 打磨版）</title>
<style>
  /* tokens：数字全部走 tabular-nums（detail-constants 规则：更新中的计数器必须表格数字） */
  :root {
    --ink: #26343d; --muted: #61717d; --line: #d9e2e7; --paper: #fafcfd;
    --surface: #f2f5f7; --green: #177656; --focus: #2566c4;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-width: 320px; padding: 32px 20px 56px; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--surface); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 20px; }

  /* 外层卡：radius 20 = 内层 8 + padding 12（同心圆角：外 = 内 + padding） */
  .card-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 880px; }
  @media (max-width: 720px) { .card-row { grid-template-columns: 1fr; } }
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 20px;
    padding: 12px; /* 与半径配合构成同心关系 */
  }
  .card-inner {
    background: #fff; border: 1px solid #e6edf1; border-radius: 8px;
    padding: 14px 16px 16px; min-height: 128px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
  }
  .kicker { font-size: 11px; color: var(--muted); letter-spacing: .02em; }
  .value {
    font-size: 30px; font-weight: 680; line-height: 1.15;
    font-variant-numeric: tabular-nums; /* 计数器更新不抖动：等宽数字 */
    font-feature-settings: "tnum";
  }
  .delta { font-size: 12px; font-weight: 600; }
  .delta.up { color: var(--green); }
  .delta.down { color: #a32017; }

  /* 嵌套面板：同样遵守同心规则（面板 radius 12 → 其内按钮容器 radius 4 + padding 8） */
  .panel { margin-top: 12px; max-width: 880px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; align-items: center; gap: 12px; }
  .panel-info { flex: 1; min-width: 0; }
  .panel-info strong { font-size: 13px; }
  .panel-info span { display: block; font-size: 12px; color: var(--muted); }
  .panel-actions { display: flex; gap: 8px; }

  /* 按钮：命中区 ≥44px；按压 = motion-contract press preset（subtle spring，near scale 0.98）；
     transition 逐属性声明（禁 transition: all）；键盘激活与指针同效 */
  .btn {
    min-height: 44px; padding: 10px 18px; border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--green); color: #fff; border: 1px solid transparent;
    transition-property: transform, background-color;
    transition-duration: 140ms;
    transition-timing-function: var(--ease);
  }
  .btn.ghost { background: #fff; color: var(--ink); border-color: var(--line); }
  .btn:hover { background: #135f47; }
  .btn.ghost:hover { background: #eef3f6; }
  .btn:active { transform: scale(0.98); } /* 键盘 Enter/Space 激活同样命中 :active */
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .btn:active { transform: none; }
  }
</style>
</head>
<body>
  <h1>库存分析 · 卡行</h1>
  <p class="sub">detail-constants 打磨版——计数器等宽更新、同心圆角嵌套、按压 preset、逐属性过渡。</p>

  <div class="card-row" id="row">
    <div class="card"><div class="card-inner">
      <span class="kicker">今日出库件数</span>
      <span class="value" id="v1">1,284</span>
      <span class="delta up" id="d1">▲ 3.2% 较昨日</span>
    </div></div>
    <div class="card"><div class="card-inner">
      <span class="kicker">滞留 SKU</span>
      <span class="value" id="v2">37</span>
      <span class="delta down" id="d2">▼ 2 件 较昨日</span>
    </div></div>
    <div class="card"><div class="card-inner">
      <span class="kicker">拣货准确率</span>
      <span class="value" id="v3">99.2<span style="font-size:16px">%</span></span>
      <span class="delta up" id="d3">▲ 0.1pt 较昨日</span>
    </div></div>
  </div>

  <div class="panel">
    <div class="panel-info">
      <strong>波次 W-2214 · 待复核 6 行</strong>
      <span>复核完成后自动进入出库队列（演示数据，每 1.2s 刷新）</span>
    </div>
    <div class="panel-actions">
      <button class="btn ghost" id="pause" type="button">暂停刷新</button>
      <button class="btn" id="approve" type="button">批量复核通过</button>
    </div>
  </div>

<script>
  // 演示数据：高频更新计数器（每 1.2s）。等宽数字保证刷新不抖；
  // 高频交互不做 stagger/入场动画（detail-constants 规则 9）。
  const state = { v1: 1284, v2: 37, paused: false };
  const fmt = (n) => n.toLocaleString('zh-CN');
  function tick() {
    if (state.paused) return;
    state.v1 += Math.floor(Math.random() * 7);
    if (Math.random() < 0.12 && state.v2 > 30) state.v2 -= 1;
    document.getElementById('v1').textContent = fmt(state.v1);
    document.getElementById('v2').textContent = state.v2;
  }
  setInterval(tick, 1200);
  document.getElementById('pause').addEventListener('click', (e) => {
    state.paused = !state.paused;
    e.currentTarget.textContent = state.paused ? '恢复刷新' : '暂停刷新';
  });
</script>
</body>
</html>
