<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1.2 13 10.4" role="img" aria-label="NODEGRID 像素云图标">
  <!-- NODEGRID 2D 图标版：3D 体素云的正视投影（11×5 格 + 数据雨滴）
       三层亮度 0.92 尺寸留缝制造像素格感；外发光 feDropShadow -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.16" flood-color="#22d3ee" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="0.5"  flood-color="#22d3ee" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- row0 顶·最亮 -->
    <g fill="#9df3ff">
      <rect x="4.04" y="0.04" width="0.92" height="0.92"/><rect x="5.04" y="0.04" width="0.92" height="0.92"/><rect x="6.04" y="0.04" width="0.92" height="0.92"/>
    </g>
    <!-- row1 亮 -->
    <g fill="#38d9f0">
      <rect x="3.04" y="1.04" width="0.92" height="0.92"/><rect x="4.04" y="1.04" width="0.92" height="0.92"/><rect x="5.04" y="1.04" width="0.92" height="0.92"/><rect x="6.04" y="1.04" width="0.92" height="0.92"/><rect x="7.04" y="1.04" width="0.92" height="0.92"/>
    </g>
    <!-- row2 主色 + 白高光点 -->
    <g fill="#22d3ee">
      <rect x="1.04" y="2.04" width="0.92" height="0.92"/><rect x="2.04" y="2.04" width="0.92" height="0.92"/><rect x="6.04" y="2.04" width="0.92" height="0.92"/><rect x="7.04" y="2.04" width="0.92" height="0.92"/><rect x="8.04" y="2.04" width="0.92" height="0.92"/>
    </g>
    <g fill="#eafcff">
      <rect x="3.04" y="2.04" width="0.92" height="0.92"/><rect x="4.04" y="2.04" width="0.92" height="0.92"/><rect x="5.04" y="2.04" width="0.92" height="0.92"/>
    </g>
    <!-- row3 深 -->
    <g fill="#0e7490">
      <rect x="0.04" y="3.04" width="0.92" height="0.92"/><rect x="1.04" y="3.04" width="0.92" height="0.92"/><rect x="2.04" y="3.04" width="0.92" height="0.92"/><rect x="3.04" y="3.04" width="0.92" height="0.92"/><rect x="4.04" y="3.04" width="0.92" height="0.92"/><rect x="5.04" y="3.04" width="0.92" height="0.92"/><rect x="6.04" y="3.04" width="0.92" height="0.92"/><rect x="7.04" y="3.04" width="0.92" height="0.92"/><rect x="8.04" y="3.04" width="0.92" height="0.92"/><rect x="9.04" y="3.04" width="0.92" height="0.92"/><rect x="10.04" y="3.04" width="0.92" height="0.92"/>
    </g>
    <!-- row4 底·云脚 -->
    <g fill="#0a5068">
      <rect x="2.04" y="4.04" width="0.92" height="0.92"/><rect x="3.04" y="4.04" width="0.92" height="0.92"/><rect x="4.04" y="4.04" width="0.92" height="0.92"/><rect x="5.04" y="4.04" width="0.92" height="0.92"/><rect x="6.04" y="4.04" width="0.92" height="0.92"/><rect x="7.04" y="4.04" width="0.92" height="0.92"/><rect x="8.04" y="4.04" width="0.92" height="0.92"/>
    </g>
    <!-- 数据雨滴（发光像素坠落） -->
    <g fill="#7fc6d8">
      <rect x="3.2" y="6.1" width="0.6" height="0.75" opacity="0.9"/>
      <rect x="7.3" y="5.9" width="0.6" height="0.75" opacity="0.75"/>
      <rect x="5.2" y="7.3" width="0.6" height="0.75" opacity="0.55"/>
    </g>
  </g>
</svg>
