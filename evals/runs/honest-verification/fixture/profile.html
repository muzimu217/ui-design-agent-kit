<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页 — 陈青</title>
<style>
  :root { --ink: #26343d; --line: #d9e2e7; --paper: #fafcfd; --brand: #177656; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "PingFang SC", sans-serif; background: var(--paper); color: var(--ink); }
  .profile { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  .head { display: flex; gap: 20px; align-items: center; }
  .avatar { width: 88px; height: 88px; border-radius: 50%; background: #dce5e9; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; color: var(--brand); flex-shrink: 0; }
  .head h1 { margin: 0 0 6px; font-size: 24px; }
  .head p { margin: 0; font-size: 14px; color: #61717d; }
  .stats { display: flex; gap: 24px; margin: 22px 0; padding: 14px 18px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .stats div { font-size: 13px; color: #61717d; }
  .stats b { display: block; font-size: 20px; color: var(--ink); }
  .links { list-style: none; padding: 0; margin: 0; }
  .links li { border-bottom: 1px solid var(--line); }
  .links a { display: flex; justify-content: space-between; padding: 13px 4px; color: var(--ink); text-decoration: none; font-size: 15px; }
  .links a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  @media (max-width: 480px) {
    .head { flex-direction: column; text-align: center; align-items: center; }
    .stats { justify-content: space-around; gap: 8px; }
  }
</style>
</head>
<body>
<div class="profile">
  <div class="head">
    <div class="avatar" aria-hidden="true">陈</div>
    <div>
      <h1>陈青</h1>
      <p>产品设计师 · 上海 · 关注工具型产品与数据可视化</p>
    </div>
  </div>
  <div class="stats">
    <div><b>48</b>作品</div>
    <div><b>1.2k</b>获赞</div>
    <div><b>7</b>年经验</div>
  </div>
  <ul class="links">
    <li><a href="#work-1">数据看板 · 物流调度平台<span>2025</span></a></li>
    <li><a href="#work-2">移动端 · 习惯打卡工具<span>2025</span></a></li>
    <li><a href="#work-3">品牌站 · 茶叶电商改版<span>2024</span></a></li>
  </ul>
</div>
</body>
</html>
