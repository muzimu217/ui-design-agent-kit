<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结算页（detail-critique 夹具 · 修复后）</title>
<style>
  :root { --ink: #26343d; --line: #d9e2e7; --paper: #fafcfd; --brand: #177656; --muted: #61717d; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "PingFang SC", sans-serif; background: var(--paper); color: var(--ink); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 22px; margin-bottom: 18px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 13px; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
  input:focus-visible { outline: 2px solid #2566c4; outline-offset: 2px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 5px; } /* 修复：#9aa3aa→#61717d（实测 4.9:1） */
  .tilt-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 18px; } /* P2 装饰倾斜：按用户裁量保留/移除，默认移除倾斜保留卡片 */
  .tilt-card b { font-size: 14px; }
  .tilt-card p { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .pay { width: 100%; padding: 13px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  .pay[disabled] { opacity: 0.55; cursor: not-allowed; } /* 修复：disabled 态补齐 */
  .pay:focus-visible { outline: 2px solid #2566c4; outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>结算</h1>
  <div class="tilt-card">
    <b>订单摘要</b>
    <p>年度会员 × 1 · ¥210.00 · 含税</p>
  </div>
  <div class="field">
    <label for="cardnum">卡号</label>
    <input id="cardnum" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456">
    <div class="hint">我们将通过加密通道处理您的卡片信息</div>
  </div>
  <button class="pay" id="pay">确认支付 ¥210.00</button>
</div>
<script>
  const pay = document.getElementById('pay');
  let busy = false;
  pay.addEventListener('click', function () {
    if (busy) return;
    busy = true;
    pay.disabled = true;
    pay.textContent = '处理中…';
    setTimeout(function () { busy = false; pay.disabled = false; pay.textContent = '确认支付 ¥210.00'; }, 1200);
  });
</script>
</body>
</html>
