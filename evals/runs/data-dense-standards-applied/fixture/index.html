<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>库存台账 · 运营台</title>
<style>
:root{--ink:#26343d;--muted:#5a6a75;--paper:#fafcfd;--line:#d9e2e7;--accent:#177656;
--ok:#177656;--warn:#a05a00;--out:#a33d3d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);
font:14px/1.5 'PingFang SC','Microsoft YaHei',sans-serif;padding:28px 20px 60px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:19px;margin:0 0 16px}
.filters{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.filters input,.filters select{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13.5px}
.bulkbar{display:none;align-items:center;gap:12px;margin-bottom:10px;padding:8px 12px;
background:#eef5f1;border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.bulkbar.show{display:flex}
.tablebox{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{padding:5px 10px;height:32px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
border-bottom:1px solid var(--line);font-size:13.5px}
thead th{position:sticky;top:0;background:#eef2f5;z-index:2;font-weight:600;text-align:left}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th.sel,td.sel{width:36px;text-align:center}
th.op,td.op{width:96px}
col.c-id{width:96px}.c-name{width:150px}.c-cat{width:90px}.c-st{width:92px}
.c-num{width:84px}.c-price{width:90px}.c-sup{width:120px}.c-wh{width:90px}.c-time{width:140px}
.st{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.st .shape{font-size:12px}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.out{color:var(--out)}
th input[type=checkbox]{accent-color:var(--accent)}
td input[type=checkbox]{accent-color:var(--accent)}
.empty{display:none;padding:36px 20px;text-align:center}
.empty p{color:var(--muted);margin:0 0 14px}
.skel{display:none}
.skel td{height:34px;background:linear-gradient(90deg,#eef1f4 25%,#f7fafc 50%,#eef1f4 75%);
background-size:400px 100%;color:transparent}
.report{display:none;margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#fff}
.report.show{display:block}
.report h2{font-size:14.5px;margin:0 0 8px}
.report table{table-layout:auto}
.report th,.report td{height:auto}
</style>
</head>
<body>
<div class="wrap">
<h1>库存台账</h1>
<div class="filters">
  <input id="f-name" placeholder="按名称搜素"/>
  <select id="f-cat"><option value="">全部类别</option><option>五金</option><option>耗材</option><option>电器</option></select>
  <select id="f-st"><option value="">全部状态</option><option value="ok">正常</option><option value="warn">待补</option><option value="out">缺货</option></select>
</div>
<div class="bulkbar" id="bulkbar">
  已选 <b id="sel-count">0</b> 条
  <button class="primary" id="archive-btn" style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer">归档所选</button>
</div>
<div class="tablebox">
<table id="ledger">
  <colgroup>
    <col class="c-sel"><col class="c-id"><col class="c-name"><col class="c-cat"><col class="c-st">
    <col class="c-num"><col class="c-price"><col class="c-num"><col class="c-sup"><col class="c-wh"><col class="c-time"><col class="c-op">
  </colgroup>
  <thead>
    <tr>
      <th class="sel"><input type="checkbox" id="sel-all" aria-label="全选"/></th>
      <th>单号</th><th>名称</th><th>类别</th><th>状态</th>
      <th class="num">库存</th><th class="num">单价</th><th class="num">金额</th>
      <th>供应商</th><th>仓库</th><th>更新时间</th><th class="op">操作</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div class="skel-wrap">
<table class="skel" id="skel" aria-hidden="true"><tbody></tbody></table>
</div>
<div class="empty" id="empty">
  <p>台账里还没有记录。建第一条库存记录后，这里会显示它的状态与流水。</p>
  <button class="primary" id="first-btn" style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer">新建第一张采购单</button>
</div>
</div>
<div class="report" id="report" aria-live="polite">
  <h2>归档结果（逐条）</h2>
  <table><thead><tr><th>单号</th><th>名称</th><th>结果</th></tr></thead><tbody id="report-rows"></tbody></table>
</div>
</div>
<script>
const COLS = 12;
const CATS = ['五金','耗材','电器']; const SUP = ['广达','联丰','恒益']; const WH = ['A 仓','B 仓'];
const ST = { ok:['✔','正常','ok'], warn:['!','待补','warn'], out:['✕','缺货','out'] };
function genRows(n){ const rows=[]; for(let i=0;i<n;i++){
  const st=['ok','ok','ok','warn','out'][i%5];
  const stock=st==='out'?0:(st==='warn'?(i%4+1)*3:40+(i*7)%260);
  const price=(8+(i*13)%190)+0.5;
  rows.push({id:'INV-'+String(1000+i), name:'库存品 '+String(i+1).padStart(3,'0'),
    cat:CATS[i%3], st, stock, price, amt:(stock*price).toFixed(2), sup:SUP[i%3], wh:WH[i%2],
    time:'09-'+String((i%28)+1).padStart(2,'0')+' 1'+(i%9)+':2'+(i%9)});
} return rows; }
let ROWS = [];
const tbody = document.getElementById('rows');
function render(){
  const name=document.getElementById('f-name').value.trim();
  const cat=document.getElementById('f-cat').value; const st=document.getElementById('f-st').value;
  const view=ROWS.filter(r=>(!name||r.name.includes(name))&&(!cat||r.cat===cat)&&(!st||r.st===st));
  tbody.innerHTML='';
  if(!view.length){ document.getElementById('empty').style.display='block'; updateBulk(); return; }
  document.getElementById('empty').style.display='none';
  for(const r of view){ const s=ST[r.st]; const tr=document.createElement('tr');
    tr.innerHTML=`<td class="sel"><input type="checkbox" class="row-sel" value="${r.id}"/></td>
    <td>${r.id}</td><td>${r.name}</td><td>${r.cat}</td>
    <td><span class="st ${s[2]}"><span class="shape">${s[0]}</span>${s[1]}</span></td>
    <td class="num">${r.stock}</td><td class="num">${r.price.toFixed(2)}</td><td class="num">${r.amt}</td>
    <td>${r.sup}</td><td>${r.wh}</td><td>${r.time}</td>
    <td class="op"><button class="ghost" data-arc="${r.id}" style="background:#fff;border:1px solid var(--line);border-radius:5px;padding:4px 10px;cursor:pointer">归档</button></td>`;
    tbody.appendChild(tr); }
  bindRows(); updateBulk();
}
function bindRows(){
  tbody.querySelectorAll('.row-sel').forEach(cb=>cb.addEventListener('change',updateBulk));
  tbody.querySelectorAll('[data-arc]').forEach(b=>b.addEventListener('click',()=>archive([b.dataset.arc])));
  const all=document.getElementById('sel-all'); const boxes=[...tbody.querySelectorAll('.row-sel')];
  all.checked=boxes.length&&boxes.every(b=>b.checked); all.indeterminate=boxes.some(b=>b.checked)&&!all.checked;
  all.onchange=()=>{boxes.forEach(b=>b.checked=all.checked);updateBulk();};
  boxes.forEach(b=>b.onchange=()=>{const bs=[...tbody.querySelectorAll('.row-sel')];
    all.checked=bs.length&&bs.every(x=>x.checked); all.indeterminate=bs.some(x=>x.checked)&&!all.checked; updateBulk();});
}
function updateBulk(){ const n=tbody.querySelectorAll('.row-sel:checked').length;
  document.getElementById('sel-count').textContent=n;
  document.getElementById('bulkbar').classList.toggle('show',n>0); }
function archive(ids){ const rep=document.getElementById('report-rows'); rep.innerHTML='';
  const byId=Object.fromEntries(ROWS.map(r=>[r.id,r]));
  for(const id of ids){ const r=byId[id];
    const result=r&&r.st!=='out'?'已归档':'已跳过（缺货品需先清库存）';
    const tr=document.createElement('tr'); tr.innerHTML=`<td>${id}</td><td>${r?r.name:'—'}</td><td>${result}</td>`; rep.appendChild(tr); }
  ROWS=ROWS.filter(r=>!(ids.includes(r.id)&&r.st!=='out'));
  document.getElementById('report').classList.add('show'); render(); }
['f-name','f-cat','f-st'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.getElementById('archive-btn').addEventListener('click',()=>{
  archive([...tbody.querySelectorAll('.row-sel:checked')].map(b=>b.value)); });
document.getElementById('first-btn').addEventListener('click',()=>{ ROWS=genRows(5); render(); });
// 骨架屏（与真实表列数一致）：初始渲染 COLS×8，再载入数据
(function init(){ const sk=document.getElementById('skel').querySelector('tbody');
  for(let r=0;r<8;r++){ const tr=document.createElement('tr');
    for(let c=0;c<COLS;c++){ const td=document.createElement('td'); td.textContent='████████'; tr.appendChild(td);} sk.appendChild(tr);} })();
const params=new URLSearchParams(location.search);
const sk=document.getElementById('skel');
sk.style.display='table';
if(params.get('skeleton')!=='1'){ setTimeout(()=>{ ROWS=genRows(300); render(); sk.style.display='none'; }, params.get('delay')?600:60); }
</script>
</body>
</html>
