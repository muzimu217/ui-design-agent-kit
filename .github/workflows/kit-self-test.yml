name: Kit Self Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: kit-self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - name: Install kit dependencies
        run: npm ci --ignore-scripts
      - name: Structural verification
        run: npm run verify
      - name: Kit test suite (61)
        run: npm test
      - name: Eval ledger check
        run: npm run eval -- --check
      - name: Prompt export rebuild
        run: npm run prompt:build && npm run prompt:build:lean
