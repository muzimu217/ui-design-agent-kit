<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>设置 · 演示数据</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232557a7'/%3E%3Ccircle cx='8' cy='8' r='3' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E" />
<style>
  :root{
    --ink:#1c1e21; --ink-2:#5c6167; --ink-3:#6a7076;
    --paper:#f6f6f3; --surface:#ffffff; --line:#e3e3dd; --line-strong:#c9c9c1;
    --accent:#2557a7; --accent-ink:#ffffff; --accent-soft:#e8eef8;
    --ok:#1c7d43; --ok-soft:#e5f3ea; --warn:#9a5b00; --warn-soft:#fdf1dd;
    --danger:#b3372e; --danger-soft:#fbeae8;
    --focus:#0f62d6;
    --r-s:6px; --r-m:10px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px;
    --ring:0 0 0 2px var(--surface), 0 0 0 4px var(--focus);
  }
  *{box-sizing:border-box}
  .visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font:15px/1.55 -apple-system,"PingFang SC","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:var(--sp-8) var(--sp-4) 96px}
  header h1{font-size:22px;line-height:1.3;margin:0 0 var(--sp-1)}
  header p{margin:0;color:var(--ink-2)}
  .demo-banner{
    margin:var(--sp-4) 0 0;padding:var(--sp-2) var(--sp-3);
    background:var(--warn-soft);color:var(--warn);
    border:1px solid #f0d9b0;border-radius:var(--r-s);font-size:13px;
  }
  section{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
    padding:var(--sp-6);margin-top:var(--sp-4);
  }
  section>h2{font-size:15px;margin:0 0 var(--sp-1)}
  section>.hint{margin:0 0 var(--sp-4);color:var(--ink-3);font-size:13px}
  fieldset{border:0;margin:0;padding:0}
  fieldset+fieldset{margin-top:var(--sp-5);padding-top:var(--sp-5);border-top:1px solid var(--line)}
  legend,label{font-weight:600;font-size:14px}
  legend{padding:0;margin-bottom:var(--sp-2)}
  .row{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-2) 0}
  .row+.row{border-top:1px dashed var(--line)}
  .row .text{flex:1}
  .row .text small{display:block;color:var(--ink-3);font-weight:400;font-size:13px}
  input[type=checkbox],input[type=radio]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
  input[type=text]{
    width:100%;max-width:360px;padding:var(--sp-2) var(--sp-3);
    border:1px solid var(--line-strong);border-radius:var(--r-s);
    font:inherit;color:var(--ink);background:var(--surface);
  }
  input[type=text]:hover{border-color:var(--ink-3)}
  input[type=text]:focus-visible{outline:none;box-shadow:var(--ring);border-color:var(--focus)}
  input[type=text][aria-invalid=true]{border-color:var(--danger);background:var(--danger-soft)}
  input[readonly]{background:var(--paper);color:var(--ink-2);border-style:dashed}
  .field-error{display:none;color:var(--danger);font-size:13px;margin-top:var(--sp-1)}
  .field-error[data-show]{display:block}
  .switch{position:relative;display:inline-block;width:40px;height:24px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch .track{
    position:absolute;inset:0;background:var(--line-strong);border-radius:12px;
    transition:background 120ms var(--ease, ease-out);pointer-events:none;
  }
  .switch .track::after{
    content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
    border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);
    transition:transform 120ms var(--ease, ease-out);
  }
  .switch input:checked+.track{background:var(--accent)}
  .switch input:checked+.track::after{transform:translateX(16px)}
  .switch input:focus-visible+.track{box-shadow:var(--ring)}
  .switch input:disabled+.track{opacity:.4}
  button{
    font:inherit;font-weight:600;border-radius:var(--r-s);cursor:pointer;
    padding:var(--sp-2) var(--sp-4);border:1px solid transparent;
  }
  button:focus-visible{outline:none;box-shadow:var(--ring)}
  button:active:not(:disabled){transform:translateY(1px)}
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-primary:hover:not(:disabled){background:#1e4a8d}
  .btn-primary:disabled{background:var(--line-strong);color:var(--surface);cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--line-strong)}
  .btn-ghost:hover:not(:disabled){background:var(--paper)}
  .btn-ghost:disabled{opacity:.5;cursor:not-allowed}
  .danger-box{
    display:flex;justify-content:space-between;align-items:center;gap:var(--sp-4);
    background:var(--danger-soft);border:1px solid #eccfcb;border-radius:var(--r-s);
    padding:var(--sp-3) var(--sp-4);
  }
  .danger-box p{margin:0;font-size:13px;color:var(--danger)}
  .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
  .btn-danger:disabled{opacity:.45;cursor:not-allowed}
  .savebar{
    position:fixed;left:0;right:0;bottom:0;background:var(--surface);
    border-top:1px solid var(--line);padding:var(--sp-3) var(--sp-4);
  }
  .savebar .inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:var(--sp-3)}
  .savebar .state{flex:1;font-size:13px;color:var(--ink-3)}
  .savebar .state[data-dirty=true]{color:var(--warn);font-weight:600}
  .toast{
    position:fixed;top:var(--sp-4);left:50%;transform:translateX(-50%) translateY(-8px);
    background:var(--ok);color:#fff;padding:var(--sp-2) var(--sp-4);
    border-radius:var(--r-s);font-size:14px;opacity:0;pointer-events:none;
    transition:opacity 120ms var(--ease,ease-out),transform 120ms var(--ease,ease-out);
  }
  .toast[data-show]{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){
    .switch .track,.switch .track::after,.toast{transition:none}
    button:active:not(:disabled){transform:none}
  }
  @media (max-width:640px){
    .wrap{padding-top:var(--sp-6)}
    section{padding:var(--sp-4)}
    .danger-box{flex-direction:column;align-items:stretch;text-align:left}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>设置</h1>
    <p>工作区偏好与账户信息。</p>
    <p class="demo-banner">演示环境：数据仅保存在本页内存中，不会写回服务器。</p>
  </header>

  <form id="settings" novalidate>
    <section>
      <h2>通知</h2>
      <p class="hint">选择哪些事件需要提醒你。所有提醒仅在本应用内显示。</p>
      <fieldset>
        <legend class="visually-hidden">通知偏好</legend>
        <div class="row">
          <input type="checkbox" id="n1" name="notify" checked />
          <label class="text" for="n1">审批状态变化<small>你提交或负责的申请被批准、驳回时</small></label>
        </div>
        <div class="row">
          <input type="checkbox" id="n2" name="notify" />
          <label class="text" for="n2">超时未处理提醒<small>申请超过 3 个工作日未处理时</small></label>
        </div>
        <div class="row">
          <input type="checkbox" id="n3" name="notify" checked disabled />
          <label class="text" for="n3">安全通知<small>登录异常等安全事件（系统强制开启）</small></label>
        </div>
      </fieldset>
    </section>

    <section>
      <h2>界面</h2>
      <p class="hint">外观与信息密度。</p>
      <fieldset>
        <legend>主题</legend>
        <div class="row">
          <input type="radio" id="t1" name="theme" value="system" checked />
          <label class="text" for="t1">跟随系统</label>
        </div>
        <div class="row">
          <input type="radio" id="t2" name="theme" value="light" />
          <label class="text" for="t2">浅色</label>
        </div>
        <div class="row">
          <input type="radio" id="t3" name="theme" value="dark" />
          <label class="text" for="t3">深色</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>列表密度</legend>
        <div class="row">
          <label class="switch" for="density">
            <input type="checkbox" id="density" name="density" role="switch" aria-describedby="density-hint" />
            <span class="track" aria-hidden="true"></span>
          </label>
          <span class="text" id="density-hint"><strong style="font-weight:600">紧凑模式</strong><small>缩小行高，一屏显示更多条目</small></span>
        </div>
      </fieldset>
    </section>

    <section>
      <h2>账户</h2>
      <p class="hint">显示名称会出现在审批记录里。</p>
      <fieldset>
        <legend><label for="display-name">显示名称</label></legend>
        <div class="row" style="display:block">
          <input type="text" id="display-name" name="displayName" value="王芳" maxlength="20"
                 autocomplete="name" aria-describedby="name-hint name-error" />
          <p class="hint" id="name-hint" style="margin:var(--sp-1) 0 0">2–20 个字符。</p>
          <p class="field-error" id="name-error" role="alert">显示名称不能为空。</p>
        </div>
        <div class="row" style="display:block">
          <label for="email" style="display:block;margin-bottom:var(--sp-1)">登录邮箱（由 IT 管理，不可在此修改）</label>
          <input type="text" id="email" value="wang.fang@example.com" readonly />
        </div>
      </fieldset>
    </section>

    <section>
      <h2>危险区</h2>
      <div class="danger-box">
        <p>清空本工作区的全部演示数据。需管理员身份，当前账户（行政·普通）不可操作。</p>
        <button type="button" class="btn-danger" id="purge" disabled aria-describedby="purge-reason">清空数据</button>
      </div>
      <p class="hint" id="purge-reason" style="margin-top:var(--sp-2)">按钮不可用原因：需要管理员权限。</p>
    </section>

    <div class="savebar">
      <div class="inner">
        <span class="state" id="save-state" data-dirty="false">所有更改已保存</span>
        <button type="button" class="btn-ghost" id="reset" disabled>还原</button>
        <button type="submit" class="btn-primary" id="save" disabled>保存更改</button>
      </div>
    </div>
  </form>
</div>
<div class="toast" id="toast" role="status" aria-live="polite">设置已保存（演示数据，未写回服务器）</div>

<script>
  const form = document.getElementById('settings');
  const save = document.getElementById('save');
  const reset = document.getElementById('reset');
  const state = document.getElementById('save-state');
  const toast = document.getElementById('toast');
  const name = document.getElementById('display-name');
  const nameError = document.getElementById('name-error');
  function snapshot(){
    return [...form.elements].filter(el => el.name).map(el =>
      (el.type === 'checkbox' || el.type === 'radio')
        ? `${el.id}:${el.checked}`
        : `${el.id}:${el.value}`
    ).join('|');
  }
  let initialSnap = snapshot();

  function dirty(){ return snapshot() !== initialSnap; }
  function refresh(){
    const d = dirty() || name.getAttribute('aria-invalid') === 'true';
    save.disabled = !d; reset.disabled = !d;
    state.dataset.dirty = d;
    state.textContent = d ? '有未保存的更改' : '所有更改已保存';
  }
  function validateName(){
    const bad = name.value.trim().length < 2;
    name.setAttribute('aria-invalid', bad ? 'true' : 'false');
    nameError.toggleAttribute('data-show', bad);
    return !bad;
  }
  name.addEventListener('input', () => { validateName(); refresh(); });
  form.addEventListener('change', refresh);
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!validateName()) { name.focus(); return; }
    [...form.elements].forEach(el => {
      if (el.name) { el.defaultValue = el.value; el.defaultChecked = el.checked; }
    });
    initialSnap = snapshot();
    refresh();
    toast.setAttribute('data-show', '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.removeAttribute('data-show'), 2400);
  });
  reset.addEventListener('click', () => {
    [...form.elements].forEach(el => {
      if (!el.name) return;
      if (el.type === 'checkbox' || el.type === 'radio') el.checked = el.defaultChecked;
      else el.value = el.defaultValue;
    });
    validateName(); refresh();
  });
  validateName(); refresh();
</script>
</body>
</html>
