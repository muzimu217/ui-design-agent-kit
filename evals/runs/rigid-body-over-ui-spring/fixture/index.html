<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rapier 拖拽堆叠 · R3F</title>
<style>
  body { margin: 0; font-family: "PingFang SC", sans-serif; color: #e8eef2; background: #0c1116; }
  .wrap { position: relative; height: 100vh; }
  .wrap canvas { display: block; touch-action: none; }
  .hud { position: absolute; top: 18px; left: 18px; font-size: 13px; color: #9db0bc; background: rgba(12,17,22,0.7); border: 1px solid rgba(141,176,196,0.2); border-radius: 9px; padding: 10px 14px; }
  .toast-host { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); }
  .toast { background: #177656; color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 9px; }
  .hint { position: absolute; bottom: 18px; right: 18px; font-size: 12px; color: #64798a; }
</style>
</head>
<body>
<style>
  #root { position: fixed; inset: 0; }
  #root canvas { display: block; }
</style>
<div class="wrap"><div id="root"></div>
<style> #three-root { position: absolute; inset: 0; } </style>
<div class="hud">Rapier 物理 · 拖拽方块抛掷 · 释放落回堆叠</div>
<div class="toast-host" id="toast-host"></div>
<div class="hint">拖拽抛掷 · 空格重置 · reduced motion 关 UI 弹簧（物理照常）</div>
</div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
