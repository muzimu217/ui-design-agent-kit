linear.app` 与 `vercel` |\n| `curl` 状态码 + 标题 | 可达性实测 | tideguide.com=200、screensdesign 拆解页=200、dark.design=200、landing.love=200、godly=200、reactbits=200、magicui=200、21st.dev=200、Wikimedia Commons=200、Google Fonts 规格页=200 |\n| NOAA CO-OPS API 实际调用 | 验证数据可用性 | HTTP 200，返回站点 9414290 的逐小时潮位预报 JSON |\n| Wikimedia Commons API | 核实单个文件许可 | 某潮汐图表文件 `LicenseShortName = Public domain` |\n| 本地字体库 `ui-ux-pro-max/data/` | 首站字体与许可查询 | 1,934 个字体家族；JetBrains Mono / Geist Mono / Noto Sans SC / Noto Sans Mono 等均为 OFL，verifiedAt 2026-08-13 |\n| Web 检索 | 发现同类真实产品 | 命中 Tide Guide（tideguide.com），为 R3 来源 |\n\n**未执行**：任何浏览器渲染验证、任何素材下载、任何登录或反爬绕过、任何对本地仓库文件的修改（除本文件外）。\n"},{"path":"docs/reference/OBSERVATION-tideguide.md","status":"ok","kind":"markdown","reason":null,"bytes":3823,"html":"<h1 class=\"md-h1\">R3 浏览器实地观察记录（门B 要求 B2）</h1>\n<p class=\"md-p\"><strong>观察时间</strong>：2026-09-16 <strong>观察方式</strong>：真实浏览器（Playwright，1440×1000 视口）打开 https://tideguide.com/ <strong>观察目的</strong>：子代理 A 只确认了 HTTP 200 与标题，未亲眼看到曲线 UI。门B 裁决要求补齐实际观察。</p>\n<h2 class=\"md-h2\">一、观察到的内容</h2>\n<p class=\"md-p\"><strong>页面结构</strong>（首屏，不滚动）：</p>\n<ol class=\"md-list\"><li>顶栏：品牌标记 + &quot;Help Center&quot; + 蓝色 &quot;Download&quot; 按钮</li><li><strong>多设备产品图</strong>：iPhone / iPad / Apple Watch 并排，屏幕内容都是潮汐曲线界面</li><li>主标题：<strong>&quot;Know the forecast before you go.&quot;</strong>（&quot;forecast&quot; 一词用蓝色强调）</li><li>副标题：说明覆盖 Live tides / marine weather / clear forecasts，列出四个平台</li><li>三个奖项徽章：Apple Watch App of the Year (Finalist)、Apple Design Award (Winner)、Editor&#39;s Choice</li><li>App Store 下载按钮</li></ol>\n<p class=\"md-p\"><strong>关键观察：曲线在 iPad 屏幕里的呈现方式</strong></p>\n<ul class=\"md-list\"><li>曲线<strong>占据主视区</strong>，横跨整个宽度，是界面里最大的元素</li><li>曲线下方是<strong>渐变填充</strong>（深蓝到透明），不是纯线条</li><li>曲线上标注了<strong>高低潮时刻与潮位值</strong>（如 &quot;6:11p 7.1ft&quot;、&quot;12:00a 4.4ft&quot;）</li><li>有一个<strong>圆形游标点</strong>停在曲线某处，旁边跟着读数</li><li>曲线下方另有一条<strong>独立的细条带</strong>，看起来是未来数日的潮差概览</li><li>整体配色：深蓝底 + 亮青曲线，与我们的方向高度接近</li></ul>\n<h2 class=\"md-h2\">二、对方向的验证与修正</h2>\n<h3 class=\"md-h3\">验证成立的部分</h3>\n<ol class=\"md-list\"><li><strong>&quot;曲线即 hero&quot; 成立</strong> —— 这个产品的官网首屏不放海景照片、不放人物，放的就是曲线本身。我们的方向稿判断正确。</li><li><strong>深浅对比的用法成立</strong> —— 深蓝底 + 亮色曲线，正是我们定的路子。</li><li><strong>高低潮时刻标注是行业惯例</strong> —— 曲线上直接标时刻与数值，不是靠图例解释。</li></ol>\n<h3 class=\"md-h3\">推翻我们假设的部分（重要）</h3>\n<p class=\"md-p\"><strong>方向稿第三屏写&quot;一日两次涨落的说明&quot;，原意是用文字讲潮汐节律。观察到的事实是：这个产品的官网根本不解释潮汐原理。</strong></p>\n<p class=\"md-p\">它的做法是：<strong>用曲线本身承担全部表达</strong>，配合一句&quot;See the tide at a glance, then scrub through the curve&quot;（一眼看懂，然后拖动曲线）。它默认访客已经知道潮汐是什么——因为目标用户就是海钓的人，他们不需要被科普。</p>\n<blockquote class=\"md-quote\"><p class=\"md-p\"><strong>结论：我们的第三屏&quot;一日两次涨落的说明&quot;是多余的，且带着说教气。</strong> 目标用户是海钓/赶海的人，他们知道潮汐是什么。这一屏应当改为<strong>展示曲线的实际用法</strong>（例如&quot;退潮前两小时最适合赶海&quot;这类基于真实读数的判断），而不是解释潮汐原理。</p></blockquote>\n<h3 class=\"md-h3\">一处我们做得更好、要保留的</h3>\n<p class=\"md-p\"><strong>它的首屏只有产品图与 slogan，没有真实读数。</strong> 门A 修正 A2 要求&quot;第一屏不滚动即可见今日潮位读数&quot;——观察确认这个要求是<strong>我们的优势</strong>，不是照抄。Tide Guide 的访客要滚动才知道今天潮怎么样；我们的第一屏直接给读数。</p>\n<h2 class=\"md-h2\">三、授权边界（重申）</h2>\n<ul class=\"md-list\"><li><strong>reference-only</strong>：只提炼可观察的布局与交互关系。</li><li><strong>不复制</strong>：截图、图标、文案、配色值、代码。本记录中的截图仅为研究留痕，<strong>不进入产品、不作为素材</strong>。</li><li>页面上不得出现任何 Tide Guide 的素材或品牌元素。</li><li>本文件位于 <code class=\"md-code\">demo/tide-app/docs/reference/</code>，属研究证据，交付物中不引用。</li></ul>\n<h2 class=\"md-h2\">四、诚实边界</h2>\n<ul class=\"md-list\"><li>我观察的是<strong>官网营销页</strong>，不是它 App 内的实际交互。官网里的曲线是产品截图，<strong>无法验证拖动时读数如何响应</strong>（弹簧、跟随方式等）。因此&quot;拖动体验&quot;层面仍无证据，我们按 <code class=\"md-code\">motion-contract.md</code> 的预设自行决定。</li><li>未登录、未下载其 App、未尝试任何绕过。</li></ul>","source":"# R3 浏览器实地观察记录（门B 要求 B2）\n\n**观察时间**：2026-09-16\n**观察方式**：真实浏览器（Playwright，1440×1000 视口）打开 https://tideguide.com/\n**观察目的**：子代理 A 只确认了 HTTP 200 与标题，未亲眼看到曲线 UI。门B 裁决要求补齐实际观察。\n\n## 一、观察到的内容\n\n**页面结构**（首屏，不滚动）：\n\n1. 顶栏：品牌标记 + \"Help Center\" + 蓝色 \"Download\" 按钮\n2. **多设备产品图**：iPhone / iPad / Apple Watch 并排，屏幕内容都是潮汐曲线界面\n3. 主标题：**\"Know the forecast before you go.\"**（\"forecast\" 一词用蓝色强调）\n4. 副标题：说明覆盖 Live tides / marine weather / clear forecasts，列出四个平台\n5. 三个奖项徽章：Apple Watch App of the Year (Finalist)、Apple Design Award (Winner)、Editor's Choice\n6. App Store 下载按钮\n\n**关键观察：曲线在 iPad 屏幕里的呈现方式**\n\n- 曲线**占据主视区**，横跨整个宽度，是界面里最大的元素\n- 曲线下方是**渐变填充**（深蓝到透明），不是纯线条\n- 曲线上标注了**高低潮时刻与潮位值**（如 \"6:11p 7.1ft\"、\"12:00a 4.4ft\"）\n- 有一个**圆形游标点**停在曲线某处，旁边跟着读数\n- 曲线下方另有一条**独立的细条带**，看起来是未来数日的潮差概览\n- 整体配色：深蓝底 + 亮青曲线，与我们的方向高度接近\n\n## 二、对方向的验证与修正\n\n### 验证成立的部分\n\n1. **\"曲线即 hero\" 成立** —— 这个产品的官网首屏不放海景照片、不放人物，放的就是曲线本身。我们的方向稿判断正确。\n2. **深浅对比的用法成立** —— 深蓝底 + 亮色曲线，正是我们定的路子。\n3. **高低潮时刻标注是行业惯例** —— 曲线上直接标时刻与数值，不是靠图例解释。\n\n### 推翻我们假设的部分（重要）\n\n**方向稿第三屏写\"一日两次涨落的说明\"，原意是用文字讲潮汐节律。观察到的事实是：这个产品的官网根本不解释潮汐原理。**\n\n它的做法是：**用曲线本身承担全部表达**，配合一句\"See the tide at a glance, then scrub through the curve\"（一眼看懂，然后拖动曲线）。它默认访客已经知道潮汐是什么——因为目标用户就是海钓的人，他们不需要被科普。\n\n> **结论：我们的第三屏\"一日两次涨落的说明\"是多余的，且带着说教气。** 目标用户是海钓/赶海的人，他们知道潮汐是什么。这一屏应当改为**展示曲线的实际用法**（例如\"退潮前两小时最适合赶海\"这类基于真实读数的判断），而不是解释潮汐原理。\n\n### 一处我们做得更好、要保留的\n\n**它的首屏只有产品图与 slogan，没有真实读数。** 门A 修正 A2 要求\"第一屏不滚动即可见今日潮位读数\"——观察确认这个要求是**我们的优势**，不是照抄。Tide Guide 的访客要滚动才知道今天潮怎么样；我们的第一屏直接给读数。\n\n## 三、授权边界（重申）\n\n- **reference-only**：只提炼可观察的布局与交互关系。\n- **不复制**：截图、图标、文案、配色值、代码。本记录中的截图仅为研究留痕，**不进入产品、不作为素材**。\n- 页面上不得出现任何 Tide Guide 的素材或品牌元素。\n- 本文件位于 `demo/tide-app/docs/reference/`，属研究证据，交付物中不引用。\n\n## 四、诚实边界\n\n- 我观察的是**官网营销页**，不是它 App 内的实际交互。官网里的曲线是产品截图，**无法验证拖动时读数如何响应**（弹簧、跟随方式等）。因此\"拖动体验\"层面仍无证据，我们按 `motion-contract.md` 的预设自行决定。\n- 未登录、未下载其 App、未尝试任何绕过。\n"}],"nodeIds":["stage:reference","gate:B","rework:reference"]},{"id":"contract","name":"原型与契约","gates":["C","D"],"summary":"确认原型，再固定布局、交互、动效与验收条件。","output":"原型 / 设计契约","evidence":"原型图或提示词 + DESIGN.md（含动效规格）","decisionPoint":true,"status":"passed","stageNote":"门C/D 通过；色值全部实测计算。","evidenceActual":"docs/DESIGN.md · docs/GATE-CD-DECISION.md","isCurrent":false,"gateNodes":[{"id":"C","title":"门C 原型","detail":"无代码原型（生成图或生图提示词）","status":"passed","lane":"user"},{"id":"D","title":"门D 契约确认","detail":"DESIGN.md + 动效方案","status":"passed","lane":"user"}],"artifacts":[{"path":"docs/DESIGN.md","status":"ok","kind":"markdown","reason":null,"bytes":37934,"html":"<h1 class=\"md-h1\">潮汐 TIDE · 产品页设计契约</h1>\n<blockquote class=\"md-quote\"><p class=\"md-p\">本文件是阶段 3（原型与契约）的设计契约，结构遵循 <code class=\"md-code\">.agents/skills/ui-design-agent/references/design-contract.md</code>。 上游：<code class=\"md-code\">DIRECTION.md</code>（门A 方向稿）、<code class=\"md-code\">GATE-A-DECISION.md</code>（A1–A4）、 <code class=\"md-code\">RESEARCH-NOTES.md</code>（门B 候选清单）、<code class=\"md-code\">GATE-B-DECISION.md</code>（B1–B3）、 <code class=\"md-code\">reference/OBSERVATION-tideguide.md</code>（R3 实地观察，推翻了方向稿第三屏）。</p>\n<p class=\"md-p\">本阶段<strong>不写实现代码</strong>。契约中的一切数值均为设计期定稿值，实现阶段照此落地。 所有对比度数值由我在设计期用 WCAG 2.x 相对亮度公式（sRGB 线性化 + <code class=\"md-code\">(L1+0.05)/(L2+0.05)</code>） 本地计算得出，未使用浏览器，也未做渲染验证。</p></blockquote>\n<hr class=\"md-hr\"/>\n<h2 class=\"md-h2\">参考基线与授权（authoring workflow 第 2 步）</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>来源</th><th>路径 / URL</th><th>采用的部分</th><th>不采用的部分</th><th>授权</th></tr></thead><tbody><tr><td>R1 · awesome-design-md <code class=\"md-code\">linear.app</code></td><td>https://github.com/VoltAgent/awesome-design-md，revision <code class=\"md-code\">8147538b4226ae41e2487a9179e3bcc1f68e8554</code></td><td>仅关系：单一强调色只出现在少数关键位置（焦点环、主 CTA、数据本体），绝不用于装饰；负字距</td><td><strong>全部色值</strong>（其 canvas <code class=\"md-code\">#010102</code> 相对亮度 0.00033，远低于 A1 下限；其 <code class=\"md-code\">ink-subtle #8a8f98</code> 在其底色上仅 6.42:1，未达 7:1）</td><td>MIT（第三方分析文档，非品牌官方规范；不声称关联）</td></tr><tr><td>R2 · awesome-design-md <code class=\"md-code\">vercel</code></td><td>同上仓库</td><td>仅层次机制：四级 surface 阶梯 + hairline 分隔 + 极性反转分区带</td><td><strong>其浅色基调</strong>（实测 canvas <code class=\"md-code\">#ffffff</code>，方向稿误标为深色基线）；其 <code class=\"md-code\">mute #888888</code> 在 <code class=\"md-code\">#ffffff</code> 上仅 3.54:1，作为反面教材记录</td><td>MIT（同上）</td></tr><tr><td>R3 · Tide Guide</td><td>https://tideguide.com/</td><td>仅可观察的布局与交互关系：曲线占据主视区、高低潮时刻与潮位直接标在曲线上、圆形游标带读数</td><td>截图、图标、文案、配色值、代码一律不复制；页面上不得出现其任何素材或品牌元素</td><td>商业产品，无开源许可，<strong>reference-only</strong></td></tr><tr><td>P1 · 本仓库动效规范</td><td><code class=\"md-code\">.agents/skills/ui-design-agent/references/motion-contract.md</code></td><td>具名弹簧预设、降级规则、微编排规则</td><td>—</td><td>本仓库自有；其引用的 <code class=\"md-code\">motion</code> 包为 MIT</td></tr><tr><td>A3 · Lucide 图标</td><td>https://lucide.dev</td><td>沿用仓库既有 <code class=\"md-code\">lucide-react</code> 依赖</td><td>不新增第二套图标库；用量极少</td><td>ISC（实测读 LICENSE 文件）</td></tr><tr><td>字体</td><td>系统栈</td><td>—</td><td><strong>不引入 JetBrains Mono / Noto Sans SC</strong>（门B Q1 裁决）</td><td>无外部许可义务</td></tr></tbody></table></div>\n<p class=\"md-p\"><strong>R2b（<code class=\"md-code\">warp</code>）状态：未裁决，见文末「冲突与待定」。本契约不采用其任何内容。</strong></p>\n<hr class=\"md-hr\"/>\n<h2 class=\"md-h2\">1. Mission</h2>\n<p class=\"md-p\">让一位海钓或赶海的人，在手机上打开页面后<strong>不滚动</strong>就能看到今天的潮位读数，并能用键盘或手指沿时间轴拖动曲线，查清&quot;今天几点能下水&quot;。</p>\n<p class=\"md-p\">（界面存在的一句话目的；不含&quot;提升品牌认知&quot;这类不可证伪的表述。）</p>\n<h2 class=\"md-h2\">2. Brand</h2>\n<ul class=\"md-list\"><li><strong>产品</strong>：潮汐 TIDE —— 潮汐读数与曲线的产品页，第一版为单页 + 一个可真实交互的曲线。</li><li><strong>受众</strong>：周末出海钓鱼的人、带孩子赶海的家长。他们<strong>已经知道潮汐是什么</strong>，不需要被科普（R3 观察结论）。</li><li><strong>主要任务</strong>：10 秒内看懂&quot;这个 App 能告诉我今天什么时候能下水&quot;，并愿意试。</li><li><strong>目标载体</strong>：移动端优先的网页（375×812 为首要视口），桌面 1440×900 为次要视口。户外强光与夜间清晨是两种真实使用环境。</li><li><strong>内容现实</strong>：</li><li>数据是<strong>本地生成的演示数据</strong>（半日潮正弦叠加），<strong>不是真实潮汐预报</strong>。任何&quot;预报&quot;字样必须伴随演示标注（A3）。</li><li>语言：<strong>中文为主，不做双语</strong>（门A 裁决）。</li><li>不接真实数据源（D1 NOAA 本版排除；其授权状态未明文核实）。</li><li><strong>非目标</strong>：账号系统、多语言、真实数据接入、后端。</li></ul>\n<h2 class=\"md-h2\">3. Style foundations</h2>\n<h3 class=\"md-h3\">3.1 Color — 语义 token</h3>\n<p class=\"md-p\">底色按门A A1 定为 <code class=\"md-code\">#0d2431</code>（相对亮度 <strong>0.01569</strong>），高于方向稿 <code class=\"md-code\">#071a24</code>（0.00911），满足&quot;不暗于 <code class=\"md-code\">#0d2431</code> 级别&quot;。</p>\n<p class=\"md-p\"><strong>Surface 阶梯</strong>（借鉴 R2 的四级层次机制，色值自算）：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>Token</th><th>值</th><th>相对亮度</th><th>与 canvas 的对比度</th><th>用途</th></tr></thead><tbody><tr><td><code class=\"md-code\">--surface-canvas</code></td><td><code class=\"md-code\">#0d2431</code></td><td>0.01569</td><td>1.000</td><td>页面底色（A1 定值）</td></tr><tr><td><code class=\"md-code\">--surface-1</code></td><td><code class=\"md-code\">#102937</code></td><td>0.01972</td><td>1.061</td><td>曲线绘图区背景、极性反转分区带</td></tr><tr><td><code class=\"md-code\">--surface-2</code></td><td><code class=\"md-code\">#132f3d</code></td><td>0.02508</td><td>1.143</td><td>场景卡、读数面板</td></tr><tr><td><code class=\"md-code\">--surface-3</code></td><td><code class=\"md-code\">#163646</code></td><td>0.03251</td><td>1.256</td><td>高低潮标注 chip、悬浮层</td></tr></tbody></table></div>\n<p class=\"md-p\"><strong>文字与前景 token</strong>（每个值都在其上可能出现的<strong>全部四个 surface</strong> 上计算）：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>Token</th><th>值</th><th>canvas</th><th>surface-1</th><th>surface-2</th><th>surface-3</th><th>结论</th></tr></thead><tbody><tr><td><code class=\"md-code\">--text-primary</code></td><td><code class=\"md-code\">#e8f1f4</code></td><td><strong>13.94:1</strong></td><td>13.14:1</td><td>12.20:1</td><td>11.10:1</td><td>全通过 ≥7:1</td></tr><tr><td><code class=\"md-code\">--text-secondary</code></td><td><code class=\"md-code\">#b6cbd4</code></td><td><strong>9.50:1</strong></td><td>8.95:1</td><td>8.31:1</td><td><strong>7.56:1</strong></td><td>全通过 ≥7:1</td></tr><tr><td><code class=\"md-code\">--accent</code></td><td><code class=\"md-code\">#5ee0d4</code></td><td><strong>9.96:1</strong></td><td>9.39:1</td><td>8.72:1</td><td>7.93:1</td><td>全通过 ≥7:1</td></tr><tr><td><code class=\"md-code\">--caution</code>（演示标注）</td><td><code class=\"md-code\">#f2c14e</code></td><td><strong>9.52:1</strong></td><td>8.97:1</td><td>8.33:1</td><td>7.58:1</td><td>全通过 ≥7:1</td></tr><tr><td><code class=\"md-code\">--text-disabled</code></td><td><code class=\"md-code\">#7b93a0</code></td><td><strong>4.97:1</strong></td><td>—</td><td>—</td><td>—</td><td><strong>未达 7:1，见下方例外声明</strong></td></tr></tbody></table></div>\n<p class=\"md-p\"><strong>非文字 token</strong>（WCAG 1.4.11 非文字对比度 ≥ 3:1）：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>Token</th><th>值</th><th>canvas</th><th>surface-1</th><th>surface-2</th><th>surface-3</th><th>用途</th></tr></thead><tbody><tr><td><code class=\"md-code\">--border-strong</code></td><td><code class=\"md-code\">#4a8fa8</code></td><td>4.40:1</td><td>4.15:1</td><td>3.85:1</td><td><strong>3.51:1</strong></td><td>range 轨道可见边界、输入类控件边界</td></tr><tr><td><code class=\"md-code\">--focus-ring</code></td><td><code class=\"md-code\">#5ee0d4</code></td><td>9.96:1</td><td>9.39:1</td><td>8.72:1</td><td>7.93:1</td><td>焦点环（= <code class=\"md-code\">--accent</code>）</td></tr><tr><td><code class=\"md-code\">--hairline</code></td><td><code class=\"md-code\">#2a5a72</code></td><td>2.13:1</td><td>2.01:1</td><td>1.87:1</td><td>1.70:1</td><td>1px 分隔线（纯装饰，不承载信息）</td></tr><tr><td><code class=\"md-code\">--gridline</code></td><td><code class=\"md-code\">#20495e</code></td><td>1.66:1</td><td>1.56:1</td><td>1.45:1</td><td>1.32:1</td><td>曲线网格（纯装饰）</td></tr></tbody></table></div>\n<p class=\"md-p\"><strong>配对 token（实心底上的文字）</strong>：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>组合</th><th>对比度</th></tr></thead><tbody><tr><td><code class=\"md-code\">#0d2431</code> 文字在 <code class=\"md-code\">--accent #5ee0d4</code> 实心主按钮上</td><td><strong>9.96:1</strong></td></tr><tr><td><code class=\"md-code\">#0d2431</code> 文字在 <code class=\"md-code\">--caution #f2c14e</code> 实心演示徽章上</td><td><strong>9.52:1</strong></td></tr></tbody></table></div>\n<p class=\"md-p\"><strong>渐变填充上限（硬性）</strong>：曲线下方填充用 <code class=\"md-code\">--accent</code> 从 <strong>opacity 0.10</strong> 线性衰减到 0（在 surface-1 上）。0.10 时混合色为 <code class=\"md-code\">#183b47</code>，其上 <code class=\"md-code\">--text-primary</code> 10.44:1、<code class=\"md-code\">--text-secondary</code> <strong>7.11:1</strong>。<strong>不得高于 0.10</strong>：0.12 时 <code class=\"md-code\">--text-secondary</code> 降到 6.74:1，跌破 7:1。</p>\n<p class=\"md-p\"><strong><code class=\"md-code\">--text-disabled</code> 例外声明（诚实标注）</strong>：<code class=\"md-code\">#7b93a0</code> 在 canvas 上为 <strong>4.97:1</strong>，未达本契约 7:1 的正文门槛。理由是 WCAG 对 disabled 控件不设对比度要求，且该 token <strong>只允许用于已禁用控件</strong>，不得用于任何需要阅读的内容。若实现阶段发现它被用在了可读文本上，即为缺陷。</p>\n<h3 class=\"md-h3\">3.2 Type</h3>\n<p class=\"md-p\"><strong>纯系统字体栈（门B Q1 裁决，不引入任何 web 字体）</strong>：</p>\n<ul class=\"md-list\"><li>中文 / 正文（reading）：<code class=\"md-code\">-apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif</code></li><li>数字 / 读数（instrumentation）：<code class=\"md-code\">ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace</code></li><li>数字必须同时声明 <code class=\"md-code\">font-variant-numeric: tabular-nums;</code> 与 <code class=\"md-code\">font-feature-settings: &quot;tnum&quot; 1;</code>（<strong>B1</strong>）</li></ul>\n<p class=\"md-p\"><strong>字阶（模块化，大标题用 clamp() 流体）</strong>：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>角色</th><th>字号</th><th>行高</th><th>字距</th><th>字体</th></tr></thead><tbody><tr><td>Display（首屏主张）</td><td><code class=\"md-code\">clamp(28px, 6vw, 40px)</code></td><td>1.2</td><td><code class=\"md-code\">-0.02em</code></td><td>中文栈</td></tr><tr><td>Heading（分屏标题）</td><td><code class=\"md-code\">clamp(20px, 4vw, 28px)</code></td><td>1.3</td><td><code class=\"md-code\">-0.01em</code></td><td>中文栈</td></tr><tr><td><strong>Reading（潮位读数）</strong></td><td><code class=\"md-code\">clamp(40px, 12vw, 56px)</code></td><td>1.0</td><td><code class=\"md-code\">-0.02em</code></td><td><strong>数字栈 + tabular-nums</strong></td></tr><tr><td>Body</td><td><code class=\"md-code\">16px</code></td><td>1.6</td><td><code class=\"md-code\">0</code></td><td>中文栈</td></tr><tr><td>Label / 单位</td><td><code class=\"md-code\">13px</code></td><td>1.4</td><td><code class=\"md-code\">0.01em</code></td><td>中文栈；纯数字单位用数字栈</td></tr><tr><td>Micro（徽章、刻度）</td><td><code class=\"md-code\">12px</code></td><td>1.3</td><td><code class=\"md-code\">0.02em</code></td><td>视内容</td></tr></tbody></table></div>\n<p class=\"md-p\"><strong>读数不跳动规则（B1 的可测形式）</strong>：<code class=\"md-code\">.tide-readout</code> 与所有时间/潮位数字必须用数字栈 + <code class=\"md-code\">tabular-nums</code>，且读数容器设 <code class=\"md-code\">min-width</code>（按最大字宽 <code class=\"md-code\">--readout-min-ch: 6ch</code> 预留），使 0.00→9.99 的数值变化不引起横向重排。</p>\n<h3 class=\"md-h3\">3.3 Spacing</h3>\n<ul class=\"md-list\"><li>基准 <strong>4px</strong>，默认步进 <strong>8px</strong>。</li><li>刻度：<code class=\"md-code\">4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 96</code>。</li><li>分屏纵向内边距：<code class=\"md-code\">clamp(48px, 10vw, 96px)</code>。</li><li>内容最大宽度 <code class=\"md-code\">1120px</code>，正文列最大 <code class=\"md-code\">68ch</code>。</li><li><strong>不出现&quot;卡片套卡片&quot;</strong>：一个 section 内最多一层 <code class=\"md-code\">--surface-2</code> 卡片。</li></ul>\n<h3 class=\"md-h3\">3.4 Depth</h3>\n<ul class=\"md-list\"><li><strong>不使用 box-shadow 表达层级。</strong> 层级由 surface 阶梯 + 1px hairline 承担（R2 的层次机制）。</li><li><strong>禁止玻璃拟态与 backdrop-filter 堆叠</strong>（DIRECTION 明确禁止，且属 anti-pattern）。</li><li>唯一允许的&quot;环&quot;是焦点环：<code class=\"md-code\">2px solid var(--focus-ring)</code> + <code class=\"md-code\">outline-offset: 2px</code>。</li><li>曲线绘图区以 <code class=\"md-code\">--surface-1</code> 底 + <code class=\"md-code\">--hairline</code> 边框与页面区分，不加阴影。</li></ul>\n<h3 class=\"md-h3\">3.5 Radius</h3>\n<p class=\"md-p\"><code class=\"md-code\">--radius-sm: 4px</code>（徽章、chip）／<code class=\"md-code\">--radius-md: 8px</code>（按钮、输入）／<code class=\"md-code\">--radius-lg: 12px</code>（场景卡、绘图区外框）。不使用全圆角药丸形按钮，不使用&quot;大图标 + 圆角&quot;的 hero 模板。</p>\n<h3 class=\"md-h3\">3.6 Motion — 具名预设（取自 <code class=\"md-code\">motion-contract.md</code>，不自定义弹簧参数）</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>动作</th><th>触发</th><th>初始 → 最终</th><th>动画属性</th><th>预设</th><th>为什么用这个预设</th></tr></thead><tbody><tr><td>游标 + 读数跟随时间轴</td><td>拖动 / 方向键改值</td><td>当前位置 → 新值对应位置</td><td><code class=\"md-code\">transform: translateX()</code>、读数文本（瞬时）</td><td><strong>snappy</strong>（stiffness 400 / damping 30 / mass 0.8）</td><td>高频直接操作，必须即时响应、不可滞后；motion-contract 将 snappy 指定给&quot;频繁控件&quot;</td></tr><tr><td>时间轴松开后吸附到最近刻度</td><td><code class=\"md-code\">change</code> / <code class=\"md-code\">pointerup</code></td><td>当前值 → 最近刻度</td><td><code class=\"md-code\">transform: translateX()</code></td><td><strong>snappy</strong>（同上）</td><td>同为高频控件；吸附是状态变化，不是装饰</td></tr><tr><td>曲线入场描线（draw-on）</td><td>首次进入视口</td><td><code class=\"md-code\">stroke-dashoffset: 1</code> → <code class=\"md-code\">0</code></td><td><code class=\"md-code\">stroke-dashoffset</code></td><td><strong>elegant</strong>（stiffness 100 / damping 20 / mass 1）</td><td>大面积媒体的首次呈现，需要平滑落定；snappy 会显得仓促</td></tr><tr><td>分区带 / 场景卡组入场</td><td>进入视口</td><td><code class=\"md-code\">opacity 0</code> + <code class=\"md-code\">translateY(12px)</code> + <code class=\"md-code\">blur(4px)</code> → 最终态</td><td><code class=\"md-code\">opacity</code>、<code class=\"md-code\">transform</code>、<code class=\"md-code\">filter</code></td><td><strong>elegant</strong> + stagger <strong>0.06s</strong></td><td>motion-contract 微编排规定 0.04–0.08s，0.06s 为起点；只作用于有界可见组（3 张卡），不作用于长列表</td></tr><tr><td>CTA / 场景卡 hover</td><td><code class=\"md-code\">pointer: fine</code> 悬停</td><td><code class=\"md-code\">scale 1.02</code>、<code class=\"md-code\">translateY(-2px)</code></td><td><code class=\"md-code\">transform</code></td><td><strong>snappy</strong></td><td>motion-contract 规定 hover 反馈 onset ≤150ms、scale 1.01–1.03、translateY −2px，用 Snappy</td></tr><tr><td>可按压控件按下</td><td>pointerdown / keydown active</td><td><code class=\"md-code\">scale 0.98</code></td><td><code class=\"md-code\">transform</code></td><td><strong>snappy</strong></td><td>motion-contract 规定按压约 0.98，且键盘 active 须有等价状态</td></tr><tr><td>当前时刻标记脉冲</td><td>持续（<strong>全页唯一循环动画</strong>）</td><td><code class=\"md-code\">opacity 0.55</code> ↔ <code class=\"md-code\">1.0</code>，周期 2400ms</td><td><code class=\"md-code\">opacity</code></td><td><strong>不用弹簧</strong>（弹簧用于状态位移，不用于循环）；用 <code class=\"md-code\">cubic-bezier(0.16, 1, 0.3, 1)</code> 的非空间缓动</td><td>循环动画不是状态变化；motion-contract 的循环例外只允许 loading 旋转，此处为数据位置提示，故限定为纯透明度且必须可降级</td></tr><tr><td>减少动效（<code class=\"md-code\">prefers-reduced-motion: reduce</code>）</td><td>全站</td><td>—</td><td>移除描线、位移、blur、stagger、脉冲；<code class=\"md-code\">opacity</code> 直接到最终值</td><td>无</td><td>motion-contract：移除空间移动与不必要循环，直接呈现语义最终态</td></tr></tbody></table></div>\n<p class=\"md-p\"><strong>不使用 <code class=\"md-code\">playful</code>（280/18/1.2）</strong>：本页是数据仪表，读数与游标需要精确落定；弹跳会干扰读数可读性。motion-contract 明确允许在 bounce 会分散注意或损害可读性时改用 Snappy 或 Elegant——此处是适用该例外的情形。</p>\n<p class=\"md-p\"><strong>被禁止的动效写法</strong>：<code class=\"md-code\">transition: all</code>；泛型 <code class=\"md-code\">ease</code>；线性 UI 位移（<code class=\"md-code\">linear</code> 只允许用于 loading 旋转）；动画布局属性（<code class=\"md-code\">width</code>/<code class=\"md-code\">height</code>/<code class=\"md-code\">top</code>/<code class=\"md-code\">left</code>）；对同一物理弹簧同时指定 <code class=\"md-code\">duration</code>。</p>\n<h2 class=\"md-h2\">4. Accessibility</h2>\n<ul class=\"md-list\"><li><strong>对比度目标</strong>：正文与读数 <strong>≥ 7:1</strong>（A1 的门槛，高于 WCAG AA 的 4.5:1，为户外强光留余量）。非文字控件边界 ≥ 3:1。上表已逐项给出实测值。</li><li><strong>键盘路径（A4 / B3）</strong>：</li><li><code class=\"md-code\">Tab</code> 进入时间轴控件（<code class=\"md-code\">input[type=range]</code>）→ 可见焦点环 <code class=\"md-code\">2px solid #5ee0d4</code> + <code class=\"md-code\">outline-offset: 2px</code>，在全部四个 surface 上对比度 ≥ 7.93:1。</li><li><code class=\"md-code\">ArrowLeft</code> / <code class=\"md-code\">ArrowRight</code> = ±1 步（<strong>10 分钟</strong>）；<code class=\"md-code\">PageUp</code> / <code class=\"md-code\">PageDown</code> = ±6 步（1 小时）；<code class=\"md-code\">Home</code> / <code class=\"md-code\">End</code> = 00:00 / 24:00。</li><li>改值时读数通过 <code class=\"md-code\">role=&quot;status&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;</code> 播报，形如&quot;14:20，潮位 1.32 米，涨潮中&quot;。</li><li><code class=\"md-code\">Tab</code> 离开控件后，曲线保留最后位置，不重置。</li><li><strong>视觉隐藏规则（A4 / B3，硬性）</strong>：range 控件<strong>不得</strong>使用 <code class=\"md-code\">display: none</code> 或 <code class=\"md-code\">visibility: hidden</code>（会使控件失去可聚焦性与可操作性）。允许的写法：控件保持 <code class=\"md-code\">position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; appearance: none; cursor: pointer; touch-action: none;</code>，覆盖在 SVG 绘图区之上；或 <code class=\"md-code\">appearance: none</code> 后以自定义轨道绘制但保留在布局中。两种写法都必须保留原生键盘行为与可见焦点环（焦点环画在容器上，由 <code class=\"md-code\">:focus-visible</code> 驱动）。</li><li><strong>触控</strong>：所有可点目标 ≥ 44×44 CSS px。range 的命中区域高度 = 绘图区高度（≥ 200px），不缩到滑块的视觉尺寸。</li><li><strong>减少动效结果</strong>：<code class=\"md-code\">prefers-reduced-motion: reduce</code> 下，曲线直接以最终形态呈现（无描线），无 pulse，无 stagger，无位移；读数仍然随键盘改值即时更新（连续直接操作不属于被禁止的过渡动画）。</li><li><strong>语言</strong>：<code class=\"md-code\">&lt;html lang=&quot;zh-CN&quot;&gt;</code>。数字用 <code class=\"md-code\">lang=&quot;en&quot;</code> 局部标注或直接依赖数字栈，避免中文标点影响数字排版。页面不做双语。</li><li><strong>文字缩放</strong>：布局在浏览器文字缩放至 <strong>200%</strong> 时不出现横向滚动、遮挡或裁切；读数与曲线保持可读。</li><li><strong>不依赖颜色传达信息</strong>：涨潮/退潮同时用文字标签（&quot;涨潮中&quot;/&quot;退潮中&quot;），不只用颜色。演示数据状态同时用文字徽章，不只靠 <code class=\"md-code\">--caution</code> 颜色。</li></ul>\n<h2 class=\"md-h2\">5. Writing tone</h2>\n<ul class=\"md-list\"><li><strong>语气</strong>：直接、给数、不说教。受众是懂潮汐的人，不解释潮汐是什么。</li><li><strong>用词</strong>：说&quot;潮位&quot;&quot;退潮前两小时&quot;&quot;几点能下水&quot;，不说&quot;探索海洋的奥秘&quot;。</li><li><strong>&quot;预报&quot;一词的硬性规则（A3）</strong>：全站<strong>默认不使用</strong>&quot;预报&quot;字样，改用&quot;潮位读数&quot;&quot;潮汐曲线&quot;。<strong>若任何位置出现&quot;预报&quot;二字</strong>（含 <code class=\"md-code\">&lt;title&gt;</code>、meta description、正文、按钮、图片 alt），必须在<strong>同一视觉块内、与&quot;预报&quot;字样的垂直间距 ≤ 8px</strong> 处放置 <code class=\"md-code\">&lt;DemoDataBadge&gt;</code>，文案为「演示数据」，不得只放在页脚。</li><li><strong>演示标注的完整清单（A3 可测）</strong>：以下位置必须出现演示标注——① 首屏读数块旁；② 曲线绘图区标题或右上角；③ 任何含&quot;预报&quot;的句子旁；④ 页脚下载区；⑤ 场景卡中引用的任何具体时刻/潮位数值旁。</li><li><strong>CTA 框架（attention → interest → desire → action）</strong>：</li><li>主 CTA：<code class=\"md-code\">看今天的潮汐</code>（action 指向页面内的曲线，不是下载）。</li><li>次 CTA（页脚）：<code class=\"md-code\">下载 App（演示）</code>——括号内的&quot;演示&quot;是文案的一部分，不是可选装饰。</li><li>首屏主张必须含<strong>具体收益</strong>与<strong>今日读数</strong>，不用&quot;重新定义潮汐体验&quot;这类空话。</li><li><strong>数字写法</strong>：潮位保留 2 位小数 + 单位（<code class=\"md-code\">1.32 米</code>）；时间用 24 小时制（<code class=\"md-code\">14:20</code>），与海钓人群的日常一致。</li><li><strong>不出现</strong>：感叹号堆叠、emoji、&quot;立即&quot;&quot;马上&quot;式催促、无法证伪的形容词（&quot;极致&quot;&quot;丝滑&quot;&quot;沉浸式&quot;）。</li></ul>\n<h2 class=\"md-h2\">6. Rules: Do</h2>\n<ol class=\"md-list\"><li>底色固定 <code class=\"md-code\">--surface-canvas: #0d2431</code>；一切层次靠 <code class=\"md-code\">--surface-1/2/3</code> 阶梯（每级与 canvas 对比度 1.061 / 1.143 / 1.256）。</li><li>正文与读数用 <code class=\"md-code\">--text-primary #e8f1f4</code>（canvas 上 13.94:1）；次要文字用 <code class=\"md-code\">--text-secondary #b6cbd4</code>（canvas 上 9.50:1，最亮的 surface-3 上仍 7.56:1）。</li><li>强调色 <code class=\"md-code\">--accent #5ee0d4</code> <strong>只用于三处</strong>：数据本体（曲线描边、当前读数、游标高亮）、焦点环、唯一的主 CTA 填充。<strong>其他一律不用</strong>（R1 的关系）。</li><li>所有数字用 <code class=\"md-code\">ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace</code> + <code class=\"md-code\">tabular-nums</code>，读数容器预留 <code class=\"md-code\">6ch</code> 最小宽度（B1）。</li><li>时间轴是真正的 <code class=\"md-code\">input[type=range]</code>，<code class=\"md-code\">min=0 max=144 step=1</code>（每步 10 分钟，覆盖 00:00–24:00），可聚焦、可方向键操作（A4）。</li><li>首屏在 <strong>375×812 不滚动</strong> 的区域内完整呈现：品牌、一句主张、<strong>今日潮位读数（数字 + 单位 + 涨/退潮状态）</strong>、主 CTA（A2）。读数是静态渲染的，不依赖滚动触发或动画完成。</li><li>任何&quot;预报&quot;字样旁 ≤8px 内必须有「演示数据」徽章（A3）；徽章为 <code class=\"md-code\">--caution</code> 实心或描边，文字对比度 ≥ 7:1。</li><li>曲线的高潮/低潮在曲线上<strong>直接标注时刻与潮位</strong>（R3 的行业惯例），不靠图例解释。</li><li>第三屏展示<strong>曲线的实际用法</strong>：用真实读数给出判断（如&quot;退潮前两小时是赶海窗口&quot;），数值必须来自页面同一份演示数据（B2/R3 修正）。</li><li>键盘焦点环始终可见：<code class=\"md-code\">2px solid #5ee0d4</code>，<code class=\"md-code\">outline-offset: 2px</code>，在 <code class=\"md-code\">:focus-visible</code> 下触发。</li><li>层级用 1px <code class=\"md-code\">--hairline</code> 与 surface 阶梯表达，不用阴影、不用玻璃拟态。</li><li>动效只引用 <code class=\"md-code\">motion-contract.md</code> 的具名预设：snappy（高频控件）、elegant（大面积入场）；循环动画只有当前时刻脉冲一个。</li><li><code class=\"md-code\">prefers-reduced-motion: reduce</code> 下移除描线、位移、blur、stagger、脉冲，直接给最终态。</li><li>触控目标 ≥ 44×44px；range 的命中区覆盖整个绘图区。</li><li>用文字 + 数字 + 图标共同表达状态，不依赖颜色单独承载信息。</li></ol>\n<h2 class=\"md-h2\">7. Rules: Don&#39;t</h2>\n<p class=\"md-p\">对照 <code class=\"md-code\">design-contract.md</code> 的 anti-pattern 清单，本方向明确禁止：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>维度</th><th>禁止项</th><th>依据</th></tr></thead><tbody><tr><td>Type</td><td>把等宽字体当&quot;科技感&quot;装饰用于正文；把 Inter/Roboto/Arial 当品牌表达；&quot;大图标 + 标题 + 圆角&quot;的模板式 hero</td><td>design-contract anti-pattern 表</td></tr><tr><td>Color</td><td>纯黑 <code class=\"md-code\">#000</code> 或纯白 <code class=\"md-code\">#fff</code> 作底；<strong>cyan-on-dark 的 AI 味配色</strong>——因此强调色必须限定在&quot;数据 + 焦点环 + 单一 CTA&quot;三处，且底色是带蓝的中性深色而非黑；默认深色 + 辉光；紫色渐变；霓虹描边</td><td>同上；DIRECTION 禁止渐变球</td></tr><tr><td>Color</td><td><strong>照搬上游品牌色值</strong>（linear <code class=\"md-code\">#010102</code> / <code class=\"md-code\">ink-subtle #8a8f98</code>、vercel <code class=\"md-code\">#888888</code>）</td><td>A1 + R1/R2 实测：<code class=\"md-code\">#8a8f98</code> 仅 6.42:1、<code class=\"md-code\">#888888</code> 仅 3.54:1，均不达标</td></tr><tr><td>Color</td><td>弱化文字凭观感取色而不计算</td><td>R2 实测 <code class=\"md-code\">#888888</code> 3.54:1 为反面教材</td></tr><tr><td>Space</td><td>卡片到处用、卡片套卡片；hero-metric 模板；一切居中</td><td>design-contract anti-pattern 表</td></tr><tr><td>Depth</td><td>玻璃拟态、backdrop-filter 堆叠、用 box-shadow 表达层级</td><td>DIRECTION 明确禁止</td></tr><tr><td>Motion</td><td>动画布局属性（<code class=\"md-code\">width</code>/<code class=\"md-code\">height</code>/<code class=\"md-code\">top</code>/<code class=\"md-code\">left</code>）；到处用 bounce/elastic；<code class=\"md-code\">transition: all</code>；泛型 <code class=\"md-code\">ease</code>；线性 UI 位移；对同一弹簧同时给 duration</td><td>motion-contract</td></tr><tr><td>Motion</td><td>使用 <code class=\"md-code\">playful</code> 弹簧</td><td>数据仪表读数需精确落定，弹跳损害可读性</td></tr><tr><td>Interaction</td><td>每个按钮都是主按钮；重复信息</td><td>design-contract anti-pattern 表</td></tr><tr><td>Interaction</td><td>用纯鼠标拖拽的 <code class=\"md-code\">div</code> 作时间轴；用 <code class=\"md-code\">display:none</code> / <code class=\"md-code\">visibility:hidden</code> 隐藏 range</td><td>A4 + <strong>B3</strong>（会使控件失去可聚焦性）</td></tr><tr><td>Interaction</td><td>用颜色单独传达涨/退潮或演示数据状态</td><td>WCAG 1.4.1；本契约 Do #15</td></tr><tr><td>Responsive</td><td>在移动端隐藏曲线或读数</td><td>design-contract anti-pattern 表；A2 要求首屏见读数</td></tr><tr><td>Content</td><td>解释潮汐原理、科普&quot;一天两次涨落&quot;</td><td>R3 观察：目标用户不需要被科普，第三屏改为展示曲线用法</td></tr><tr><td>Content</td><td>出现&quot;预报&quot;而不标演示数据</td><td><strong>A3</strong></td></tr><tr><td>Asset</td><td>引用 Tide Guide 的任何截图/图标/文案/配色；使用 Unsplash/Pexels 海景照片；使用 unDraw 插画</td><td>R3 reference-only；曲线本身就是 hero，加照片会稀释数据优先定位</td></tr><tr><td>Asset</td><td>引入 JetBrains Mono / Noto Sans SC / 任何 web 字体文件</td><td>门B Q1 裁决</td></tr><tr><td>Asset</td><td>声称与 Linear / Vercel / Warp 存在关联</td><td>三者均为第三方 MIT 分析文档，非官方规范</td></tr></tbody></table></div>\n<h2 class=\"md-h2\">8. Output structure</h2>\n<p class=\"md-p\">单页产品页，五个纵向 section，移动端单列：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>#</th><th>Section</th><th>内容</th><th>关键约束</th></tr></thead><tbody><tr><td>1</td><td><code class=\"md-code\">Hero</code></td><td>品牌标记 + 一句价值主张 + <strong>今日潮位读数</strong>（数字 + 单位 + 涨/退潮文字 + 「演示数据」徽章）+ 主 CTA「看今天的潮汐」</td><td><strong>A2</strong>：375×812 与 1440×900 均不滚动即可见完整读数块</td></tr><tr><td>2</td><td><code class=\"md-code\">TideCurve</code></td><td>自绘 SVG 潮汐曲线 + 覆盖其上的 <code class=\"md-code\">input[type=range]</code> 时间轴 + 跟随读数 + 高低潮标注 + 当前时刻脉冲</td><td><strong>A4/B3</strong>：range 可聚焦、可方向键；<strong>B1</strong>：读数 tabular-nums</td></tr><tr><td>3</td><td><code class=\"md-code\">CurveInUse</code></td><td><strong>展示曲线的实际用法</strong>：2–3 条基于真实读数的判断（如&quot;退潮前两小时是赶海窗口，今天是 12:40–14:40&quot;），数值取自同一份演示数据</td><td><strong>B2/R3 修正</strong>：不解释潮汐原理</td></tr><tr><td>4</td><td><code class=\"md-code\">Scenarios</code></td><td>海钓 / 赶海 / 摄影 三张场景卡（移动端纵向堆叠，≥1024px 横排三列），每卡含一个 Lucide 图标 + 标题 + 一句收益 + 一个来自演示数据的具体数值</td><td>图标克制，不堆砌</td></tr><tr><td>5</td><td><code class=\"md-code\">Footer</code></td><td>下载引导（<code class=\"md-code\">下载 App（演示）</code>）+ 演示数据声明 + 数据生成方式一句话说明</td><td>标注为演示</td></tr></tbody></table></div>\n<p class=\"md-p\"><strong>必需的媒体与资产</strong>：自绘 SVG 曲线（无外部图表库）、<code class=\"md-code\">lucide-react</code> 图标（仅 sun / moon / waves / map-pin / clock 中按需取用）、系统字体栈。<strong>无图片、无字体文件、无第三方图表库。</strong></p>\n<p class=\"md-p\"><strong>响应式断点策略</strong>：base <code class=\"md-code\">320px</code> / <code class=\"md-code\">640px</code> / <code class=\"md-code\">1024px</code> / <code class=\"md-code\">1280px</code>。</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>范围</th><th>曲线绘图区高</th><th>场景卡</th><th>首屏读数</th></tr></thead><tbody><tr><td>&lt; 640</td><td>200px</td><td>1 列堆叠</td><td>完整可见（A2 关键视口）</td></tr><tr><td>640–1023</td><td>240px</td><td>1 列堆叠</td><td>完整可见</td></tr><tr><td>1024–1279</td><td>280px</td><td>3 列</td><td>完整可见</td></tr><tr><td>≥ 1280</td><td>320px</td><td>3 列</td><td>完整可见</td></tr></tbody></table></div>\n<h2 class=\"md-h2\">9. Component expectations</h2>\n<h3 class=\"md-h3\">9.1 <code class=\"md-code\">TideCurve</code>（自绘 SVG）</h3>\n<ul class=\"md-list\"><li><strong>数据</strong>：<code class=\"md-code\">h(t) = 1.50 + 1.15·sin(2πt/12.42 + φ₁) + 0.35·sin(2πt/12.00 + φ₂)</code>（米，相对最低低潮面），t 为当日小时数，采样 145 点（00:00–24:00，每 10 分钟一点）。</li><li><strong>基准面偏移（实现期补注，2026-09-16）</strong>：常数项 <code class=\"md-code\">1.50 = 1.15 + 0.35</code>（两个分潮振幅之和）。原式未含此项时，纯正弦叠加会取负值，而&quot;相对最低低潮面&quot;按定义不为负——原文公式与文字自相矛盾。加偏移后曲线全程 ≥0，最低点 0.09 m。裁决见 <code class=\"md-code\">IMPLEMENTATION-DECISIONS.md</code> 第 1 条。</li><li><strong>状态</strong>：</li><li><strong>默认</strong>：曲线描边 <code class=\"md-code\">--accent</code> 2px，在 <code class=\"md-code\">--surface-1</code> 上对比度 9.39:1；下方渐变填充 <code class=\"md-code\">--accent</code> opacity 0.10 → 0；网格 <code class=\"md-code\">--gridline</code> 1px；高低潮 chip 用 <code class=\"md-code\">--surface-3</code> 底 + <code class=\"md-code\">--text-primary</code>（11.10:1）。</li><li><strong>拖动中</strong>：游标 <code class=\"md-code\">translateX</code> 用 snappy 跟随；读数同步更新（文本更新是瞬时语义变化，不加过渡）；拖动期间禁止触发入场编排重放。</li><li><strong>焦点</strong>：绘图区容器获得 <code class=\"md-code\">:focus-visible</code> 时显示 <code class=\"md-code\">2px solid #5ee0d4</code> + <code class=\"md-code\">outline-offset: 2px</code>；range 保持可聚焦。</li><li><strong>减少动效</strong>：无描线、无脉冲；曲线直接呈现最终形态；游标位移瞬时生效（连续直接操作不受动效规则约束）。</li><li><strong>加载</strong>：显示静态骨架（<code class=\"md-code\">--surface-1</code> 底 + <code class=\"md-code\">--gridline</code> 网格 + 一行文字&quot;正在载入今日潮位…&quot;），<strong>不使用旋转 spinner</strong>（motion-contract 允许以进度文案替代旋转反馈）。骨架高度与最终绘图区一致，避免布局跳动。</li><li><strong>空</strong>：数据不可用时显示指导性空态：&quot;今日潮位数据暂不可用。演示数据生成失败——刷新页面可重新生成。&quot; 不显示空白绘图区，不显示假的曲线。</li><li><strong>无障碍</strong>：SVG 加 <code class=\"md-code\">role=&quot;img&quot;</code> 与 <code class=\"md-code\">aria-label</code>，概述当日高低潮时刻；交互语义由 range 承载，不在 SVG 上重复绑定键盘事件。</li></ul>\n<h3 class=\"md-h3\">9.2 <code class=\"md-code\">TideTimeAxis</code>（<code class=\"md-code\">input[type=range]</code>，A4/B3 核心）</h3>\n<ul class=\"md-list\"><li><strong>属性</strong>：<code class=\"md-code\">min=0 max=144 step=1 value=&lt;当前时刻步数&gt;</code>，<code class=\"md-code\">aria-label=&quot;潮汐时间轴，方向键调整，每步 10 分钟&quot;</code>，<code class=\"md-code\">aria-valuetext=&quot;14:20，潮位 1.32 米，退潮中&quot;</code>。</li><li><strong>键盘</strong>：<code class=\"md-code\">ArrowLeft/Right</code> ±1；<code class=\"md-code\">PageUp/PageDown</code> ±6；<code class=\"md-code\">Home/End</code> → 0/144。全部为原生行为，不自行实现。</li><li><strong>状态</strong>：</li><li><strong>默认</strong>：<code class=\"md-code\">opacity: 0</code>，<code class=\"md-code\">position: absolute; inset: 0; width: 100%; height: 100%; appearance: none; cursor: pointer; touch-action: none;</code>，覆盖在 SVG 之上。<strong>不使用 <code class=\"md-code\">display:none</code> 或 <code class=\"md-code\">visibility:hidden</code>（B3）。</strong></li><li><strong>hover / 拖动中</strong>：<code class=\"md-code\">cursor: grabbing</code>；视觉反馈画在 SVG 游标上，不改变 range 本身。</li><li><strong>焦点</strong>：<code class=\"md-code\">:focus-visible</code> 在容器上绘制 <code class=\"md-code\">2px solid #5ee0d4</code>，offset 2px；焦点环在全部 surface 上 ≥ 7.93:1。</li><li><strong>禁用</strong>：<code class=\"md-code\">disabled</code> 时轨道边界用 <code class=\"md-code\">--border-strong</code>（canvas 上 4.40:1），文字用 <code class=\"md-code\">--text-disabled #7b93a0</code>（4.97:1，例外见 3.1），且<strong>不做任何动效</strong>。</li><li><strong>减少动效</strong>：行为不变（键盘操作不是动画）；只移除游标的弹簧跟随，改为瞬时定位。</li></ul>\n<h3 class=\"md-h3\">9.3 <code class=\"md-code\">TideReadout</code>（读数）</h3>\n<ul class=\"md-list\"><li><strong>内容</strong>：<code class=\"md-code\">14:20</code>（数字栈）+ <code class=\"md-code\">1.32 米</code>（数字栈，tabular-nums）+ <code class=\"md-code\">退潮中</code>（中文栈文字标签，不只靠颜色）。</li><li><strong>B1 实现</strong>：<code class=\"md-code\">font-variant-numeric: tabular-nums</code> + <code class=\"md-code\">font-feature-settings: &quot;tnum&quot; 1</code>；容器 <code class=\"md-code\">min-width: 6ch</code>（<code class=\"md-code\">--readout-min-ch</code>），使 0.00→9.99 变化不引起重排。</li><li><strong>状态</strong>：默认 / 拖动中（即时更新）/ 焦点（随控件）/ 减少动效（不变）/ 加载（显示 <code class=\"md-code\">—.— 米</code> 占位，宽度与终值一致）/ 空（显示 <code class=\"md-code\">暂无数据</code>）。</li><li><strong>无障碍</strong>：<code class=\"md-code\">role=&quot;status&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;</code>，播报整句而非碎片。</li></ul>\n<h3 class=\"md-h3\">9.4 <code class=\"md-code\">NowMarker</code>（当前时刻标记）</h3>\n<ul class=\"md-list\"><li><strong>状态</strong>：默认（<code class=\"md-code\">--text-primary</code> 描边圆点，在 <code class=\"md-code\">--surface-1</code> 上 13.14:1）；脉冲中（<code class=\"md-code\">opacity 0.55 ↔ 1.0</code>，周期 2400ms，<code class=\"md-code\">cubic-bezier(0.16,1,0.3,1)</code>，全页唯一循环动画）；减少动效（静态，opacity 1）；加载/空（不渲染）。</li></ul>\n<h3 class=\"md-h3\">9.5 <code class=\"md-code\">HighLowAnnotation</code>（高低潮标注）</h3>\n<ul class=\"md-list\"><li>直接标在曲线峰值/谷值旁：<code class=\"md-code\">6:11</code> / <code class=\"md-code\">1.86 米</code>（R3 的行业惯例）。chip 用 <code class=\"md-code\">--surface-3</code> 底 + <code class=\"md-code\">--text-primary</code>，对比度 11.10:1。窄视口下只保留潮位数值、时刻移入 <code class=\"md-code\">aria-label</code>，<strong>不隐藏信息</strong>（禁止移动端隐藏关键内容）。</li><li>状态：默认 / 被游标遮挡时（chip 自动翻转方向或降低 z-index 让游标在上）/ 减少动效（不变）/ 加载 / 空（不渲染）。</li></ul>\n<h3 class=\"md-h3\">9.6 <code class=\"md-code\">ScenarioCard</code> × 3（海钓 / 赶海 / 摄影）</h3>\n<ul class=\"md-list\"><li><strong>结构</strong>：一个 Lucide 图标（20px，<code class=\"md-code\">--accent</code>）+ 标题（Heading 级）+ 一句收益（Body）+ 一个来自演示数据的具体数值（数字栈 + tabular-nums）。</li><li><strong>状态</strong>：</li><li><strong>默认</strong>：<code class=\"md-code\">--surface-2</code> 底，<code class=\"md-code\">--hairline</code> 1px 边框，<code class=\"md-code\">--text-secondary</code> 正文（8.31:1）。</li><li><strong>hover（仅 <code class=\"md-code\">pointer: fine</code>）</strong>：<code class=\"md-code\">scale 1.02</code> + <code class=\"md-code\">translateY(-2px)</code>，snappy，onset ≤150ms。</li><li><strong>focus-visible</strong>：<code class=\"md-code\">2px solid #5ee0d4</code> 环。</li><li><strong>按压</strong>：<code class=\"md-code\">scale 0.98</code>，snappy；键盘 active 有等价状态。</li><li><strong>减少动效</strong>：hover 位移与缩放移除，只保留边框/底色变化。</li><li><strong>加载</strong>：卡片骨架保持相同高度（避免布局跳动）。</li><li><strong>空</strong>：若某场景的示例数值不可用，显示&quot;今日示例数据不可用&quot;，不留空白。</li><li>三张卡构成一个有界可见组，入场用 elegant + 0.06s stagger；<strong>不在每次重渲染或筛选时重放</strong>。</li></ul>\n<h3 class=\"md-h3\">9.7 <code class=\"md-code\">DemoDataBadge</code>（演示数据徽章，A3 的执行单元）</h3>\n<ul class=\"md-list\"><li><strong>形态</strong>：实心 <code class=\"md-code\">--caution #f2c14e</code> 底 + <code class=\"md-code\">#0d2431</code> 文字，对比度 <strong>9.52:1</strong>；或描边变体（<code class=\"md-code\">--caution</code> 文字在 <code class=\"md-code\">--surface-2</code> 上 8.33:1）。</li><li><strong>文案</strong>：固定「演示数据」四字，可加 <code class=\"md-code\">aria-label=&quot;本页潮位为演示数据，非真实潮汐预报&quot;</code>。</li><li><strong>位置规则（可测）</strong>：与任何&quot;预报&quot;字样的垂直间距 ≤ 8px，且在同一视觉块内。</li><li><strong>状态</strong>：默认 / 加载（不渲染）/ 空（不渲染）。</li></ul>\n<h3 class=\"md-h3\">9.8 <code class=\"md-code\">PrimaryCTA</code> / <code class=\"md-code\">SecondaryCTA</code></h3>\n<ul class=\"md-list\"><li>主：<code class=\"md-code\">--accent</code> 实心底 + <code class=\"md-code\">#0d2431</code> 文字（9.96:1），<code class=\"md-code\">--radius-md</code>，高 ≥ 48px。</li><li>次：透明底 + <code class=\"md-code\">--border-strong</code> 1px 边框（canvas 上 4.40:1）+ <code class=\"md-code\">--text-primary</code> 文字。</li><li>状态：默认 / hover（snappy，onset ≤150ms）/ 按压（scale 0.98）/ focus-visible（焦点环）/ disabled（<code class=\"md-code\">--text-disabled</code>，无动效）/ 加载（宽度不变的进度文案，不用 spinner）。<strong>同一视口内只允许一个主 CTA。</strong></li></ul>\n<h2 class=\"md-h2\">10. Quality gates</h2>\n<p class=\"md-p\">以下为验收阶段逐条执行的检查项，每条都有可复现的方法。对应 <code class=\"md-code\">references/acceptance.md</code> 的功能证据、渲染证据、无障碍与质量三节。</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>#</th><th>检查项</th><th>方法</th><th>通过判据</th></tr></thead><tbody><tr><td>QG1</td><td><strong>A1 底色与正文对比度</strong></td><td>用 WCAG 相对亮度公式计算 <code class=\"md-code\">--text-primary</code> 与 <code class=\"md-code\">--surface-canvas</code></td><td>≥ 7:1（本契约实测 13.94:1）；canvas 相对亮度 ≥ 0.01569</td></tr><tr><td>QG2</td><td><strong>A1 全部文字 token 达标</strong></td><td>对 <code class=\"md-code\">--text-primary</code> / <code class=\"md-code\">--text-secondary</code> / <code class=\"md-code\">--accent</code> / <code class=\"md-code\">--caution</code> × 四个 surface 逐一计算</td><td>全部 ≥ 7:1（最紧一格：<code class=\"md-code\">--text-secondary</code> 在 <code class=\"md-code\">--surface-3</code> 上 7.56:1）</td></tr><tr><td>QG3</td><td><strong>A1 非文字 token 达标</strong></td><td>计算 <code class=\"md-code\">--border-strong</code> / <code class=\"md-code\">--focus-ring</code> × 使用到的 surface</td><td>≥ 3:1（最紧一格：<code class=\"md-code\">--border-strong</code> 在 <code class=\"md-code\">--surface-3</code> 上 3.51:1）</td></tr><tr><td>QG4</td><td><strong>渐变填充上限</strong></td><td>计算 <code class=\"md-code\">--accent</code> 在 surface-1 上 opacity 0.10 的混合色上 <code class=\"md-code\">--text-secondary</code> 的对比度</td><td>≥ 7:1（实测 7.11:1）；代码中填充 opacity 不得超过 0.10</td></tr><tr><td>QG5</td><td><strong>A2 首屏见读数</strong></td><td>在 375×812 与 1440×900 视口下截取首屏（不滚动）</td><td>今日潮位读数（时间 + 潮位值 + 单位 + 涨/退潮文字 + 演示徽章）完整可见，无裁切</td></tr><tr><td>QG6</td><td><strong>A3 &quot;预报&quot;字样标注</strong></td><td>全站文案逐条检索&quot;预报&quot;二字（含 <code class=\"md-code\">&lt;title&gt;</code>、meta、alt）</td><td>每一处都在 ≤8px 内有「演示数据」徽章；无未标注的&quot;预报&quot;</td></tr><tr><td>QG7</td><td><strong>A3 演示标注覆盖</strong></td><td>检查第 5 节列出的 5 个必标位置</td><td>5 处全部存在</td></tr><tr><td>QG8</td><td><strong>A4/B3 range 可聚焦</strong></td><td>代码检索确认无 <code class=\"md-code\">display:none</code> / <code class=\"md-code\">visibility:hidden</code> 作用于时间轴控件</td><td>零命中</td></tr><tr><td>QG9</td><td><strong>A4 键盘走查</strong></td><td>键盘 <code class=\"md-code\">Tab</code> 到时间轴 → 方向键 / PageUp/PageDown / Home/End</td><td>焦点环可见；<code class=\"md-code\">ArrowRight</code> 使读数 +10 分钟；<code class=\"md-code\">Home</code>/<code class=\"md-code\">End</code> 到 00:00/24:00；读数通过 <code class=\"md-code\">aria-live</code> 播报</td></tr><tr><td>QG10</td><td><strong>B1 tabular-nums</strong></td><td>代码检查 + 把读数从 <code class=\"md-code\">0.00</code> 逐步改到 <code class=\"md-code\">9.99</code> 并比较容器宽度</td><td>两处均声明 <code class=\"md-code\">tabular-nums</code>/<code class=\"md-code\">&quot;tnum&quot; 1</code>；读数宽度零变化（截图对比）</td></tr><tr><td>QG11</td><td><strong>B2 第三屏落实</strong></td><td>检查第三屏文案</td><td>不出现潮汐原理解释；每条判断都由页面同一份演示数据的真实数值支撑</td></tr><tr><td>QG12</td><td><strong>曲线全部状态</strong></td><td>逐一触发默认 / 拖动中 / 焦点 / 减少动效 / 加载 / 空</td><td>六个状态均按 9.1 定义呈现；加载与空态不显示假曲线；骨架高度与终态一致，无布局跳动</td></tr><tr><td>QG13</td><td><strong>三张场景卡状态</strong></td><td>触发默认 / hover / focus / 按压 / 减少动效 / 加载 / 空</td><td>均按 9.6 定义呈现；hover 仅在 <code class=\"md-code\">pointer: fine</code> 生效；键盘有等价反馈</td></tr><tr><td>QG14</td><td><strong>焦点环全站可见</strong></td><td>键盘遍历所有可交互元素</td><td>每个元素都有 <code class=\"md-code\">2px solid #5ee0d4</code> 环；环在四个 surface 上 ≥ 3:1（实测 ≥ 7.93:1）</td></tr><tr><td>QG15</td><td><strong>触控目标</strong></td><td>测量所有可点元素与 range 命中区</td><td>全部 ≥ 44×44 CSS px</td></tr><tr><td>QG16</td><td><strong>减少动效</strong></td><td>模拟 <code class=\"md-code\">prefers-reduced-motion: reduce</code> 后重走主流程</td><td>无描线、无位移、无 blur、无 stagger、无脉冲；语义最终态立即呈现；键盘操作仍有效</td></tr><tr><td>QG17</td><td><strong>动效中断与反转</strong></td><td>在曲线描线中途快速滚动离开再返回；快速来回拖动时间轴</td><td>语义状态正确，无卡死，不扣留输入；未出现两套动画系统写同一 transform</td></tr><tr><td>QG18</td><td><strong>200% 文字缩放</strong></td><td>浏览器文字缩放至 200%</td><td>无横向滚动、无遮挡、无裁切；读数与曲线可读</td></tr><tr><td>QG19</td><td><strong>响应式矩阵</strong></td><td>375×812、768×1024、1440×900，加 320px 窄宽</td><td>无重叠、无裁切标签、无 body 级横向滚动、主 CTA 不被隐藏；曲线与读数在全部宽度可见（禁止移动端隐藏关键功能）</td></tr><tr><td>QG20</td><td><strong>字体回退</strong></td><td>在无 SF Mono 的环境渲染</td><td>回退到 Menlo / Consolas / 通用 monospace，读数仍等宽对齐，无布局破坏</td></tr><tr><td>QG21</td><td><strong>素材边界</strong></td><td>检索产物中是否含 Tide Guide 素材、品牌色值照搬、外部字体/图片</td><td>零命中；无任何品牌关联声明</td></tr><tr><td>QG22</td><td><strong>无禁用写法</strong></td><td>代码检索 <code class=\"md-code\">transition: all</code>、泛型 <code class=\"md-code\">ease</code>、动画布局属性、<code class=\"md-code\">playful</code> 弹簧</td><td>零命中</td></tr><tr><td>QG23</td><td><strong>主 CTA 唯一</strong></td><td>每个视口内统计主按钮数量</td><td>≤ 1</td></tr><tr><td>QG24</td><td><strong>自动化无障碍检查</strong></td><td>运行可用的自动化检查工具</td><td>报告实际覆盖率与全部发现；<strong>不作为人工检查的替代</strong></td></tr></tbody></table></div>\n<p class=\"md-p\"><strong>未验证声明</strong>：以上 QG1–QG4 的对比度数值是本契约在设计期用 WCAG 公式<strong>计算</strong>得到的；QG5 及之后的检查项<strong>在本阶段尚未执行</strong>，需在验收阶段实际运行后才可标记通过。本契约不声称已完成任何浏览器验证。</p>\n<hr class=\"md-hr\"/>\n<h2 class=\"md-h2\">冲突与待定</h2>\n<h3 class=\"md-h3\">冲突 1（需裁决）：门B「深色基线只保留 linear.app」与实测事实矛盾</h3>\n<ul class=\"md-list\"><li><code class=\"md-code\">GATE-B-DECISION.md</code> 第二节写明&quot;<strong>深色基线只保留 linear.app</strong>&quot;。</li><li>但 <code class=\"md-code\">RESEARCH-NOTES.md</code> 的 R1 条目实测：linear 的 canvas 为 <code class=\"md-code\">#010102</code>，相对亮度 <strong>0.00033</strong>，<strong>远低于</strong>门A A1 的下限 <code class=\"md-code\">#0d2431</code>（0.01569）。也就是说，被指定为&quot;深色基线&quot;的那一个来源，恰恰是<strong>不能采用其底色</strong>的那一个。</li><li><code class=\"md-code\">RESEARCH-NOTES.md</code> 的 R2b 条目实测：<code class=\"md-code\">warp</code> 的 canvas <code class=\"md-code\">#2b2622</code> 相对亮度 <strong>0.02015</strong>，是唯一<strong>实测通过 A1 亮度下限</strong>的深色基线。而门B 的候选裁决表<strong>未列出 R2b</strong>。</li></ul>\n<p class=\"md-p\"><strong>本契约的处理</strong>：由于 A1 已把底色定死为 <code class=\"md-code\">#0d2431</code>，&quot;深色基线&quot;的实际作用只能是提供<strong>层次结构关系</strong>（surface 阶梯、hairline 分隔、克制 CTA），而非提供色值。本契约因此采用 R2 的层次机制（四级 surface 阶梯 + hairline + 极性反转分区带），<strong>不从 linear 取任何色值</strong>，也<strong>不采用 R2b（warp）的任何内容</strong>（其状态仍未裁决，且其暖调与潮汐冷调相反）。</p>\n<p class=\"md-p\"><strong>仍待澄清</strong>：门D 之前请明确——深色层次结构是否参考 warp（R2b）？若参考，需要给出明确的采纳范围（仅层次关系，不取色相与色值）。<strong>本契约不自行掩盖此冲突，也不替裁决。</strong></p>\n<h3 class=\"md-h3\">冲突 2（已按 B2 落实）：方向稿第三屏被 R3 观察推翻</h3>\n<ul class=\"md-list\"><li><code class=\"md-code\">DIRECTION.md</code> 第四节的第三屏为&quot;一日两次涨落的说明&quot;，原意是用文字讲潮汐节律。</li><li><code class=\"md-code\">OBSERVATION-tideguide.md</code> 第二节明确推翻：Tide Guide 官网<strong>不解释潮汐原理</strong>，用曲线本身承担全部表达，默认访客已知道潮汐是什么。</li><li><strong>处理</strong>：按 B2 与观察结论，第三屏改为 <code class=\"md-code\">CurveInUse</code>——展示曲线的<strong>实际用法</strong>，判断基于页面同一份演示数据的真实读数（见第 8 节与 Do #9）。此冲突已在契约内解决，无需再次裁决。</li></ul>\n<h3 class=\"md-h3\">冲突 3（已解决）：方向稿底色与 A1 自相矛盾</h3>\n<ul class=\"md-list\"><li><code class=\"md-code\">DIRECTION.md</code> 写&quot;深色为主（<code class=\"md-code\">#071a24</code> 一类）&quot;，而门A A1 要求&quot;不暗于 <code class=\"md-code\">#0d2431</code> 级别&quot;。<code class=\"md-code\">#071a24</code> 相对亮度 0.00911 &lt; 0.01569，<strong>方向稿违反了自己被裁决的要求</strong>。</li><li><strong>处理</strong>：门B 已裁决&quot;底色定为 <code class=\"md-code\">#0d2431</code>&quot;。契约采用 <code class=\"md-code\">#0d2431</code>。已解决。</li></ul>\n<h3 class=\"md-h3\">待定项（诚实标注，不编造）</h3>\n<ol class=\"md-list\"><li><strong>演示数据的相位 φ₁ / φ₂ 未定稿。</strong> 契约给出了波形公式（12.42h M2 + 12.00h S2 叠加）与振幅，但两个相位常数需要选定一组能产生合理高低潮时刻（例如高潮在 06:11 与 18:30 附近）的值。此项属于实现期的数值拟合，<strong>契约不预设具体相位</strong>，只要求第三屏与场景卡引用的数值与曲线来自同一组参数。</li><li><strong>曲线采样点数 145 点（每 10 分钟）为设计期取值。</strong> 若实现期发现 375px 宽度下路径点数影响渲染性能，可降低到 73 点（每 20 分钟），但<strong>时间轴的 <code class=\"md-code\">step</code> 与 <code class=\"md-code\">max</code> 必须同步调整</strong>，且键盘单步仍为 10 分钟。需要说明变更。</li><li><strong>&quot;退潮前两小时&quot;的具体窗口时刻未定稿。</strong> 它依赖待定项 1 的相位，实现期由数据算出后回填，不写死。</li><li><strong><code class=\"md-code\">--text-disabled</code> 未达 7:1（4.97:1）</strong> 已在 3.1 声明为有据例外（WCAG 对 disabled 不设要求 + 仅限禁用控件）。若审核方不接受该例外，需要重新取色。</li><li><strong>触控目标 44px 与曲线绘图区的关系</strong>：range 命中区高度取绘图区高度（≥200px），满足要求；但<strong>高潮/低潮 chip 若做成可点击</strong>，其 44px 最小尺寸会与曲线密度冲突——契约的处理是<strong>让 chip 不可点击</strong>（纯标注）。若实现期要求 chip 可交互，需要重新评估。</li><li><strong>本阶段未做任何浏览器渲染验证</strong>，因此&quot;曲线在 375px 下是否视觉拥挤&quot;这类判断<strong>尚无证据</strong>，需在门C 原型阶段用真实截图确认。</li></ol>","source":"# 潮汐 TIDE · 产品页设计契约\n\n> 本文件是阶段 3（原型与契约）的设计契约，结构遵循\n> `.agents/skills/ui-design-agent/references/design-contract.md`。\n> 上游：`DIRECTION.md`（门A 方向稿）、`GATE-A-DECISION.md`（A1–A4）、\n> `RESEARCH-NOTES.md`（门B 候选清单）、`GATE-B-DECISION.md`（B1–B3）、\n> `reference/OBSERVATION-tideguide.md`（R3 实地观察，推翻了方向稿第三屏）。\n>\n> 本阶段**不写实现代码**。契约中的一切数值均为设计期定稿值，实现阶段照此落地。\n> 所有对比度数值由我在设计期用 WCAG 2.x 相对亮度公式（sRGB 线性化 + `(L1+0.05)/(L2+0.05)`）\n> 本地计算得出，未使用浏览器，也未做渲染验证。\n\n---\n\n## 参考基线与授权（authoring workflow 第 2 步）\n\n| 来源 | 路径 / URL | 采用的部分 | 不采用的部分 | 授权 |\n| --- | --- | --- | --- | --- |\n| R1 · awesome-design-md `linear.app` | https://github.com/VoltAgent/awesome-design-md，revision `8147538b4226ae41e2487a9179e3bcc1f68e8554` | 仅关系：单一强调色只出现在少数关键位置（焦点环、主 CTA、数据本体），绝不用于装饰；负字距 | **全部色值**（其 canvas `#010102` 相对亮度 0.00033，远低于 A1 下限；其 `ink-subtle #8a8f98` 在其底色上仅 6.42:1，未达 7:1） | MIT（第三方分析文档，非品牌官方规范；不声称关联） |\n| R2 · awesome-design-md `vercel` | 同上仓库 | 仅层次机制：四级 surface 阶梯 + hairline 分隔 + 极性反转分区带 | **其浅色基调**（实测 canvas `#ffffff`，方向稿误标为深色基线）；其 `mute #888888` 在 `#ffffff` 上仅 3.54:1，作为反面教材记录 | MIT（同上） |\n| R3 · Tide Guide | https://tideguide.com/ | 仅可观察的布局与交互关系：曲线占据主视区、高低潮时刻与潮位直接标在曲线上、圆形游标带读数 | 截图、图标、文案、配色值、代码一律不复制；页面上不得出现其任何素材或品牌元素 | 商业产品，无开源许可，**reference-only** |\n| P1 · 本仓库动效规范 | `.agents/skills/ui-design-agent/references/motion-contract.md` | 具名弹簧预设、降级规则、微编排规则 | — | 本仓库自有；其引用的 `motion` 包为 MIT |\n| A3 · Lucide 图标 | https://lucide.dev | 沿用仓库既有 `lucide-react` 依赖 | 不新增第二套图标库；用量极少 | ISC（实测读 LICENSE 文件） |\n| 字体 | 系统栈 | — | **不引入 JetBrains Mono / Noto Sans SC**（门B Q1 裁决） | 无外部许可义务 |\n\n**R2b（`warp`）状态：未裁决，见文末「冲突与待定」。本契约不采用其任何内容。**\n\n---\n\n## 1. Mission\n\n让一位海钓或赶海的人，在手机上打开页面后**不滚动**就能看到今天的潮位读数，并能用键盘或手指沿时间轴拖动曲线，查清\"今天几点能下水\"。\n\n（界面存在的一句话目的；不含\"提升品牌认知\"这类不可证伪的表述。）\n\n## 2. Brand\n\n- **产品**：潮汐 TIDE —— 潮汐读数与曲线的产品页，第一版为单页 + 一个可真实交互的曲线。\n- **受众**：周末出海钓鱼的人、带孩子赶海的家长。他们**已经知道潮汐是什么**，不需要被科普（R3 观察结论）。\n- **主要任务**：10 秒内看懂\"这个 App 能告诉我今天什么时候能下水\"，并愿意试。\n- **目标载体**：移动端优先的网页（375×812 为首要视口），桌面 1440×900 为次要视口。户外强光与夜间清晨是两种真实使用环境。\n- **内容现实**：\n  - 数据是**本地生成的演示数据**（半日潮正弦叠加），**不是真实潮汐预报**。任何\"预报\"字样必须伴随演示标注（A3）。\n  - 语言：**中文为主，不做双语**（门A 裁决）。\n  - 不接真实数据源（D1 NOAA 本版排除；其授权状态未明文核实）。\n- **非目标**：账号系统、多语言、真实数据接入、后端。\n\n## 3. Style foundations\n\n### 3.1 Color — 语义 token\n\n底色按门A A1 定为 `#0d2431`（相对亮度 **0.01569**），高于方向稿 `#071a24`（0.00911），满足\"不暗于 `#0d2431` 级别\"。\n\n**Surface 阶梯**（借鉴 R2 的四级层次机制，色值自算）：\n\n| Token | 值 | 相对亮度 | 与 canvas 的对比度 | 用途 |\n| --- | --- | ---: | ---: | --- |\n| `--surface-canvas` | `#0d2431` | 0.01569 | 1.000 | 页面底色（A1 定值） |\n| `--surface-1` | `#102937` | 0.01972 | 1.061 | 曲线绘图区背景、极性反转分区带 |\n| `--surface-2` | `#132f3d` | 0.02508 | 1.143 | 场景卡、读数面板 |\n| `--surface-3` | `#163646` | 0.03251 | 1.256 | 高低潮标注 chip、悬浮层 |\n\n**文字与前景 token**（每个值都在其上可能出现的**全部四个 surface** 上计算）：\n\n| Token | 值 | canvas | surface-1 | surface-2 | surface-3 | 结论 |\n| --- | --- | ---: | ---: | ---: | ---: | --- |\n| `--text-primary` | `#e8f1f4` | **13.94:1** | 13.14:1 | 12.20:1 | 11.10:1 | 全通过 ≥7:1 |\n| `--text-secondary` | `#b6cbd4` | **9.50:1** | 8.95:1 | 8.31:1 | **7.56:1** | 全通过 ≥7:1 |\n| `--accent` | `#5ee0d4` | **9.96:1** | 9.39:1 | 8.72:1 | 7.93:1 | 全通过 ≥7:1 |\n| `--caution`（演示标注） | `#f2c14e` | **9.52:1** | 8.97:1 | 8.33:1 | 7.58:1 | 全通过 ≥7:1 |\n| `--text-disabled` | `#7b93a0` | **4.97:1** | — | — | — | **未达 7:1，见下方例外声明** |\n\n**非文字 token**（WCAG 1.4.11 非文字对比度 ≥ 3:1）：\n\n| Token | 值 | canvas | surface-1 | surface-2 | surface-3 | 用途 |\n| --- | --- | ---: | ---: | ---: | ---: | --- |\n| `--border-strong` | `#4a8fa8` | 4.40:1 | 4.15:1 | 3.85:1 | **3.51:1** | range 轨道可见边界、输入类控件边界 |\n| `--focus-ring` | `#5ee0d4` | 9.96:1 | 9.39:1 | 8.72:1 | 7.93:1 | 焦点环（= `--accent`） |\n| `--hairline` | `#2a5a72` | 2.13:1 | 2.01:1 | 1.87:1 | 1.70:1 | 1px 分隔线（纯装饰，不承载信息） |\n| `--gridline` | `#20495e` | 1.66:1 | 1.56:1 | 1.45:1 | 1.32:1 | 曲线网格（纯装饰） |\n\n**配对 token（实心底上的文字）**：\n\n| 组合 | 对比度 |\n| --- | ---: |\n| `#0d2431` 文字在 `--accent #5ee0d4` 实心主按钮上 | **9.96:1** |\n| `#0d2431` 文字在 `--caution #f2c14e` 实心演示徽章上 | **9.52:1** |\n\n**渐变填充上限（硬性）**：曲线下方填充用 `--accent` 从 **opacity 0.10** 线性衰减到 0（在 surface-1 上）。0.10 时混合色为 `#183b47`，其上 `--text-primary` 10.44:1、`--text-secondary` **7.11:1**。**不得高于 0.10**：0.12 时 `--text-secondary` 降到 6.74:1，跌破 7:1。\n\n**`--text-disabled` 例外声明（诚实标注）**：`#7b93a0` 在 canvas 上为 **4.97:1**，未达本契约 7:1 的正文门槛。理由是 WCAG 对 disabled 控件不设对比度要求，且该 token **只允许用于已禁用控件**，不得用于任何需要阅读的内容。若实现阶段发现它被用在了可读文本上，即为缺陷。\n\n### 3.2 Type\n\n**纯系统字体栈（门B Q1 裁决，不引入任何 web 字体）**：\n\n- 中文 / 正文（reading）：`-apple-system, BlinkMacSystemFont, \"PingFang SC\", \"Microsoft YaHei\", \"Noto Sans CJK SC\", sans-serif`\n- 数字 / 读数（instrumentation）：`ui-monospace, \"SF Mono\", Menlo, Consolas, monospace`\n- 数字必须同时声明 `font-variant-numeric: tabular-nums;` 与 `font-feature-settings: \"tnum\" 1;`（**B1**）\n\n**字阶（模块化，大标题用 clamp() 流体）**：\n\n| 角色 | 字号 | 行高 | 字距 | 字体 |\n| --- | --- | --- | --- | --- |\n| Display（首屏主张） | `clamp(28px, 6vw, 40px)` | 1.2 | `-0.02em` | 中文栈 |\n| Heading（分屏标题） | `clamp(20px, 4vw, 28px)` | 1.3 | `-0.01em` | 中文栈 |\n| **Reading（潮位读数）** | `clamp(40px, 12vw, 56px)` | 1.0 | `-0.02em` | **数字栈 + tabular-nums** |\n| Body | `16px` | 1.6 | `0` | 中文栈 |\n| Label / 单位 | `13px` | 1.4 | `0.01em` | 中文栈；纯数字单位用数字栈 |\n| Micro（徽章、刻度） | `12px` | 1.3 | `0.02em` | 视内容 |\n\n**读数不跳动规则（B1 的可测形式）**：`.tide-readout` 与所有时间/潮位数字必须用数字栈 + `tabular-nums`，且读数容器设 `min-width`（按最大字宽 `--readout-min-ch: 6ch` 预留），使 0.00→9.99 的数值变化不引起横向重排。\n\n### 3.3 Spacing\n\n- 基准 **4px**，默认步进 **8px**。\n- 刻度：`4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 96`。\n- 分屏纵向内边距：`clamp(48px, 10vw, 96px)`。\n- 内容最大宽度 `1120px`，正文列最大 `68ch`。\n- **不出现\"卡片套卡片\"**：一个 section 内最多一层 `--surface-2` 卡片。\n\n### 3.4 Depth\n\n- **不使用 box-shadow 表达层级。** 层级由 surface 阶梯 + 1px hairline 承担（R2 的层次机制）。\n- **禁止玻璃拟态与 backdrop-filter 堆叠**（DIRECTION 明确禁止，且属 anti-pattern）。\n- 唯一允许的\"环\"是焦点环：`2px solid var(--focus-ring)` + `outline-offset: 2px`。\n- 曲线绘图区以 `--surface-1` 底 + `--hairline` 边框与页面区分，不加阴影。\n\n### 3.5 Radius\n\n`--radius-sm: 4px`（徽章、chip）／`--radius-md: 8px`（按钮、输入）／`--radius-lg: 12px`（场景卡、绘图区外框）。不使用全圆角药丸形按钮，不使用\"大图标 + 圆角\"的 hero 模板。\n\n### 3.6 Motion — 具名预设（取自 `motion-contract.md`，不自定义弹簧参数）\n\n| 动作 | 触发 | 初始 → 最终 | 动画属性 | 预设 | 为什么用这个预设 |\n| --- | --- | --- | --- | --- | --- |\n| 游标 + 读数跟随时间轴 | 拖动 / 方向键改值 | 当前位置 → 新值对应位置 | `transform: translateX()`、读数文本（瞬时） | **snappy**（stiffness 400 / damping 30 / mass 0.8） | 高频直接操作，必须即时响应、不可滞后；motion-contract 将 snappy 指定给\"频繁控件\" |\n| 时间轴松开后吸附到最近刻度 | `change` / `pointerup` | 当前值 → 最近刻度 | `transform: translateX()` | **snappy**（同上） | 同为高频控件；吸附是状态变化，不是装饰 |\n| 曲线入场描线（draw-on） | 首次进入视口 | `stroke-dashoffset: 1` → `0` | `stroke-dashoffset` | **elegant**（stiffness 100 / damping 20 / mass 1） | 大面积媒体的首次呈现，需要平滑落定；snappy 会显得仓促 |\n| 分区带 / 场景卡组入场 | 进入视口 | `opacity 0` + `translateY(12px)` + `blur(4px)` → 最终态 | `opacity`、`transform`、`filter` | **elegant** + stagger **0.06s** | motion-contract 微编排规定 0.04–0.08s，0.06s 为起点；只作用于有界可见组（3 张卡），不作用于长列表 |\n| CTA / 场景卡 hover | `pointer: fine` 悬停 | `scale 1.02`、`translateY(-2px)` | `transform` | **snappy** | motion-contract 规定 hover 反馈 onset ≤150ms、scale 1.01–1.03、translateY −2px，用 Snappy |\n| 可按压控件按下 | pointerdown / keydown active | `scale 0.98` | `transform` | **snappy** | motion-contract 规定按压约 0.98，且键盘 active 须有等价状态 |\n| 当前时刻标记脉冲 | 持续（**全页唯一循环动画**） | `opacity 0.55` ↔ `1.0`，周期 2400ms | `opacity` | **不用弹簧**（弹簧用于状态位移，不用于循环）；用 `cubic-bezier(0.16, 1, 0.3, 1)` 的非空间缓动 | 循环动画不是状态变化；motion-contract 的循环例外只允许 loading 旋转，此处为数据位置提示，故限定为纯透明度且必须可降级 |\n| 减少动效（`prefers-reduced-motion: reduce`） | 全站 | — | 移除描线、位移、blur、stagger、脉冲；`opacity` 直接到最终值 | 无 | motion-contract：移除空间移动与不必要循环，直接呈现语义最终态 |\n\n**不使用 `playful`（280/18/1.2）**：本页是数据仪表，读数与游标需要精确落定；弹跳会干扰读数可读性。motion-contract 明确允许在 bounce 会分散注意或损害可读性时改用 Snappy 或 Elegant——此处是适用该例外的情形。\n\n**被禁止的动效写法**：`transition: all`；泛型 `ease`；线性 UI 位移（`linear` 只允许用于 loading 旋转）；动画布局属性（`width`/`height`/`top`/`left`）；对同一物理弹簧同时指定 `duration`。\n\n## 4. Accessibility\n\n- **对比度目标**：正文与读数 **≥ 7:1**（A1 的门槛，高于 WCAG AA 的 4.5:1，为户外强光留余量）。非文字控件边界 ≥ 3:1。上表已逐项给出实测值。\n- **键盘路径（A4 / B3）**：\n  1. `Tab` 进入时间轴控件（`input[type=range]`）→ 可见焦点环 `2px solid #5ee0d4` + `outline-offset: 2px`，在全部四个 surface 上对比度 ≥ 7.93:1。\n  2. `ArrowLeft` / `ArrowRight` = ±1 步（**10 分钟**）；`PageUp` / `PageDown` = ±6 步（1 小时）；`Home` / `End` = 00:00 / 24:00。\n  3. 改值时读数通过 `role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"` 播报，形如\"14:20，潮位 1.32 米，涨潮中\"。\n  4. `Tab` 离开控件后，曲线保留最后位置，不重置。\n- **视觉隐藏规则（A4 / B3，硬性）**：range 控件**不得**使用 `display: none` 或 `visibility: hidden`（会使控件失去可聚焦性与可操作性）。允许的写法：控件保持 `position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; appearance: none; cursor: pointer; touch-action: none;`，覆盖在 SVG 绘图区之上；或 `appearance: none` 后以自定义轨道绘制但保留在布局中。两种写法都必须保留原生键盘行为与可见焦点环（焦点环画在容器上，由 `:focus-visible` 驱动）。\n- **触控**：所有可点目标 ≥ 44×44 CSS px。range 的命中区域高度 = 绘图区高度（≥ 200px），不缩到滑块的视觉尺寸。\n- **减少动效结果**：`prefers-reduced-motion: reduce` 下，曲线直接以最终形态呈现（无描线），无 pulse，无 stagger，无位移；读数仍然随键盘改值即时更新（连续直接操作不属于被禁止的过渡动画）。\n- **语言**：`<html lang=\"zh-CN\">`。数字用 `lang=\"en\"` 局部标注或直接依赖数字栈，避免中文标点影响数字排版。页面不做双语。\n- **文字缩放**：布局在浏览器文字缩放至 **200%** 时不出现横向滚动、遮挡或裁切；读数与曲线保持可读。\n- **不依赖颜色传达信息**：涨潮/退潮同时用文字标签（\"涨潮中\"/\"退潮中\"），不只用颜色。演示数据状态同时用文字徽章，不只靠 `--caution` 颜色。\n\n## 5. Writing tone\n\n- **语气**：直接、给数、不说教。受众是懂潮汐的人，不解释潮汐是什么。\n- **用词**：说\"潮位\"\"退潮前两小时\"\"几点能下水\"，不说\"探索海洋的奥秘\"。\n- **\"预报\"一词的硬性规则（A3）**：全站**默认不使用**\"预报\"字样，改用\"潮位读数\"\"潮汐曲线\"。**若任何位置出现\"预报\"二字**（含 `<title>`、meta description、正文、按钮、图片 alt），必须在**同一视觉块内、与\"预报\"字样的垂直间距 ≤ 8px** 处放置 `<DemoDataBadge>`，文案为「演示数据」，不得只放在页脚。\n- **演示标注的完整清单（A3 可测）**：以下位置必须出现演示标注——① 首屏读数块旁；② 曲线绘图区标题或右上角；③ 任何含\"预报\"的句子旁；④ 页脚下载区；⑤ 场景卡中引用的任何具体时刻/潮位数值旁。\n- **CTA 框架（attention → interest → desire → action）**：\n  - 主 CTA：`看今天的潮汐`（action 指向页面内的曲线，不是下载）。\n  - 次 CTA（页脚）：`下载 App（演示）`——括号内的\"演示\"是文案的一部分，不是可选装饰。\n  - 首屏主张必须含**具体收益**与**今日读数**，不用\"重新定义潮汐体验\"这类空话。\n- **数字写法**：潮位保留 2 位小数 + 单位（`1.32 米`）；时间用 24 小时制（`14:20`），与海钓人群的日常一致。\n- **不出现**：感叹号堆叠、emoji、\"立即\"\"马上\"式催促、无法证伪的形容词（\"极致\"\"丝滑\"\"沉浸式\"）。\n\n## 6. Rules: Do\n\n1. 底色固定 `--surface-canvas: #0d2431`；一切层次靠 `--surface-1/2/3` 阶梯（每级与 canvas 对比度 1.061 / 1.143 / 1.256）。\n2. 正文与读数用 `--text-primary #e8f1f4`（canvas 上 13.94:1）；次要文字用 `--text-secondary #b6cbd4`（canvas 上 9.50:1，最亮的 surface-3 上仍 7.56:1）。\n3. 强调色 `--accent #5ee0d4` **只用于三处**：数据本体（曲线描边、当前读数、游标高亮）、焦点环、唯一的主 CTA 填充。**其他一律不用**（R1 的关系）。\n4. 所有数字用 `ui-monospace, \"SF Mono\", Menlo, Consolas, monospace` + `tabular-nums`，读数容器预留 `6ch` 最小宽度（B1）。\n5. 时间轴是真正的 `input[type=range]`，`min=0 max=144 step=1`（每步 10 分钟，覆盖 00:00–24:00），可聚焦、可方向键操作（A4）。\n6. 首屏在 **375×812 不滚动** 的区域内完整呈现：品牌、一句主张、**今日潮位读数（数字 + 单位 + 涨/退潮状态）**、主 CTA（A2）。读数是静态渲染的，不依赖滚动触发或动画完成。\n7. 任何\"预报\"字样旁 ≤8px 内必须有「演示数据」徽章（A3）；徽章为 `--caution` 实心或描边，文字对比度 ≥ 7:1。\n8. 曲线的高潮/低潮在曲线上**直接标注时刻与潮位**（R3 的行业惯例），不靠图例解释。\n9. 第三屏展示**曲线的实际用法**：用真实读数给出判断（如\"退潮前两小时是赶海窗口\"），数值必须来自页面同一份演示数据（B2/R3 修正）。\n10. 键盘焦点环始终可见：`2px solid #5ee0d4`，`outline-offset: 2px`，在 `:focus-visible` 下触发。\n11. 层级用 1px `--hairline` 与 surface 阶梯表达，不用阴影、不用玻璃拟态。\n12. 动效只引用 `motion-contract.md` 的具名预设：snappy（高频控件）、elegant（大面积入场）；循环动画只有当前时刻脉冲一个。\n13. `prefers-reduced-motion: reduce` 下移除描线、位移、blur、stagger、脉冲，直接给最终态。\n14. 触控目标 ≥ 44×44px；range 的命中区覆盖整个绘图区。\n15. 用文字 + 数字 + 图标共同表达状态，不依赖颜色单独承载信息。\n\n## 7. Rules: Don't\n\n对照 `design-contract.md` 的 anti-pattern 清单，本方向明确禁止：\n\n| 维度 | 禁止项 | 依据 |\n| --- | --- | --- |\n| Type | 把等宽字体当\"科技感\"装饰用于正文；把 Inter/Roboto/Arial 当品牌表达；\"大图标 + 标题 + 圆角\"的模板式 hero | design-contract anti-pattern 表 |\n| Color | 纯黑 `#000` 或纯白 `#fff` 作底；**cyan-on-dark 的 AI 味配色**——因此强调色必须限定在\"数据 + 焦点环 + 单一 CTA\"三处，且底色是带蓝的中性深色而非黑；默认深色 + 辉光；紫色渐变；霓虹描边 | 同上；DIRECTION 禁止渐变球 |\n| Color | **照搬上游品牌色值**（linear `#010102` / `ink-subtle #8a8f98`、vercel `#888888`） | A1 + R1/R2 实测：`#8a8f98` 仅 6.42:1、`#888888` 仅 3.54:1，均不达标 |\n| Color | 弱化文字凭观感取色而不计算 | R2 实测 `#888888` 3.54:1 为反面教材 |\n| Space | 卡片到处用、卡片套卡片；hero-metric 模板；一切居中 | design-contract anti-pattern 表 |\n| Depth | 玻璃拟态、backdrop-filter 堆叠、用 box-shadow 表达层级 | DIRECTION 明确禁止 |\n| Motion | 动画布局属性（`width`/`height`/`top`/`left`）；到处用 bounce/elastic；`transition: all`；泛型 `ease`；线性 UI 位移；对同一弹簧同时给 duration | motion-contract |\n| Motion | 使用 `playful` 弹簧 | 数据仪表读数需精确落定，弹跳损害可读性 |\n| Interaction | 每个按钮都是主按钮；重复信息 | design-contract anti-pattern 表 |\n| Interaction | 用纯鼠标拖拽的 `div` 作时间轴；用 `display:none` / `visibility:hidden` 隐藏 range | A4 + **B3**（会使控件失去可聚焦性） |\n| Interaction | 用颜色单独传达涨/退潮或演示数据状态 | WCAG 1.4.1；本契约 Do #15 |\n| Responsive | 在移动端隐藏曲线或读数 | design-contract anti-pattern 表；A2 要求首屏见读数 |\n| Content | 解释潮汐原理、科普\"一天两次涨落\" | R3 观察：目标用户不需要被科普，第三屏改为展示曲线用法 |\n| Content | 出现\"预报\"而不标演示数据 | **A3** |\n| Asset | 引用 Tide Guide 的任何截图/图标/文案/配色；使用 Unsplash/Pexels 海景照片；使用 unDraw 插画 | R3 reference-only；曲线本身就是 hero，加照片会稀释数据优先定位 |\n| Asset | 引入 JetBrains Mono / Noto Sans SC / 任何 web 字体文件 | 门B Q1 裁决 |\n| Asset | 声称与 Linear / Vercel / Warp 存在关联 | 三者均为第三方 MIT 分析文档，非官方规范 |\n\n## 8. Output structure\n\n单页产品页，五个纵向 section，移动端单列：\n\n| # | Section | 内容 | 关键约束 |\n| --- | --- | --- | --- |\n| 1 | `Hero` | 品牌标记 + 一句价值主张 + **今日潮位读数**（数字 + 单位 + 涨/退潮文字 + 「演示数据」徽章）+ 主 CTA「看今天的潮汐」 | **A2**：375×812 与 1440×900 均不滚动即可见完整读数块 |\n| 2 | `TideCurve` | 自绘 SVG 潮汐曲线 + 覆盖其上的 `input[type=range]` 时间轴 + 跟随读数 + 高低潮标注 + 当前时刻脉冲 | **A4/B3**：range 可聚焦、可方向键；**B1**：读数 tabular-nums |\n| 3 | `CurveInUse` | **展示曲线的实际用法**：2–3 条基于真实读数的判断（如\"退潮前两小时是赶海窗口，今天是 12:40–14:40\"），数值取自同一份演示数据 | **B2/R3 修正**：不解释潮汐原理 |\n| 4 | `Scenarios` | 海钓 / 赶海 / 摄影 三张场景卡（移动端纵向堆叠，≥1024px 横排三列），每卡含一个 Lucide 图标 + 标题 + 一句收益 + 一个来自演示数据的具体数值 | 图标克制，不堆砌 |\n| 5 | `Footer` | 下载引导（`下载 App（演示）`）+ 演示数据声明 + 数据生成方式一句话说明 | 标注为演示 |\n\n**必需的媒体与资产**：自绘 SVG 曲线（无外部图表库）、`lucide-react` 图标（仅 sun / moon / waves / map-pin / clock 中按需取用）、系统字体栈。**无图片、无字体文件、无第三方图表库。**\n\n**响应式断点策略**：base `320px` / `640px` / `1024px` / `1280px`。\n\n| 范围 | 曲线绘图区高 | 场景卡 | 首屏读数 |\n| --- | --- | --- | --- |\n| < 640 | 200px | 1 列堆叠 | 完整可见（A2 关键视口） |\n| 640–1023 | 240px | 1 列堆叠 | 完整可见 |\n| 1024–1279 | 280px | 3 列 | 完整可见 |\n| ≥ 1280 | 320px | 3 列 | 完整可见 |\n\n## 9. Component expectations\n\n### 9.1 `TideCurve`（自绘 SVG）\n\n- **数据**：`h(t) = 1.50 + 1.15·sin(2πt/12.42 + φ₁) + 0.35·sin(2πt/12.00 + φ₂)`（米，相对最低低潮面），t 为当日小时数，采样 145 点（00:00–24:00，每 10 分钟一点）。\n  - **基准面偏移（实现期补注，2026-09-16）**：常数项 `1.50 = 1.15 + 0.35`（两个分潮振幅之和）。原式未含此项时，纯正弦叠加会取负值，而\"相对最低低潮面\"按定义不为负——原文公式与文字自相矛盾。加偏移后曲线全程 ≥0，最低点 0.09 m。裁决见 `IMPLEMENTATION-DECISIONS.md` 第 1 条。\n- **状态**：\n  - **默认**：曲线描边 `--accent` 2px，在 `--surface-1` 上对比度 9.39:1；下方渐变填充 `--accent` opacity 0.10 → 0；网格 `--gridline` 1px；高低潮 chip 用 `--surface-3` 底 + `--text-primary`（11.10:1）。\n  - **拖动中**：游标 `translateX` 用 snappy 跟随；读数同步更新（文本更新是瞬时语义变化，不加过渡）；拖动期间禁止触发入场编排重放。\n  - **焦点**：绘图区容器获得 `:focus-visible` 时显示 `2px solid #5ee0d4` + `outline-offset: 2px`；range 保持可聚焦。\n  - **减少动效**：无描线、无脉冲；曲线直接呈现最终形态；游标位移瞬时生效（连续直接操作不受动效规则约束）。\n  - **加载**：显示静态骨架（`--surface-1` 底 + `--gridline` 网格 + 一行文字\"正在载入今日潮位…\"），**不使用旋转 spinner**（motion-contract 允许以进度文案替代旋转反馈）。骨架高度与最终绘图区一致，避免布局跳动。\n  - **空**：数据不可用时显示指导性空态：\"今日潮位数据暂不可用。演示数据生成失败——刷新页面可重新生成。\" 不显示空白绘图区，不显示假的曲线。\n- **无障碍**：SVG 加 `role=\"img\"` 与 `aria-label`，概述当日高低潮时刻；交互语义由 range 承载，不在 SVG 上重复绑定键盘事件。\n\n### 9.2 `TideTimeAxis`（`input[type=range]`，A4/B3 核心）\n\n- **属性**：`min=0 max=144 step=1 value=<当前时刻步数>`，`aria-label=\"潮汐时间轴，方向键调整，每步 10 分钟\"`，`aria-valuetext=\"14:20，潮位 1.32 米，退潮中\"`。\n- **键盘**：`ArrowLeft/Right` ±1；`PageUp/PageDown` ±6；`Home/End` → 0/144。全部为原生行为，不自行实现。\n- **状态**：\n  - **默认**：`opacity: 0`，`position: absolute; inset: 0; width: 100%; height: 100%; appearance: none; cursor: pointer; touch-action: none;`，覆盖在 SVG 之上。**不使用 `display:none` 或 `visibility:hidden`（B3）。**\n  - **hover / 拖动中**：`cursor: grabbing`；视觉反馈画在 SVG 游标上，不改变 range 本身。\n  - **焦点**：`:focus-visible` 在容器上绘制 `2px solid #5ee0d4`，offset 2px；焦点环在全部 surface 上 ≥ 7.93:1。\n  - **禁用**：`disabled` 时轨道边界用 `--border-strong`（canvas 上 4.40:1），文字用 `--text-disabled #7b93a0`（4.97:1，例外见 3.1），且**不做任何动效**。\n  - **减少动效**：行为不变（键盘操作不是动画）；只移除游标的弹簧跟随，改为瞬时定位。\n\n### 9.3 `TideReadout`（读数）\n\n- **内容**：`14:20`（数字栈）+ `1.32 米`（数字栈，tabular-nums）+ `退潮中`（中文栈文字标签，不只靠颜色）。\n- **B1 实现**：`font-variant-numeric: tabular-nums` + `font-feature-settings: \"tnum\" 1`；容器 `min-width: 6ch`（`--readout-min-ch`），使 0.00→9.99 变化不引起重排。\n- **状态**：默认 / 拖动中（即时更新）/ 焦点（随控件）/ 减少动效（不变）/ 加载（显示 `—.— 米` 占位，宽度与终值一致）/ 空（显示 `暂无数据`）。\n- **无障碍**：`role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"`，播报整句而非碎片。\n\n### 9.4 `NowMarker`（当前时刻标记）\n\n- **状态**：默认（`--text-primary` 描边圆点，在 `--surface-1` 上 13.14:1）；脉冲中（`opacity 0.55 ↔ 1.0`，周期 2400ms，`cubic-bezier(0.16,1,0.3,1)`，全页唯一循环动画）；减少动效（静态，opacity 1）；加载/空（不渲染）。\n\n### 9.5 `HighLowAnnotation`（高低潮标注）\n\n- 直接标在曲线峰值/谷值旁：`6:11` / `1.86 米`（R3 的行业惯例）。chip 用 `--surface-3` 底 + `--text-primary`，对比度 11.10:1。窄视口下只保留潮位数值、时刻移入 `aria-label`，**不隐藏信息**（禁止移动端隐藏关键内容）。\n- 状态：默认 / 被游标遮挡时（chip 自动翻转方向或降低 z-index 让游标在上）/ 减少动效（不变）/ 加载 / 空（不渲染）。\n\n### 9.6 `ScenarioCard` × 3（海钓 / 赶海 / 摄影）\n\n- **结构**：一个 Lucide 图标（20px，`--accent`）+ 标题（Heading 级）+ 一句收益（Body）+ 一个来自演示数据的具体数值（数字栈 + tabular-nums）。\n- **状态**：\n  - **默认**：`--surface-2` 底，`--hairline` 1px 边框，`--text-secondary` 正文（8.31:1）。\n  - **hover（仅 `pointer: fine`）**：`scale 1.02` + `translateY(-2px)`，snappy，onset ≤150ms。\n  - **focus-visible**：`2px solid #5ee0d4` 环。\n  - **按压**：`scale 0.98`，snappy；键盘 active 有等价状态。\n  - **减少动效**：hover 位移与缩放移除，只保留边框/底色变化。\n  - **加载**：卡片骨架保持相同高度（避免布局跳动）。\n  - **空**：若某场景的示例数值不可用，显示\"今日示例数据不可用\"，不留空白。\n- 三张卡构成一个有界可见组，入场用 elegant + 0.06s stagger；**不在每次重渲染或筛选时重放**。\n\n### 9.7 `DemoDataBadge`（演示数据徽章，A3 的执行单元）\n\n- **形态**：实心 `--caution #f2c14e` 底 + `#0d2431` 文字，对比度 **9.52:1**；或描边变体（`--caution` 文字在 `--surface-2` 上 8.33:1）。\n- **文案**：固定「演示数据」四字，可加 `aria-label=\"本页潮位为演示数据，非真实潮汐预报\"`。\n- **位置规则（可测）**：与任何\"预报\"字样的垂直间距 ≤ 8px，且在同一视觉块内。\n- **状态**：默认 / 加载（不渲染）/ 空（不渲染）。\n\n### 9.8 `PrimaryCTA` / `SecondaryCTA`\n\n- 主：`--accent` 实心底 + `#0d2431` 文字（9.96:1），`--radius-md`，高 ≥ 48px。\n- 次：透明底 + `--border-strong` 1px 边框（canvas 上 4.40:1）+ `--text-primary` 文字。\n- 状态：默认 / hover（snappy，onset ≤150ms）/ 按压（scale 0.98）/ focus-visible（焦点环）/ disabled（`--text-disabled`，无动效）/ 加载（宽度不变的进度文案，不用 spinner）。**同一视口内只允许一个主 CTA。**\n\n## 10. Quality gates\n\n以下为验收阶段逐条执行的检查项，每条都有可复现的方法。对应 `references/acceptance.md` 的功能证据、渲染证据、无障碍与质量三节。\n\n| # | 检查项 | 方法 | 通过判据 |\n| --- | --- | --- | --- |\n| QG1 | **A1 底色与正文对比度** | 用 WCAG 相对亮度公式计算 `--text-primary` 与 `--surface-canvas` | ≥ 7:1（本契约实测 13.94:1）；canvas 相对亮度 ≥ 0.01569 |\n| QG2 | **A1 全部文字 token 达标** | 对 `--text-primary` / `--text-secondary` / `--accent` / `--caution` × 四个 surface 逐一计算 | 全部 ≥ 7:1（最紧一格：`--text-secondary` 在 `--surface-3` 上 7.56:1） |\n| QG3 | **A1 非文字 token 达标** | 计算 `--border-strong` / `--focus-ring` × 使用到的 surface | ≥ 3:1（最紧一格：`--border-strong` 在 `--surface-3` 上 3.51:1） |\n| QG4 | **渐变填充上限** | 计算 `--accent` 在 surface-1 上 opacity 0.10 的混合色上 `--text-secondary` 的对比度 | ≥ 7:1（实测 7.11:1）；代码中填充 opacity 不得超过 0.10 |\n| QG5 | **A2 首屏见读数** | 在 375×812 与 1440×900 视口下截取首屏（不滚动） | 今日潮位读数（时间 + 潮位值 + 单位 + 涨/退潮文字 + 演示徽章）完整可见，无裁切 |\n| QG6 | **A3 \"预报\"字样标注** | 全站文案逐条检索\"预报\"二字（含 `<title>`、meta、alt） | 每一处都在 ≤8px 内有「演示数据」徽章；无未标注的\"预报\" |\n| QG7 | **A3 演示标注覆盖** | 检查第 5 节列出的 5 个必标位置 | 5 处全部存在 |\n| QG8 | **A4/B3 range 可聚焦** | 代码检索确认无 `display:none` / `visibility:hidden` 作用于时间轴控件 | 零命中 |\n| QG9 | **A4 键盘走查** | 键盘 `Tab` 到时间轴 → 方向键 / PageUp/PageDown / Home/End | 焦点环可见；`ArrowRight` 使读数 +10 分钟；`Home`/`End` 到 00:00/24:00；读数通过 `aria-live` 播报 |\n| QG10 | **B1 tabular-nums** | 代码检查 + 把读数从 `0.00` 逐步改到 `9.99` 并比较容器宽度 | 两处均声明 `tabular-nums`/`\"tnum\" 1`；读数宽度零变化（截图对比） |\n| QG11 | **B2 第三屏落实** | 检查第三屏文案 | 不出现潮汐原理解释；每条判断都由页面同一份演示数据的真实数值支撑 |\n| QG12 | **曲线全部状态** | 逐一触发默认 / 拖动中 / 焦点 / 减少动效 / 加载 / 空 | 六个状态均按 9.1 定义呈现；加载与空态不显示假曲线；骨架高度与终态一致，无布局跳动 |\n| QG13 | **三张场景卡状态** | 触发默认 / hover / focus / 按压 / 减少动效 / 加载 / 空 | 均按 9.6 定义呈现；hover 仅在 `pointer: fine` 生效；键盘有等价反馈 |\n| QG14 | **焦点环全站可见** | 键盘遍历所有可交互元素 | 每个元素都有 `2px solid #5ee0d4` 环；环在四个 surface 上 ≥ 3:1（实测 ≥ 7.93:1） |\n| QG15 | **触控目标** | 测量所有可点元素与 range 命中区 | 全部 ≥ 44×44 CSS px |\n| QG16 | **减少动效** | 模拟 `prefers-reduced-motion: reduce` 后重走主流程 | 无描线、无位移、无 blur、无 stagger、无脉冲；语义最终态立即呈现；键盘操作仍有效 |\n| QG17 | **动效中断与反转** | 在曲线描线中途快速滚动离开再返回；快速来回拖动时间轴 | 语义状态正确，无卡死，不扣留输入；未出现两套动画系统写同一 transform |\n| QG18 | **200% 文字缩放** | 浏览器文字缩放至 200% | 无横向滚动、无遮挡、无裁切；读数与曲线可读 |\n| QG19 | **响应式矩阵** | 375×812、768×1024、1440×900，加 320px 窄宽 | 无重叠、无裁切标签、无 body 级横向滚动、主 CTA 不被隐藏；曲线与读数在全部宽度可见（禁止移动端隐藏关键功能） |\n| QG20 | **字体回退** | 在无 SF Mono 的环境渲染 | 回退到 Menlo / Consolas / 通用 monospace，读数仍等宽对齐，无布局破坏 |\n| QG21 | **素材边界** | 检索产物中是否含 Tide Guide 素材、品牌色值照搬、外部字体/图片 | 零命中；无任何品牌关联声明 |\n| QG22 | **无禁用写法** | 代码检索 `transition: all`、泛型 `ease`、动画布局属性、`playful` 弹簧 | 零命中 |\n| QG23 | **主 CTA 唯一** | 每个视口内统计主按钮数量 | ≤ 1 |\n| QG24 | **自动化无障碍检查** | 运行可用的自动化检查工具 | 报告实际覆盖率与全部发现；**不作为人工检查的替代** |\n\n**未验证声明**：以上 QG1–QG4 的对比度数值是本契约在设计期用 WCAG 公式**计算**得到的；QG5 及之后的检查项**在本阶段尚未执行**，需在验收阶段实际运行后才可标记通过。本契约不声称已完成任何浏览器验证。\n\n---\n\n## 冲突与待定\n\n### 冲突 1（需裁决）：门B「深色基线只保留 linear.app」与实测事实矛盾\n\n- `GATE-B-DECISION.md` 第二节写明\"**深色基线只保留 linear.app**\"。\n- 但 `RESEARCH-NOTES.md` 的 R1 条目实测：linear 的 canvas 为 `#010102`，相对亮度 **0.00033**，**远低于**门A A1 的下限 `#0d2431`（0.01569）。也就是说，被指定为\"深色基线\"的那一个来源，恰恰是**不能采用其底色**的那一个。\n- `RESEARCH-NOTES.md` 的 R2b 条目实测：`warp` 的 canvas `#2b2622` 相对亮度 **0.02015**，是唯一**实测通过 A1 亮度下限**的深色基线。而门B 的候选裁决表**未列出 R2b**。\n\n**本契约的处理**：由于 A1 已把底色定死为 `#0d2431`，\"深色基线\"的实际作用只能是提供**层次结构关系**（surface 阶梯、hairline 分隔、克制 CTA），而非提供色值。本契约因此采用 R2 的层次机制（四级 surface 阶梯 + hairline + 极性反转分区带），**不从 linear 取任何色值**，也**不采用 R2b（warp）的任何内容**（其状态仍未裁决，且其暖调与潮汐冷调相反）。\n\n**仍待澄清**：门D 之前请明确——深色层次结构是否参考 warp（R2b）？若参考，需要给出明确的采纳范围（仅层次关系，不取色相与色值）。**本契约不自行掩盖此冲突，也不替裁决。**\n\n### 冲突 2（已按 B2 落实）：方向稿第三屏被 R3 观察推翻\n\n- `DIRECTION.md` 第四节的第三屏为\"一日两次涨落的说明\"，原意是用文字讲潮汐节律。\n- `OBSERVATION-tideguide.md` 第二节明确推翻：Tide Guide 官网**不解释潮汐原理**，用曲线本身承担全部表达，默认访客已知道潮汐是什么。\n- **处理**：按 B2 与观察结论，第三屏改为 `CurveInUse`——展示曲线的**实际用法**，判断基于页面同一份演示数据的真实读数（见第 8 节与 Do #9）。此冲突已在契约内解决，无需再次裁决。\n\n### 冲突 3（已解决）：方向稿底色与 A1 自相矛盾\n\n- `DIRECTION.md` 写\"深色为主（`#071a24` 一类）\"，而门A A1 要求\"不暗于 `#0d2431` 级别\"。`#071a24` 相对亮度 0.00911 < 0.01569，**方向稿违反了自己被裁决的要求**。\n- **处理**：门B 已裁决\"底色定为 `#0d2431`\"。契约采用 `#0d2431`。已解决。\n\n### 待定项（诚实标注，不编造）\n\n1. **演示数据的相位 φ₁ / φ₂ 未定稿。** 契约给出了波形公式（12.42h M2 + 12.00h S2 叠加）与振幅，但两个相位常数需要选定一组能产生合理高低潮时刻（例如高潮在 06:11 与 18:30 附近）的值。此项属于实现期的数值拟合，**契约不预设具体相位**，只要求第三屏与场景卡引用的数值与曲线来自同一组参数。\n2. **曲线采样点数 145 点（每 10 分钟）为设计期取值。** 若实现期发现 375px 宽度下路径点数影响渲染性能，可降低到 73 点（每 20 分钟），但**时间轴的 `step` 与 `max` 必须同步调整**，且键盘单步仍为 10 分钟。需要说明变更。\n3. **\"退潮前两小时\"的具体窗口时刻未定稿。** 它依赖待定项 1 的相位，实现期由数据算出后回填，不写死。\n4. **`--text-disabled` 未达 7:1（4.97:1）** 已在 3.1 声明为有据例外（WCAG 对 disabled 不设要求 + 仅限禁用控件）。若审核方不接受该例外，需要重新取色。\n5. **触控目标 44px 与曲线绘图区的关系**：range 命中区高度取绘图区高度（≥200px），满足要求；但**高潮/低潮 chip 若做成可点击**，其 44px 最小尺寸会与曲线密度冲突——契约的处理是**让 chip 不可点击**（纯标注）。若实现期要求 chip 可交互，需要重新评估。\n6. **本阶段未做任何浏览器渲染验证**，因此\"曲线在 375px 下是否视觉拥挤\"这类判断**尚无证据**，需在门C 原型阶段用真实截图确认。\n"},{"path":"docs/GATE-CD-DECISION.md","status":"ok","kind":"markdown","reason":null,"bytes":5420,"html":"<h1 class=\"md-h1\">门C/D 裁决记录（审核官扮演真实用户）</h1>\n<p class=\"md-p\"><strong>裁决时间</strong>：2026-09-16 <strong>裁决人</strong>：审核官（同门A/B） <strong>裁决对象</strong>：<code class=\"md-code\">demo/tide-app/docs/DESIGN.md</code>（子代理 B 产出，375 行）</p>\n<h2 class=\"md-h2\">一、先做核实</h2>\n<p class=\"md-p\">契约代理提出了一个<strong>否定性主张</strong>：我的门B 裁决表漏掉了 R2b（warp）。这类主张要核实。</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>主张</th><th>核实方式</th><th>结果</th></tr></thead><tbody><tr><td>R2b（warp）在候选清单里被提名</td><td>读 <code class=\"md-code\">RESEARCH-NOTES.md</code> 第 80/123 行</td><td>✅ 为真，且明确建议&quot;取代 R2 作深色基线&quot;</td></tr><tr><td>我的门B 裁决表未列 R2b</td><td>读 <code class=\"md-code\">GATE-B-DECISION.md</code> 候选表</td><td>✅ <strong>确认遗漏</strong>——这是我的错</td></tr><tr><td>warp canvas 为 <code class=\"md-code\">#2b2622</code>，通过 A1 下限</td><td>实际 <code class=\"md-code\">design-md.mjs pull warp</code> + 读文件</td><td>✅ 为真，24,438 字节，<code class=\"md-code\">canvas: #2b2622</code></td></tr></tbody></table></div>\n<p class=\"md-p\"><strong>结论：契约代理是对的，我的门B 裁决漏了一项。</strong> 它没有自行掩盖，而是标为&quot;未裁决&quot;并提交裁决——这正是正确做法。</p>\n<h2 class=\"md-h2\">二、对遗漏项的补裁决（门B 补充）</h2>\n<p class=\"md-p\"><strong>R2b（warp）—— 裁决：不采用</strong></p>\n<p class=\"md-p\">理由两条：</p>\n<ol class=\"md-list\"><li><strong>色相相反</strong>。warp 是暖调（canvas <code class=\"md-code\">#2b2622</code> 是暖褐），而本产品是深海冷调。把它当深色基线会引入方向冲突。</li><li><strong>底色已定死</strong>。A1 已裁定底色为 <code class=\"md-code\">#0d2431</code>，&quot;深色基线&quot;的实际作用只剩&quot;提供层次结构关系&quot;，而这一点 R2 的层次机制已经覆盖。</li></ol>\n<blockquote class=\"md-quote\"><p class=\"md-p\">补充说明：遗漏本身是流程缺陷，不是内容问题。已在本记录中登记，不作为契约的负担。<strong>契约不采用 warp 的处理是正确的。</strong></p></blockquote>\n<h2 class=\"md-h2\">三、契约逐项审阅</h2>\n<h3 class=\"md-h3\">3.1 可证伪性 — 通过</h3>\n<p class=\"md-p\">契约里每个数值都是可验证的：底色 <code class=\"md-code\">#0d2431</code>（相对亮度 0.01569）、正文 13.94:1、次要文字 9.50:1（最亮 surface 上 7.56:1）、焦点环 9.96:1。<strong>全部是计算值，不是&quot;看起来对比够&quot;。</strong></p>\n<p class=\"md-p\">特别认可一点：它把<strong>次要文字也纳入计算</strong>（9.50:1，最亮 surface 上仍 7.56:1）。这正是子代理 A 发现的 vercel 反面教材（<code class=\"md-code\">#888888</code> 只有 3.54:1）带来的正确反应。</p>\n<h3 class=\"md-h3\">3.2 上游色值的处理 — 通过</h3>\n<p class=\"md-p\">契约明确写了&quot;linear 全部色值不采用&quot;（其 <code class=\"md-code\">#010102</code> 亮度 0.00033 远低于 A1 下限、<code class=\"md-code\">ink-subtle</code> 6.42:1 未达 7:1），&quot;vercel 浅色基调不采用&quot;。<strong>只取关系不取色值</strong>，这是对的。</p>\n<h3 class=\"md-h3\">3.3 动效绑定具名预设 — 通过</h3>\n<p class=\"md-p\">7 条动效逐条绑定 <code class=\"md-code\">motion-contract.md</code> 的具名预设（不是自定义弹簧参数），符合规范。</p>\n<h3 class=\"md-h3\">3.4 无障碍 — 通过，但有一处我要追问</h3>\n<p class=\"md-p\">键盘映射完整（方向键 10 分钟 / PageUp 1 小时 / Home-End），<code class=\"md-code\">display:none</code> 禁令明确（B3 要求落实）。</p>\n<blockquote class=\"md-quote\"><p class=\"md-p\"><strong>追问</strong>：契约把高低潮 chip 处理为<strong>不可点击</strong>以规避 44px 触控目标冲突。这个规避方式我认可（不硬凑触控尺寸），但要在实现阶段确认：<strong>不可点击的信息不应看起来像按钮</strong>。如果 chip 有边框和背景，用户会以为能点。实现时要确保它是纯信息展示样式。</p></blockquote>\n<h3 class=\"md-h3\">3.5 演示数据标注（A3）— 通过</h3>\n<p class=\"md-p\">&quot;预报&quot;默认禁用，出现则 ≤8px 内有徽章，给出 5 个必标位置的完整清单。</p>\n<h3 class=\"md-h3\">3.6 第三屏改动（B2 落实）— 通过</h3>\n<p class=\"md-p\">第三屏从&quot;解释潮汐原理&quot;改为 <code class=\"md-code\">CurveInUse</code>（展示基于真实读数的判断）。这是 R3 实地观察带来的正确修正。</p>\n<h3 class=\"md-h3\">3.7 质量门 — 通过</h3>\n<p class=\"md-p\">QG1–QG24 每条给出方法与判据，且<strong>诚实标注&quot;尚未执行&quot;</strong>（未做渲染验证）。这个标注是对的——设计期不该声称验证过。</p>\n<h2 class=\"md-h2\">四、门C（原型）裁决</h2>\n<p class=\"md-p\"><strong>说明</strong>：契约代理按范围约束<strong>未产出原型图</strong>（它的任务只含 DESIGN.md）。原型环节按 <code class=\"md-code\">chain-flow.md</code> 三路径处理：</p>\n<ul class=\"md-list\"><li>路径 a（生图）：本环境无生图能力</li><li>路径 b（用户生图）：用户不参与本轮</li><li><strong>路径 c（成品截图拼板）</strong>：采用</li></ul>\n<p class=\"md-p\">但路径 c 在本项目的特殊性：<strong>核心是曲线，而同类产品的曲线形态已由 R3 实地观察取得证据</strong>（<code class=\"md-code\">reference/OBSERVATION-tideguide.md</code> + 截图）。</p>\n<blockquote class=\"md-quote\"><p class=\"md-p\"><strong>门C 裁决：通过（路径 c）</strong>。依据是：R3 的实地观察已确认&quot;曲线即 hero&quot;的做法在真实产品中成立，且记录了其信息层级（曲线占主视区、高低潮标注直接贴曲线、圆形游标带读数）。这构成原型阶段的视觉依据。</p>\n<p class=\"md-p\"><strong>但必须记录一条限制</strong>：我们观察的是 Tide Guide 的<strong>营销页截图</strong>，不是它的可交互 App。所以&quot;拖动时读数如何响应&quot;<strong>仍无证据</strong>，实现阶段按 <code class=\"md-code\">motion-contract.md</code> 预设自行决定，且<strong>不得声称与 Tide Guide 的交互一致</strong>。</p></blockquote>\n<h2 class=\"md-h2\">五、门D（契约）裁决</h2>\n<blockquote class=\"md-quote\"><p class=\"md-p\"><strong>门D 裁决：通过</strong>。契约可作为实现依据。</p></blockquote>\n<p class=\"md-p\">附 3 项实现阶段必须满足的要求：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\"><thead><tr><th>#</th><th>要求</th><th>核对方式</th></tr></thead><tbody><tr><td>D1</td><td>高低潮 chip 若不可点击，不得呈现按钮样式（无边框/背景/悬停态）</td><td>实现后截图 + 代码检查</td></tr><tr><td>D2</td><td>全部色值按契约取值，不得在实现中&quot;微调&quot;；任何改动需回到契约</td><td>产物 CSS 提取对比</td></tr><tr><td>D3</td><td>QG1–QG24 在验证阶段实际执行并留痕，未执行的如实标注</td><td>验收记录逐条</td></tr></tbody></table></div>\n<h2 class=\"md-h2\">六、继承的强制要求汇总</h2>\n<p class=\"md-p\">实现阶段必须同时满足：<strong>A1–A4（门A）+ B1–B3（门B）+ D1–D3（门D）</strong>，共 10 项。</p>\n<h3 class=\"md-h3\">下一步</h3>\n<p class=\"md-p\">进入阶段 4（代码开发，子代理 C）。</p>","source":"# 门C/D 裁决记录（审核官扮演真实用户）\n\n**裁决时间**：2026-09-16\n**裁决人**：审核官（同门A/B）\n**裁决对象**：`demo/tide-app/docs/DESIGN.md`（子代理 B 产出，375 行）\n\n## 一、先做核实\n\n契约代理提出了一个**否定性主张**：我的门B 裁决表漏掉了 R2b（warp）。这类主张要核实。\n\n| 主张 | 核实方式 | 结果 |\n| --- | --- | --- |\n| R2b（warp）在候选清单里被提名 | 读 `RESEARCH-NOTES.md` 第 80/123 行 | ✅ 为真，且明确建议\"取代 R2 作深色基线\" |\n| 我的门B 裁决表未列 R2b | 读 `GATE-B-DECISION.md` 候选表 | ✅ **确认遗漏**——这是我的错 |\n| warp canvas 为 `#2b2622`，通过 A1 下限 | 实际 `design-md.mjs pull warp` + 读文件 | ✅ 为真，24,438 字节，`canvas: #2b2622` |\n\n**结论：契约代理是对的，我的门B 裁决漏了一项。** 它没有自行掩盖，而是标为\"未裁决\"并提交裁决——这正是正确做法。\n\n## 二、对遗漏项的补裁决（门B 补充）\n\n**R2b（warp）—— 裁决：不采用**\n\n理由两条：\n\n1. **色相相反**。warp 是暖调（canvas `#2b2622` 是暖褐），而本产品是深海冷调。把它当深色基线会引入方向冲突。\n2. **底色已定死**。A1 已裁定底色为 `#0d2431`，\"深色基线\"的实际作用只剩\"提供层次结构关系\"，而这一点 R2 的层次机制已经覆盖。\n\n> 补充说明：遗漏本身是流程缺陷，不是内容问题。已在本记录中登记，不作为契约的负担。**契约不采用 warp 的处理是正确的。**\n\n## 三、契约逐项审阅\n\n### 3.1 可证伪性 — 通过\n\n契约里每个数值都是可验证的：底色 `#0d2431`（相对亮度 0.01569）、正文 13.94:1、次要文字 9.50:1（最亮 surface 上 7.56:1）、焦点环 9.96:1。**全部是计算值，不是\"看起来对比够\"。**\n\n特别认可一点：它把**次要文字也纳入计算**（9.50:1，最亮 surface 上仍 7.56:1）。这正是子代理 A 发现的 vercel 反面教材（`#888888` 只有 3.54:1）带来的正确反应。\n\n### 3.2 上游色值的处理 — 通过\n\n契约明确写了\"linear 全部色值不采用\"（其 `#010102` 亮度 0.00033 远低于 A1 下限、`ink-subtle` 6.42:1 未达 7:1），\"vercel 浅色基调不采用\"。**只取关系不取色值**，这是对的。\n\n### 3.3 动效绑定具名预设 — 通过\n\n7 条动效逐条绑定 `motion-contract.md` 的具名预设（不是自定义弹簧参数），符合规范。\n\n### 3.4 无障碍 — 通过，但有一处我要追问\n\n键盘映射完整（方向键 10 分钟 / PageUp 1 小时 / Home-End），`display:none` 禁令明确（B3 要求落实）。\n\n> **追问**：契约把高低潮 chip 处理为**不可点击**以规避 44px 触控目标冲突。这个规避方式我认可（不硬凑触控尺寸），但要在实现阶段确认：**不可点击的信息不应看起来像按钮**。如果 chip 有边框和背景，用户会以为能点。实现时要确保它是纯信息展示样式。\n\n### 3.5 演示数据标注（A3）— 通过\n\n\"预报\"默认禁用，出现则 ≤8px 内有徽章，给出 5 个必标位置的完整清单。\n\n### 3.6 第三屏改动（B2 落实）— 通过\n\n第三屏从\"解释潮汐原理\"改为 `CurveInUse`（展示基于真实读数的判断）。这是 R3 实地观察带来的正确修正。\n\n### 3.7 质量门 — 通过\n\nQG1–QG24 每条给出方法与判据，且**诚实标注\"尚未执行\"**（未做渲染验证）。这个标注是对的——设计期不该声称验证过。\n\n## 四、门C（原型）裁决\n\n**说明**：契约代理按范围约束**未产出原型图**（它的任务只含 DESIGN.md）。原型环节按 `chain-flow.md` 三路径处理：\n\n- 路径 a（生图）：本环境无生图能力\n- 路径 b（用户生图）：用户不参与本轮\n- **路径 c（成品截图拼板）**：采用\n\n但路径 c 在本项目的特殊性：**核心是曲线，而同类产品的曲线形态已由 R3 实地观察取得证据**（`reference/OBSERVATION-tideguide.md` + 截图）。\n\n> **门C 裁决：通过（路径 c）**。依据是：R3 的实地观察已确认\"曲线即 hero\"的做法在真实产品中成立，且记录了其信息层级（曲线占主视区、高低潮标注直接贴曲线、圆形游标带读数）。这构成原型阶段的视觉依据。\n>\n> **但必须记录一条限制**：我们观察的是 Tide Guide 的**营销页截图**，不是它的可交互 App。所以\"拖动时读数如何响应\"**仍无证据**，实现阶段按 `motion-contract.md` 预设自行决定，且**不得声称与 Tide Guide 的交互一致**。\n\n## 五、门D（契约）裁决\n\n> **门D 裁决：通过**。契约可作为实现依据。\n\n附 3 项实现阶段必须满足的要求：\n\n| # | 要求 | 核对方式 |\n| --- | --- | --- |\n| D1 | 高低潮 chip 若不可点击，不得呈现按钮样式（无边框/背景/悬停态） | 实现后截图 + 代码检查 |\n| D2 | 全部色值按契约取值，不得在实现中\"微调\"；任何改动需回到契约 | 产物 CSS 提取对比 |\n| D3 | QG1–QG24 在验证阶段实际执行并留痕，未执行的如实标注 | 验收记录逐条 |\n\n## 六、继承的强制要求汇总\n\n实现阶段必须同时满足：**A1–A4（门A）+ B1–B3（门B）+ D1–D3（门D）**，共 10 项。\n\n### 下一步\n\n进入阶段 4（代码开发，子代理 C）。\n"}],"nodeIds":["stage:contract","gate:C","gate:D","rework:contract"]},{"id":"build","name":"交互实现","gates":["F"],"summary":"围绕设计契约完成界面、状态与交互，复用项目既有能力。","output":"可运行界面 / 交互状态","evidence":"代码 + 静态核查 + MCP 调用痕迹","decisionPoint":false,"status":"passed","stageNote":"46 个单元测试通过；类型检查通过。","evidenceActual":"src/TideCurve.tsx · src/App.tsx","isCurrent":false,"gateNodes":[{"id":"F","title":"门F MCP 调用门禁","detail":"验收记录中的逐环节调用痕迹（服务器 / 工具 / 结果）","status":"passed","lane":"sub"}],"artifacts":[{"path":"src/TideCurve.tsx","status":"ok","kind":"text","reason":null,"bytes":16347,"html":null,"source":"/**\n * 第二屏 `TideCurve`：自绘 SVG 潮汐曲线 + 覆盖其上的 `input[type=range]` 时间轴。\n *\n * 不可协商的约束：\n *   A4 — 时间轴是可聚焦的 `input[type=range]`，方向键可调。\n *   B1 — 所有数字 tabular-nums，读数容器 min-width。\n *   B3 — range 不得用 `display:none` / `visibility:hidden`；本文件用 `opacity:0` + 定位覆盖。\n *   D1 — 高低潮标注不可点击，不得呈现按钮样式（无边框、无背景、无悬停态、无 cursor:pointer）。\n *   契约 9.1 — 曲线状态：默认 / 拖动中 / 焦点 / 减少动效 / 加载 / 空，六个都要有。\n */\n\nimport { useCallback, useId, useLayoutEffect, useRef, useState } from 'react';\nimport { motion } from 'motion/react';\nimport { Clock } from 'lucide-react';\nimport {\n  AXIS_MAX,\n  DAY_MINUTES,\n  SAMPLE_INTERVAL_MINUTES,\n  formatClock,\n  formatLevel,\n  minutesForStep,\n  readoutSentence,\n  stepForMinutes,\n  trendAtMinutes,\n  trendLabel,\n  type TideDay,\n  type TidePoint,\n  type TideTrend,\n} from './model.ts';\nimport {\n  buildAreaPath,\n  buildGridLe
