<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>组件面板（改进后）</title>
<style>
/* fallback 改进：库内 impeccable 批评维度（层次/间距节奏/状态覆盖/可供性）——非任何外部工具输出 */
:root { --ink: #26343d; --brand: #177656; --line: #d9e2e7; --paper: #fafcfd; --muted: #61717d; }
body { margin: 0; font-family: "PingFang SC", sans-serif; background: var(--paper); color: var(--ink); padding: 32px; }
h2 { font-size: 20px; letter-spacing: 0.01em; margin: 0 0 20px; }
.card { background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: 10px; padding: 20px 22px; margin-bottom: 16px; transition: box-shadow 160ms cubic-bezier(0.16,1,0.3,1), transform 160ms cubic-bezier(0.16,1,0.3,1); }
.card:hover { box-shadow: 0 8px 22px rgba(38,52,61,0.10); transform: translateY(-2px); }
.card h3 { margin: 0 0 6px; font-size: 16px; }
.card p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
button { padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-size: 14px; cursor: pointer; transition: background 140ms ease; }
button:hover { background: #f0f4f6; }
button:focus-visible { outline: 2px solid #2566c4; outline-offset: 2px; }
</style></head>
<body>
<h2>组件面板</h2>
<div class="card"><h3>数据同步</h3><p>每 5 分钟自动同步一次</p><button>配置</button></div>
<div class="card"><h3>成员管理</h3><p>3 位成员 · 1 位待邀请</p><button>管理</button></div>
<div class="card"><h3>导出记录</h3><p>最近导出：昨天 14:20</p><button>查看</button></div>
</body></html>
