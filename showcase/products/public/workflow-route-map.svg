<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1580" font-family="'PingFang SC','Noto Sans SC',sans-serif" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1116"/><stop offset="1" stop-color="#10171e"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64798a"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2fbf8f"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e05d5d"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d9fff"/>
    </marker>
  </defs>

  <rect width="1400" height="1580" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="52" y="52" fill="#e8eef2" font-size="28" font-weight="800">UI Design Agent Kit · 真实工作流路线图</text>
  <text x="52" y="82" fill="#9db0bc" font-size="14">九环节串行主链 + 六道门穿插 · 来源：chain-flow.md v7.2 + gate-protocol.md + workflow-stages.json</text>
  <text x="52" y="104" fill="#64798a" font-size="12.5">红色 = 用户裁决停止点 · 绿色 = 执行环节 · 紫色 = 契约/计划 · 灰色虚线 = MCP 留痕（非停止点）· 同一时刻最多 1 个活跃子代理</text>

  <!-- ① 用户入口 -->
  <rect x="52" y="126" width="1296" height="64" rx="12" fill="rgba(77,159,255,0.08)" stroke="#4d9fff" stroke-opacity="0.6"/>
  <text x="76" y="156" fill="#4d9fff" font-size="16" font-weight="800">👤 用户发出口语指令</text>
  <text x="76" y="178" fill="#9db0bc" font-size="13">「做一个落地页 / 一支视频 / 一个 3D 展示 / 改这个组件」——任意设计任务，一段话即可进入流程</text>

  <!-- 箭头 → 环节 0 -->
  <line x1="700" y1="190" x2="700" y2="218" stroke="#4d9fff" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- 环节 0：需求接收 -->
  <rect x="52" y="220" width="1296" height="56" rx="12" fill="rgba(47,191,143,0.06)" stroke="#2fbf8f" stroke-opacity="0.5"/>
  <text x="76" y="248" fill="#2fbf8f" font-size="15" font-weight="800">环节 0 · 需求接收（主代理）</text>
  <text x="76" y="268" fill="#9db0bc" font-size="12.5">任务分类 + 范围澄清 + 判定 S/M/L 级别（级别由用户逐页确认，不是代理自分类）</text>

  <!-- 箭头 → 环节 1 -->
  <line x1="700" y1="276" x2="700" y2="304" stroke="#64798a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 环节 1：初步设计稿 -->
  <rect x="52" y="306" width="1296" height="70" rx="12" fill="rgba(47,191,143,0.06)" stroke="#2fbf8f" stroke-opacity="0.5"/>
  <text x="76" y="334" fill="#2fbf8f" font-size="15" font-weight="800">环节 1 · 初步设计稿（主代理 · 不写代码）</text>
  <text x="76" y="356" fill="#9db0bc" font-size="12.5">方向稿：named proven baseline URL + 拟抄关系 + 结构草案 + 动效意图 + 三旋钮值 + 品味档案 honoring/violating 声明</text>

  <!-- 箭头 → 门 A -->
  <line x1="700" y1="376" x2="700" y2="404" stroke="#64798a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 【门 A】 -->
  <rect x="52" y="406" width="1296" height="56" rx="10" fill="rgba(224,93,93,0.08)" stroke="#e05d5d" stroke-opacity="0.75"/>
  <text x="76" y="434" fill="#e05d5d" font-size="15" font-weight="800">【门 A】你看设计稿 ── 用户裁决停止点</text>
  <text x="76" y="452" fill="#9db0bc" font-size="12.5">不通过 → 调整方向稿重新呈交；通过 → 进入素材检索；裁决前不产出任何目标视觉产物</text>
  <!-- 回退 A -->
  <path d="M 1348 434 L 1374 434 L 1374 340 L 1348 340" fill="none" stroke="#e05d5d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)" opacity="0.8"/>
  <text x="1380" y="390" fill="#e05d5d" font-size="11" opacity="0.85">不通过→重出</text>

  <!-- 箭头 → 环节 2 -->
  <line x1="700" y1="462" x2="700" y2="490" stroke="#64798a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 环节 2：素材检索 -->
  <rect x="52" y="492" width="1296" height="70" rx="12" fill="rgba(47,191,143,0.06)" stroke="#2fbf8f" stroke-opacity="0.5"/>
  <text x="76" y="520" fill="#2fbf8f" font-size="15" font-weight="800">环节 2 · 素材检索（子代理 A · 串行第一步）</text>
  <text x="76" y="542" fill="#9db0bc" font-size="12.5">灵感库 + uak-design-system + Motion 文档 + source-catalog.md → 候选清单（来源 URL + 截图 + 授权边界 + 改编边界）；读 material-scouting.md 排序</text>

  <!-- 箭头 → 环节 3 -->
  <line x1="700" y1="562" x2="700" y2="590" stroke="#64798a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 环节 3：素材选择 -->
  <rect x="52" y="592" width="1296" height="56" rx="12" fill="rgba(47,191,143,0.06)" stroke="#2fbf8f" stroke-opacity="0.5"/>
  <text x="76" y="620" fill="#2fbf8f" font-size="15" font-weight="800">环节 3 · 素材选择（用户 + 主代理）</text>
  <text x="76" y="640" fill="#9db0bc" font-size="12.5">用户勾选选定素材集；自绘例外需书面记录检索无果 + 用户批准；未选素材不得进入后续</text>

  <!-- 箭头 → 门 B -->
  <line x1="700" y1="648" x2="700" y2="676" stroke="#64798a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 【门 B】 -->
  <rect x="52" y="678" width="1296" height="56" rx="10" fill="rgba(224,93,93,0.08)" stroke="#e05d5d" stroke-opacity="0.75"/>
  <text x="76" y="706" fill="#e05d5d" font-size="15" font-weight="800">【门 B】你勾选素材 ── 用户裁决停止点</text>
  <text x="76" y="724" fill="#9db0bc" font-size="12.5">用户选定前不写实现代码、不下载未批准资产；自绘例外在此门申请</text>

  <!-- 箭头 → 计划锁定 -->
  <line x1="700" y1="734" x2="700" y2="762" stroke="#64798a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 计划汇总 + 用户锁定 -->
  <rect x="52" y="764" width="1296" height="70" rx="10" fill="rgba(143,123,245,0.07)" stroke="#8f7bf5" stroke-opacity="0.6"/>
  <text x="76" y="792" fill="#8f7bf5" font-size="15" font-weight="800">计划汇总 + 用户锁定（主代理 · 计划模式终点）</text>
  <text x="76" y="814" fill="#9db0bc" font-size="12.5">Mission / 受众 / 主链路 / 选定素材 / 契约草案 / 原型 brief / 验收标准；用户明确「确认计划」后才切执行模式</text>

  <!-- 箭头 → 环节 4 -->
  <line x1="700" y1="834" x2="700" y2="862" stroke="#64798a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 环节 4：初步原型 -->
  <rect x="52" y="864" width="1296" height="70" rx="12" fill="rgba(47,191,143,0.06)" stroke="#2fbf8f" stroke-opacity="0.5"/>
  <text x="76" y="892" fill="#2fbf8f" font-size="15" font-weight="800">环节 4 · 初步原型（不写代码 · 三路径任选）</text>
  <text x="76" y="914" fill="#9db0bc" font-size="12.5">a. agent 生图 / b. 用户用提示词生图 / c. 成品截图拼板（参考数据）；禁止装依赖、起服务、写实现</text>

  <!-- 箭头 → 门 C -->
  <line x1="700" y1="934" x2="700" y2="962" stroke="#64798a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 【门 C】 -->
  <rect x="52" y="964" width="1296" height="56" rx="10" fill="rgba(224,93,93,0.08)" stroke="#e05d5d" stroke-opacity="0.75"/>
  <text x="76" y="992" fill="#e05d5d" font-size="15" font-weight="800">【门 C】你看原型 ── 用户裁决停止点</text>
  <text x="76" y="1010" fill="#9db0bc" font-size="12.5">不通过 → 调素材或回计划模式；通过 → 进入设计契约；禁止直接写实现代码</text>
  <!-- 回退 C -->
  <path d="M 1348 992 L 1374 992 L 1374 898 L 1348 898" fill="none" stroke="#e05d5d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)" opacity="0.8"/>
  <text x="1380" y="948" fill="#e05d5d" font-size="11" opacity="0.85">不通过→重出</text>

  <!-- 箭头 → 环节 5 -->
  <line x1="700" y1="1020" x2="700" y2="1048" stroke="#64798a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 环节 5：设计契约 -->
  <rect x="52" y="1050" width="1296" height="70" rx="12" fill="rgba(143,123,245,0.07)" stroke="#8f7bf5" stroke-opacity="0.6"/>
  <text x="76" y="1078" fill="#8f7bf5" font-size="15" font-weight="800">环节 5 · 设计契约（子代理 B · 串行第二步）</text>
  <text x="76" y="1100" fill="#9db0bc" font-size="12.5">DESIGN.md：Mission / 语义 token / Do-Don't / 动效参数 / 响应式断点 / 验收门；读 design-contract.md + motion-contract.md</text>

  <!-- 箭头 → 门 D -->
  <line x1="700" y1="1120" x2="700" y2="1148" stroke="#64798a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 【门 D】 -->
  <rect x="52" y="1150" width="1296" height="56" rx="10" fill="rgba(143,123,245,0.07)" stroke="#8f7bf5" stroke-opacity="0.65"/>
  <text x="76" y="1178" fill="#8f7bf5" font-size="15" font-weight="800">【门 D】契约确认 ── 大项目 / 动效复杂时强制</text>
  <text x="76" y="1196" fill="#9db0bc" font-size="12.5">你确认后子代理 C 才开工；小任务可省略但需在计划中声明；裁决前不进入实现</text>

  <!-- 箭头 → 环节 6 -->
  <line x1="700" y1="1206" x2="700" y2="1234" stroke="#64798a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 环节 6：代码开发 -->
  <rect x="52" y="1236" width="1296" height="70" rx="12" fill="rgba(47,191,143,0.06)" stroke="#2fbf8f" stroke-opacity="0.5"/>
  <text x="76" y="1264" fill="#2fbf8f" font-size="15" font-weight="800">环节 6 · 代码开发（子代理 C · 串行第三步）</text>
  <text x="76" y="1286" fill="#9db0bc" font-size="12.5">基于 DESIGN.md 产出可运行页面；装配优先 &gt; 手写；每段代码经 detail-critique 内环自检；MCP 调用痕迹随做随记</text>

  <!-- 箭头 → 门 F -->
  <line x1="700" y1="1306" x2="700" y2="1330" stroke="#64798a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 【门 F】 -->
  <rect x="52" y="1332" width="1296" height="36" rx="6" fill="none" stroke="#64798a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="76" y="1356" fill="#64798a" font-size="13">【门 F】MCP 调用留痕（Motion / Context7 / shadcn / Playwright / Stitch / ZImageTurbo / Remotion CLI）── 非停止点，无调用痕迹不得宣称完成</text>

  <!-- 箭头 → 环节 7 -->
  <line x1="700" y1="1368" x2="700" y2="1396" stroke="#64798a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 环节 7 + 门 E -->
  <rect x="52" y="1398" width="1296" height="90" rx="12" fill="rgba(224,93,93,0.09)" stroke="#e05d5d" stroke-opacity="0.8"/>
  <rect x="52" y="1398" width="1296" height="5" rx="2" fill="#e05d5d"/>
  <text x="76" y="1428" fill="#e05d5d" font-size="16" font-weight="800">环节 7 · 多轮交互动态验收 ── 【门 E】每轮用户勾选，直到确认</text>
  <text x="76" y="1450" fill="#9db0bc" font-size="13">每轮：真实浏览器走查 → 逐页问题清单（P0/P1/P2 + 证据锚点）→ 你勾选要改的 → 一轮有证据修复 → 再走查</text>
  <text x="76" y="1472" fill="#9db0bc" font-size="13">未修复 P0 不得宣称完成；市面优秀产品替换建议随清单呈交；你确认后才进入交付入库</text>
  <!-- 门 E 自循环 -->
  <path d="M 1348 1442 L 1382 1442 L 1382 1408 L 1348 1408" fill="none" stroke="#e05d5d" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="1388" y="1430" fill="#e05d5d" font-size="12" font-weight="700">下一轮</text>

  <!-- 箭头 → 环节 8 -->
  <line x1="700" y1="1488" x2="700" y2="1516" stroke="#2fbf8f" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- 环节 8：交付入库 -->
  <rect x="52" y="1518" width="1296" height="56" rx="12" fill="rgba(47,191,143,0.1)" stroke="#2fbf8f" stroke-opacity="0.8"/>
  <text x="76" y="1546" fill="#2fbf8f" font-size="16" font-weight="800">环节 8 · 交付入库（构建 + 证据 + 提交推送 + ACCEPTANCE.md）</text>
  <text x="76" y="1566" fill="#9db0bc" font-size="13">三连验证绿（verify / test / prompt:build）→ --no-ff merge main → Pages 部署核验 → results.json 留证</text>

  <!-- 左侧阶段标尺 -->
  <g opacity="0.7">
    <text x="22" y="248" fill="#2fbf8f" font-size="11" text-anchor="middle" transform="rotate(-90 22 248)">环节 0 · 需求</text>
    <text x="22" y="340" fill="#2fbf8f" font-size="11" text-anchor="middle" transform="rotate(-90 22 340)">环节 1 · 方向稿</text>
    <text x="22" y="434" fill="#e05d5d" font-size="11" text-anchor="middle" transform="rotate(-90 22 434)">门 A</text>
    <text x="22" y="526" fill="#2fbf8f" font-size="11" text-anchor="middle" transform="rotate(-90 22 526)">环节 2 · 检索</text>
    <text x="22" y="620" fill="#2fbf8f" font-size="11" text-anchor="middle" transform="rotate(-90 22 620)">环节 3 · 选择</text>
    <text x="22" y="706" fill="#e05d5d" font-size="11" text-anchor="middle" transform="rotate(-90 22 706)">门 B</text>
    <text x="22" y="798" fill="#8f7bf5" font-size="11" text-anchor="middle" transform="rotate(-90 22 798)">计划锁定</text>
    <text x="22" y="898" fill="#2fbf8f" font-size="11" text-anchor="middle" transform="rotate(-90 22 898)">环节 4 · 原型</text>
    <text x="22" y="992" fill="#e05d5d" font-size="11" text-anchor="middle" transform="rotate(-90 22 992)">门 C</text>
    <text x="22" y="1084" fill="#8f7bf5" font-size="11" text-anchor="middle" transform="rotate(-90 22 1084)">环节 5 · 契约</text>
    <text x="22" y="1178" fill="#8f7bf5" font-size="11" text-anchor="middle" transform="rotate(-90 22 1178)">门 D</text>
    <text x="22" y="1270" fill="#2fbf8f" font-size="11" text-anchor="middle" transform="rotate(-90 22 1270)">环节 6 · 代码</text>
    <text x="22" y="1350" fill="#64798a" font-size="11" text-anchor="middle" transform="rotate(-90 22 1350)">门 F · 留痕</text>
    <text x="22" y="1442" fill="#e05d5d" font-size="11" text-anchor="middle" transform="rotate(-90 22 1442)">环节 7 · 门 E</text>
    <text x="22" y="1546" fill="#2fbf8f" font-size="11" text-anchor="middle" transform="rotate(-90 22 1546)">环节 8 · 交付</text>
  </g>
</svg>
